<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#5FBE9B">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="奶豆加油站">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<title>奶豆加油站 · 小学生成长平台</title>
<style>
  :root{
    /* 主色：绿色调（清新童趣绿） */
    --green:#5FBE9B;
    --green-deep:#3E9E7E;
    --green-soft:#DCF2EA;
    /* 辅助点缀：嫩黄 / 天蓝 */
    --yellow:#FBE39C;
    --yellow-soft:#FEF6DD;
    --blue:#9AD3EC;
    --blue-soft:#E6F4FC;
    --cream:#FAFBF5;       /* 背景：微绿暖白 */
    --card:#FFFFFF;
    --ink:#4B4742;
    --muted:#9C968C;
    --line:#E9E4DA;
    --good:#7AC59B;
    --shadow:0 6px 18px rgba(95,150,120,.16);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;height:100%;}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;
    background:var(--cream);color:var(--ink);font-size:15px;line-height:1.5;
    overscroll-behavior:none;
  }
  button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit;}
  input,select,textarea{font-family:inherit;font-size:15px;}

  /* layout */
  #app{display:flex;min-height:100vh;}
  #sidebar{
    width:240px;flex:0 0 240px;background:linear-gradient(180deg,#EAF7F1,#F4FBF8);
    border-right:1px solid var(--line);display:flex;flex-direction:column;
    padding:18px 12px;gap:6px;position:relative;z-index:30;
  }
  .brand{display:flex;align-items:center;gap:10px;padding:6px 8px 14px;}
  .brand .logo{
    width:42px;height:42px;border-radius:14px;background:var(--green);
    display:flex;align-items:center;justify-content:center;font-size:24px;
    box-shadow:var(--shadow);color:#fff;
  }
  .brand .name{font-weight:800;font-size:20px;color:var(--green-deep);}
  .brand .sub{font-size:11px;color:var(--muted);}
  .starbox{
    margin:0 4px 10px;background:#fff;border:1px solid var(--line);border-radius:14px;
    padding:10px 12px;display:flex;align-items:center;justify-content:space-between;box-shadow:var(--shadow);
  }
  .starbox .num{font-weight:800;color:var(--green-deep);font-size:20px;}
  .nav{display:flex;flex-direction:column;gap:4px;flex:1;overflow-y:auto;}
  .navitem{
    display:flex;align-items:center;gap:10px;padding:11px 12px;border-radius:14px;
    color:var(--ink);font-weight:600;font-size:14.5px;text-align:left;width:100%;transition:.15s;
  }
  .navitem .emoji{font-size:19px;width:24px;text-align:center;}
  .navitem .idx{font-size:11px;color:var(--muted);width:14px;}
  .navitem.active{background:var(--green);color:#fff;box-shadow:var(--shadow);}
  .navitem:active{transform:scale(.97);}
  .navfoot{margin-top:6px;}
  .ghostbtn{
    display:flex;align-items:center;gap:8px;padding:10px 12px;border-radius:14px;
    color:var(--muted);font-size:13px;width:100%;
  }
  #main{flex:1;display:flex;flex-direction:column;min-width:0;}
  .topbar{
    display:flex;align-items:center;gap:10px;padding:12px 16px;
    background:var(--cream);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:20;
  }
  .hamburger{display:none;font-size:22px;color:var(--green-deep);padding:2px 6px;}
  .topbar .title{font-weight:800;font-size:17px;color:var(--green-deep);}
  .topbar .spacer{flex:1;}
  .topstar{
    background:#fff;border:1px solid var(--line);border-radius:20px;padding:5px 12px;
    font-weight:800;color:var(--green-deep);box-shadow:var(--shadow);font-size:14px;
  }
  .content{padding:16px;overflow-y:auto;flex:1;}
  .card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;box-shadow:var(--shadow);margin-bottom:14px;}
  .card h3{margin:0 0 10px;font-size:16px;color:var(--green-deep);}
  .muted{color:var(--muted);font-size:13px;}
  .row{display:flex;gap:10px;flex-wrap:wrap;}

  /* tabs */
  .tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px;}
  .tab{padding:7px 14px;border-radius:20px;background:var(--green-soft);color:var(--ink);font-weight:600;font-size:13px;border:1px solid var(--line);}
  .tab.active{background:var(--green);color:#fff;border-color:var(--green);}

  /* buttons */
  .btn{background:var(--green);color:#fff;border-radius:14px;padding:10px 16px;font-weight:700;font-size:14px;box-shadow:var(--shadow);}
  .btn:active{transform:scale(.97);}
  .btn.ghost{background:var(--green-soft);color:var(--green-deep);border:1px solid var(--line);box-shadow:none;}
  .btn.sm{padding:7px 12px;font-size:13px;border-radius:12px;}

  /* task list */
  ul.list{list-style:none;margin:0;padding:0;}
  ul.list li{display:flex;align-items:center;gap:10px;padding:11px 12px;border:1px solid var(--line);border-radius:14px;margin-bottom:8px;background:#fff;}
  .check{width:26px;height:26px;border-radius:50%;border:2px solid var(--green);flex:0 0 26px;display:flex;align-items:center;justify-content:center;color:#fff;font-size:15px;font-weight:800;}
  .check.on{background:var(--green);}
  .grow{flex:1;min-width:0;}
  .ellip{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .pill{background:var(--green-soft);color:var(--green-deep);border-radius:20px;padding:3px 10px;font-size:12px;font-weight:700;white-space:nowrap;}
  .pill.star{background:var(--green-soft);color:var(--green-deep);}
  .iconbtn{width:30px;height:30px;border-radius:10px;color:var(--muted);font-size:20px;flex:0 0 30px;}
  .iconbtn:active{background:var(--green-soft);}

  /* poem / content cards */
  .item{background:#fff;border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:10px;}
  .item .h{display:flex;align-items:center;justify-content:space-between;gap:8px;}
  .item .t{font-weight:800;font-size:16px;color:var(--ink);}
  .item .meta{font-size:12px;color:var(--muted);}
  .item .body{margin-top:8px;white-space:pre-line;color:#6b5a56;font-size:14.5px;line-height:1.8;}
  .item .learned{font-size:11px;color:var(--good);font-weight:700;}

  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px;}
  .gcard{background:#fff;border:1px solid var(--line);border-radius:16px;padding:12px;text-align:center;}
  .gcard .e{font-size:34px;}
  .gcard .w{font-weight:800;margin-top:4px;color:var(--green-deep);}
  .gcard .ph{font-size:12px;color:var(--muted);}
  .gcard .zh{font-size:13px;}
  .gcard .acts{margin-top:8px;display:flex;gap:6px;justify-content:center;}

  .quizopt{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px;}
  .quizopt button{flex:1;min-width:90px;background:var(--green-soft);border:1px solid var(--line);border-radius:12px;padding:10px;font-weight:700;color:var(--ink);}

  .mathbox{text-align:center;padding:10px 0;}
  .mathbox .q{font-size:34px;font-weight:800;color:var(--green-deep);letter-spacing:2px;}
  .mathbox input{width:120px;text-align:center;font-size:26px;font-weight:800;border:2px solid var(--line);border-radius:14px;padding:8px;color:var(--ink);}
  .feedback{margin-top:10px;font-weight:800;}

  /* read-along */
  .phrase{display:flex;align-items:center;gap:10px;background:#fff;border:1px solid var(--line);border-radius:14px;padding:12px;margin-bottom:8px;}
  .phrase .en{font-weight:800;color:var(--green-deep);flex:1;}
  .scorebadge{font-weight:800;border-radius:14px;padding:4px 12px;font-size:14px;}
  .score-good{background:var(--good);color:#fff;}
  .score-mid{background:#F4C77B;color:#fff;}
  .score-bad{background:#E6A99A;color:#fff;}

  /* overlay sidebar for mobile */
  #overlay{display:none;position:fixed;inset:0;background:rgba(91,74,71,.4);z-index:25;}
  #toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%);background:var(--ink);color:#fff;
    padding:10px 18px;border-radius:24px;font-weight:700;font-size:14px;opacity:0;pointer-events:none;transition:.25s;z-index:60;}
  #toast.show{opacity:.95;}

  /* modal */
  #modal{position:fixed;inset:0;background:rgba(91,74,71,.45);display:none;align-items:center;justify-content:center;z-index:50;padding:18px;}
  #modal.show{display:flex;}
  .modalcard{background:#fff;border-radius:20px;padding:18px;width:100%;max-width:420px;max-height:85vh;overflow-y:auto;box-shadow:var(--shadow);}
  .modalcard h3{margin:0 0 12px;color:var(--green-deep);}
  .field{margin-bottom:12px;}
  .field label{display:block;font-size:13px;color:var(--muted);margin-bottom:4px;}
  .field input,.field textarea,.field select{width:100%;border:1.5px solid var(--line);border-radius:12px;padding:10px;color:var(--ink);background:var(--cream);}
  .modalacts{display:flex;gap:10px;margin-top:8px;}
  .modalacts .btn{flex:1;text-align:center;}

  .banner{background:linear-gradient(90deg,var(--green-soft),var(--green-soft));border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:14px;}
  .banner .big{font-size:15px;font-weight:800;color:var(--green-deep);}
  .hero{display:flex;align-items:center;gap:14px;background:linear-gradient(90deg,#EAF7F1,#F4FBF8);border-radius:20px;padding:18px;margin-bottom:14px;box-shadow:var(--shadow);}
  .hero .big{font-size:40px;}
  .hero .ht{font-weight:800;font-size:18px;color:var(--green-deep);}
  .hero .hs{font-size:13px;color:var(--muted);}
  .quick{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;}
  .quick a{display:block;background:#fff;border:1px solid var(--line);border-radius:16px;padding:14px;text-decoration:none;color:var(--ink);box-shadow:var(--shadow);}
  .quick a .qe{font-size:28px;}
  .quick a .qt{font-weight:700;margin-top:4px;color:var(--green-deep);}
  .center{text-align:center;}
  .empty{text-align:center;color:var(--muted);padding:24px 0;}

  @media (max-width:760px){
    #sidebar{position:fixed;left:0;top:0;bottom:0;transform:translateX(-100%);transition:transform .25s;box-shadow:var(--shadow);}
    #sidebar.open{transform:translateX(0);}
    .hamburger{display:block;}
    #overlay.show{display:block;}
    .content{padding:14px;}
  }

  /* 翻页绘本阅读器 */
  #reader{position:fixed;inset:0;background:linear-gradient(160deg,#EAF7F1,#F4FBF8);z-index:70;display:none;flex-direction:column;}
  #reader.show{display:flex;}
  .reader-bar{display:flex;align-items:center;gap:10px;padding:12px 16px;}
  .reader-bar .rt{font-weight:800;color:var(--green-deep);flex:1;}
  .reader-stage{flex:1;display:flex;align-items:center;justify-content:center;padding:10px;min-height:0;}
  .page{background:#fff;border-radius:22px;box-shadow:var(--shadow);max-width:520px;width:100%;height:100%;max-height:72vh;
    display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:30px 26px;
    border:2px solid var(--green-soft);transition:transform .25s;}
  .page.flip{transform:rotateY(8deg) scale(.98);opacity:.4;}
  .page .pe{font-size:84px;line-height:1;}
  .page .pt{font-weight:800;font-size:22px;color:var(--green-deep);margin:14px 0 10px;}
  .page .px{font-size:17px;color:#6b5a56;line-height:2;white-space:pre-line;}
  .reader-nav{display:flex;align-items:center;justify-content:center;gap:16px;padding:14px;}
  .reader-nav button{min-width:64px;}
  .reader-dots{display:flex;gap:6px;justify-content:center;padding-bottom:14px;flex-wrap:wrap;}
  .reader-dots span{width:8px;height:8px;border-radius:50%;background:var(--green-soft);}
  .reader-dots span.on{background:var(--green);}
  .reader-speak{display:flex;justify-content:center;gap:8px;padding:0 16px 4px;flex-wrap:wrap;}
  .page .px{line-height:2;}
  .page .px .rline{padding:2px 8px;border-radius:8px;transition:background .2s;}
  .page .px .rline.on{background:#FFF3C4;}
  .page .pcn{margin-top:12px;padding-top:10px;border-top:1px dashed var(--line);color:var(--muted);font-size:14px;line-height:1.9;white-space:pre-line;}
  .hzbar{margin-bottom:10px;}
  .hzinput{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:12px;font-size:15px;background:#fffdf8;outline:none;box-sizing:border-box;}
  .chips{display:flex;flex-wrap:wrap;gap:8px;}
  .chip{padding:8px 13px;border:1px solid var(--line);border-radius:999px;background:#fff;font-size:14px;cursor:pointer;color:var(--ink);}
  .chip b{color:var(--green-deep);margin-left:2px;}
  .chip:hover{border-color:var(--green);}
  .chip.on{background:var(--green);border-color:var(--green);color:#fff;font-weight:700;}
  .chip.on b{color:#fff;}
  .gcard.wcard:hover{border-color:var(--green);box-shadow:0 3px 10px rgba(95,190,155,.18);transform:translateY(-1px);}
  .gcard.wcard{transition:all .15s;}
  /* 金豆图标 */
  .bean{display:inline-block;width:11px;height:13px;border-radius:50%;background:radial-gradient(circle at 32% 28%,#FFEDB0,#F2C14E 60%,#D99A1B);box-shadow:0 1px 2px rgba(217,154,27,.45);vertical-align:-1px;margin:0 2px;}
  .pill.star{background:#FDF3D0;color:#B8860B;}
  /* 日历 */
  .calcard{background:#fff;border:1px solid var(--line);border-radius:18px;padding:12px;margin-bottom:12px;box-shadow:var(--shadow);}
  .calhead{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px;}
  .caltitle{font-weight:800;color:var(--green-deep);font-size:15px;}
  .calgrid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;}
  .calwd{text-align:center;font-size:11px;color:var(--muted);padding:4px 0;font-weight:700;}
  .cald{position:relative;aspect-ratio:1;display:flex;align-items:center;justify-content:center;border-radius:12px;font-size:14px;cursor:pointer;background:#fff;}
  .cald.empty{visibility:hidden;}
  .cald.today{border:1.5px solid var(--green);font-weight:800;color:var(--green-deep);}
  .cald.sel{background:var(--green);color:#fff;font-weight:800;box-shadow:var(--shadow);border:1.5px solid var(--green);}
  .cald.part::after{content:'';position:absolute;bottom:5px;width:4px;height:4px;border-radius:50%;background:var(--yellow);}
  .cald.done::after{content:'';position:absolute;bottom:5px;width:4px;height:4px;border-radius:50%;background:var(--green);}
  .cald.sel::after{background:#fff !important;}
  .caltoday{text-align:center;margin:6px 0 0;}
  /* 统计条 */
  .statcard{background:#fff;border:1px solid var(--line);border-radius:16px;padding:12px 14px;margin-bottom:12px;box-shadow:var(--shadow);}
  .statrow{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:13px;font-weight:700;}
  .statrow .sd{color:var(--good);}
  .statrow .su{color:var(--muted);font-weight:600;}
  .statrow .st{color:var(--green-deep);}
  .statbar{height:8px;border-radius:6px;background:var(--green-soft);margin-top:8px;overflow:hidden;}
  .statbar i{display:block;height:100%;border-radius:6px;background:linear-gradient(90deg,var(--green),var(--yellow));}
  /* 负金豆 */
  .pill.neg{background:#FBEAE7;color:#E06B5C;}
  /* 成长历程 */
  .gstat{background:#fff;border:1px solid var(--line);border-radius:16px;padding:10px 12px;box-shadow:var(--shadow);text-align:center;}
  .gstat .gn{font-weight:800;font-size:16px;color:var(--green-deep);}
  .gstat .gl{font-size:11px;color:var(--muted);}
  /* ruby 拼音标注 */
  ruby{ruby-position:over;}
  ruby rt{font-size:13px;color:var(--muted);font-weight:400;letter-spacing:1px;}
</style>
</head>
<body>
<div id="app">
  <aside id="sidebar">
    <div class="brand">
      <div class="logo">🫘</div>
      <div>
        <div class="name">奶豆加油站</div>
        <div class="sub">小学生成长平台</div>
      </div>
    </div>
    <div class="starbox" data-act="bean-detail" style="cursor:pointer" title="点击查看金豆收支明细">
      <span>我的小金豆</span>
      <span class="num" id="sideStars"><i class="bean"></i> 0</span>
    </div>
    <nav class="nav" id="nav"></nav>
    <div class="navfoot">
      <button class="ghostbtn" data-nav="settings">⚙️ <span>设置 / 备份</span></button>
    </div>
  </aside>

  <div id="overlay"></div>

  <div id="main">
    <div class="topbar">
      <button class="hamburger" id="hamburger">☰</button>
      <div class="title" id="pageTitle">奶豆加油站</div>
      <div class="spacer"></div>
      <div class="topstar" id="topStars" data-act="bean-detail" style="cursor:pointer" title="点击查看金豆收支明细"><i class="bean"></i> 0</div>
    </div>
    <div class="content" id="content"></div>
  </div>
</div>

<div id="toast"></div>

<div id="modal">
  <div class="modalcard" id="modalCard"></div>
</div>

<div id="reader">
  <div class="reader-bar">
    <button class="btn ghost" id="readerClose">✕ 关闭</button>
    <div class="rt" id="readerTitle">绘本</div>
    <span class="muted" id="readerPageNo"></span>
  </div>
  <div class="reader-stage" id="readerStage"></div>
  <div class="reader-dots" id="readerDots"></div>
  <div class="reader-speak">
    <button class="btn sm ghost" id="readerSpeakPage">🔊 朗读本页</button>
    <button class="btn sm" id="readerFollow">🎤 逐句跟读</button>
    <button class="btn sm ghost" id="readerStop" style="display:none">⏹ 停止</button>
  </div>
  <div class="reader-nav">
    <button class="btn ghost" id="readerPrev">← 上一页</button>
    <button class="btn" id="readerNext">下一页 →</button>
  </div>
</div>

<script src="hanzi-data.js"></script>
<script src="poems-data.js"></script>
<script src="idioms-data.js"></script>
<script src="en-data.js"></script>
<script>
/* ============ 数据层：古诗/宋词/成语见外部文件 ============ */
/* poems-data.js 定义 POEMS_DATA(古诗) 和 SONGCI_DATA(宋词) */
/* idioms-data.js 定义 IDIOMS_DATA(成语) */
var POEMS = (typeof POEMS_DATA !== 'undefined') ? POEMS_DATA.map(function(p){return {t:p.title,a:p.author,d:p.dynasty,c:p.content,g:p.grade,tr:p.translation,ph:p.pinyinHtml,ph2:p.pinyin,e:p.emoji};}) : [];
var SONGCI = (typeof SONGCI_DATA !== 'undefined') ? SONGCI_DATA.map(function(p){return {t:p.title,a:p.author,d:p.dynasty,c:p.content,g:p.grade,tr:p.translation,ph:p.pinyinHtml,ph2:p.pinyin,e:p.emoji||'📜'};}) : [];
var IDIOMS = (typeof IDIOMS_DATA !== 'undefined') ? IDIOMS_DATA.map(function(m){return {w:m.word,m:m.meaning,s:m.origin,g:m.grade,ph:m.pinyinHtml,ph2:m.pinyin,e:m.emoji||'📝'};}) : [];

/* 汉字数据见外部文件 hanzi-data.js（约 480 个常用字，拼音由 pypinyin 自动生成） */

/* ============ 数据层：英语单词/短句/拼读见外部文件 en-data.js ============ */
var WORDS = (typeof EN_WORDS !== 'undefined') ? EN_WORDS : [];
var PHRASES = (typeof EN_PHRASES !== 'undefined') ? EN_PHRASES : [];
var PHONICS = (typeof EN_PHONICS !== 'undefined') ? EN_PHONICS : [];

/* ============ 计算小达人 题库（按年级×分类）============ */
/* 来源：阳光同学《计算小达人》人教版；二年级上册已录入，其他年级待补充 */
const CALC_GNAME={1:'一年级',2:'二年级',3:'三年级',4:'四年级',5:'五年级',6:'六年级'};
const CALC_BANK={
  1:{}, // 占位
  2:{
    '100以内加减法':[
      {q:'50+17',a:67},{q:'40+44',a:84},{q:'33+44',a:77},{q:'5+18',a:23},
      {q:'30+26',a:56},{q:'22+55',a:77},{q:'76+20',a:96},{q:'35+40',a:75},
      {q:'10+29',a:39},{q:'8+63',a:71},{q:'3+66',a:69},{q:'13+80',a:93},
      {q:'8+82',a:90},{q:'35+7',a:42},{q:'57+7',a:64},{q:'59+20',a:79},

}else{
  /* 老用户升级：补充新固定任务 */
  let tmplChanged=false;
  NEW_PLAN_TASKS.forEach(function(nt){
    if(!planTemplate.some(function(t){return t.title===nt.title;})){
      planTemplate.push({id:nt.id,title:nt.title,stars:nt.stars,done:false});

if(_oldPlan && Array.isArray(_oldPlan) && _oldPlan.length){

(function(){
  if(planByDate[today()]){
    const exist=planByDate[today()].map(function(t){return t.title;});
    let dayChanged=false;
    planTemplate.forEach(function(t){
      if(exist.indexOf(t.title)<0){
        planByDate[today()].push({id:today()+'_'+t.id,title:t.title,stars:t.stars,done:false});
        dayChanged=true;
      }

function getDayTasks(date){
  if(!planByDate[date]){
    planByDate[date] = planTemplate.map(function(t){return {id:date+'_'+t.id,title:t.title,stars:t.stars,done:false};});

let beanLog = load('beanLog',[]);   // [{d:'YYYY-MM-DD',t:'事项',v:±N,c:'分类'}]
function logBean(v,t,c){
  beanLog.push({d:today(),t:t||'任务奖励',v:+v,c:c||'other'});
  if(beanLog.length>3000)beanLog=beanLog.slice(-3000);
  save('beanLog',beanLog);
}
function removeBeanLog(t,c){
  for(let i=beanLog.length-1;i>=0;i--){
    const b=beanLog[i];
    if((!t||b.t===t)&&(!c||b.c===c)){beanLog.splice(i,1);break;}
  }
  save('beanLog',beanLog);
}
/* 首次升级：用历史数据补一份流水（只补一次），并让账目与当前金豆对齐 */
function seedBeanLog(){
  if(beanLog.length)return;
  const seed=[];
  Object.keys(planByDate||{}).forEach(function(date){
    (planByDate[date]||[]).forEach(function(t){ if(t.done){seed.push({d:date,t:t.title,v:+t.stars,c:'plan'});} });
  });
  Object.keys(exerciseLog||{}).forEach(function(date){
    const log=exerciseLog[date]||{};
    Object.keys(log).forEach(function(k){
      const star=(k.indexOf('height')===0)?((SPORTS.heightGroups[+k.slice(6)]||{}).star||1):5;
      (log[k]||[]).forEach(function(item){seed.push({d:date,t:item,v:star,c:'sport'});});
    });
  });
  (readingLog||[]).forEach(function(r){seed.push({d:r.date,t:'阅读打卡：《'+r.book+'》',v:+r.stars,c:'read'});});
  (rewardsGot||[]).forEach(function(r){seed.push({d:r.date,t:'兑换：'+r.name,v:-(+r.cost),c:'reward'});});
  const sum=seed.reduce(function(a,b){return a+(+b.v);},0);
  const diff=(+stars)-sum;
  if(diff!==0){
    const d0=seed.length?seed.map(function(s){return s.d;}).sort().shift():today();
    seed.push({d:d0,t:'历史累计（升级前）',v:diff,c:'other'});
  }
  if(seed.length){
    seed.sort(function(a,b){return a.d<b.d?-1:(a.d>b.d?1:0);});
    beanLog=seed;
    save('beanLog',beanLog);
  }
}
seedBeanLog();

/* 一、每日计划（日历版：点日期看完成情况，今天和未来可编辑） */
function calGridHtml(y,m,sel){
  const firstDow=new Date(y,m-1,1).getDay();
  const days=new Date(y,m,0).getDate();
  const t=today();
  let h='<div class="calcard"><div class="calhead">'+
    '<button class="iconbtn" data-act="cal-prev" style="font-size:22px">‹</button>'+
    '<div class="caltitle">'+y+' 年 '+m+' 月</div>'+
    '<button class="iconbtn" data-act="cal-next" style="font-size:22px">›</button></div>'+
    '<div class="calgrid">';
  ['日','一','二','三','四','五','六'].forEach(function(d){h+='<div class="calwd">'+d+'</div>';});
  for(let i=0;i<firstDow;i++)h+='<div class="cald empty"></div>';
  for(let d=1;d<=days;d++){
    const ds=y+'-'+String(m).padStart(2,'0')+'-'+String(d).padStart(2,'0');
    let cls='cald'+(ds===t?' today':'')+(ds===sel?' sel':'');
    const rec=planByDate[ds];
    if(rec&&rec.length){
      const dn=rec.filter(function(x){return x.done;}).length;
      if(dn===rec.length)cls+=' done';else if(dn>0)cls+=' part';
    }
    h+='<div class="'+cls+'" data-act="cal-pick" data-d="'+ds+'">'+d+'</div>';
  }
  h+='</div><div class="caltoday"><button class="btn sm ghost" data-act="cal-today">📍 回到今天</button></div></div>';
  return h;
}

    }
    h+='</div>';

  // ===== 100以内加减法（保留原逻辑）=====

  h+='<div class="muted center">已答对 '+mathRight+' 道，继续加油！</div>';
  return h;
}

function growthChart(n){
  const pts=[];
  for(let i=n-1;i>=0;i--){
    const d=new Date();d.setDate(d.getDate()-i);
    const ds=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
    const net=beanLog.filter(function(b){return b.d===ds;}).reduce(function(a,b){return a+(+b.v);},0);
    pts.push({ds:ds,net:net});
  }
  if(!pts.some(function(p){return p.net!==0;}))return '<div class="empty">还没有数据～完成打卡后，这里会出现孩子的成长曲线！</div>';
  const W=640,H=230,PL=36,PR=12,PT=26,PB=30;
  const min=Math.min(0,Math.min.apply(null,pts.map(function(p){return p.net;})));
  const max=Math.max(0,Math.max.apply(null,pts.map(function(p){return p.net;})));
  const span=(max-min)||1;
  const cw=W-PL-PR,ch=H-PT-PB;
  function X(i){return PL+cw*(pts.length===1?0.5:i/(pts.length-1));}
  function Y(v){return PT+ch*(1-(v-min)/span);}
  let svg='<svg viewBox="0 0 '+W+' '+H+'" style="width:100%;display:block;height:auto">';
  for(let g=0;g<=3;g++){
    const gy=PT+ch*g/3;
    svg+='<line x1="'+PL+'" y1="'+gy.toFixed(1)+'" x2="'+(W-PR)+'" y2="'+gy.toFixed(1)+'" stroke="#EDE8DD" stroke-width="1"/>';
  }
  const zy=Y(0);
  svg+='<line x1="'+PL+'" y1="'+zy.toFixed(1)+'" x2="'+(W-PR)+'" y2="'+zy.toFixed(1)+'" stroke="#D5CEBE" stroke-width="1.4" stroke-dasharray="4 3"/>';
  const poly=pts.map(function(p,i){return X(i).toFixed(1)+','+Y(p.net).toFixed(1);}).join(' ');
  svg+='<polyline points="'+poly+'" fill="none" stroke="#5FBE9B" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>';
  pts.forEach(function(p,i){
    const px=X(i),py=Y(p.net);
    const col=p.net<0?'#E06B5C':(p.net>0?'#3E9E7E':'#BFB8A9');
    svg+='<circle cx="'+px.toFixed(1)+'" cy="'+py.toFixed(1)+'" r="3.6" fill="'+col+'"/>';
    if(p.net!==0){
      svg+='<text x="'+px.toFixed(1)+'" y="'+((p.net<0?py+16:py-7)).toFixed(1)+'" text-anchor="middle" font-size="10.5" fill="'+col+'" font-weight="700">'+(p.net>0?'+':'')+p.net+'</text>';
    }
    if(i%2===0||pts.length<=7){
      svg+='<text x="'+px.toFixed(1)+'" y="'+(H-10)+'" text-anchor="middle" font-size="9.5" fill="#9C968C">'+p.ds.slice(5)+'</text>';
    }
  });
  svg+='</svg>';
  return svg;
}

/* ============ 语音：发音 + 跟读打分 ============ */
function speak(text,lang){
  try{
    lang=lang||'en-US';
    const u=new SpeechSynthesisUtterance(text);
    u.lang=lang;u.rate=(lang.indexOf('zh')===0)?0.8:0.9;u.pitch=1.05;
    const vs=speechSynthesis.getVoices();
    const pre=lang.split('-')[0].toLowerCase();
    const v=vs.find(x=>x.lang.toLowerCase().indexOf(pre)===0);
    if(v)u.voice=v;
    speechSynthesis.cancel();speechSynthesis.speak(u);
  }catch(e){toast('发音失败');}
}
function levenshtein(a,b){
  const m=a.length,n=b.length;const dp=Array.from({length:m+1},()=>new Array(n+1).fill(0));
  for(let i=0;i<=m;i++)dp[i][0]=i;for(let j=0;j<=n;j++)dp[0][j]=j;
  for(let i=1;i<=m;i++)for(let j=1;j<=n;j++){
    dp[i][j]=Math.min(dp[i-1][j]+1,dp[i][j-1]+1,dp[i-1][j-1]+(a[i-1]===b[j-1]?0:1));
  }
  return dp[m][n];
}
function similarity(said,tgt){
  said=said.toLowerCase().replace(/[^a-z\s]/g,'');
  tgt=tgt.toLowerCase().replace(/[^a-z\s]/g,'');
  if(!tgt)return 0;
  if(said===tgt)return 100;
  const wa=said.split(/\s+/).filter(Boolean),wb=tgt.split(/\s+/).filter(Boolean);
  let match=0;const setB=new Set(wb);wa.forEach(w=>{if(setB.has(w))match++;});
  const token=Math.round(match/Math.max(wa.length,wb.length,1)*100);
  const lev=levenshtein(said,tgt);
  const char=Math.round((1-lev/Math.max(said.length,tgt.length,1))*100);
  return Math.max(0,Math.round(token*0.55+char*0.45));
}
function readAlong(text,targetId){
  const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  if(!SR){toast('当前浏览器不支持语音识别，请用安卓 Chrome');return;}
  const rec=new SR();rec.lang='en-US';rec.interimResults=false;rec.maxAlternatives=1;
  toast('请大声跟读：'+text);
  rec.onresult=function(e){
    const said=e.results[0][0].transcript;
    const score=similarity(said,text);
    const badge=document.getElementById(targetId);
    let cls='score-bad',word='再试试';
    if(score>=85){cls='score-good';word='太棒了';}
    else if(score>=60){cls='score-mid';word='不错';}
    if(badge)badge.innerHTML='<span class="scorebadge '+cls+'">'+score+'分 · '+word+'</span>';
    if(score>=60){
      addStars(2,'短句跟读','english');
      learned.enPhrases=learned.enPhrases||{};learned.enPhrases[text]=true;save('learned',learned);
    }
    else{toast('得分 '+score+'，多练几次就得金豆啦');}
  };
  rec.onerror=function(e){toast('识别出错：'+e.error);};
  try{rec.start();}catch(e){toast('请允许使用麦克风');}
}

/* ============ 翻页绘本阅读器（带语音朗读/跟读） ============ */
let readerState=null;
let readerFollowTimer=null;
let readerFollowActive=false;
function openBook(tab,i){
  const b=BOOKS[tab][i];
  if(!b||!b.pages){go('picture');return;}
  readerState={tab,i,b,pages:b.pages,idx:0,lang:(tab==='en')?'en-US':'zh-CN'};
  document.getElementById('readerTitle').textContent=b.t;
  document.getElementById('reader').classList.add('show');
  renderReaderPage(0);
}
function renderReaderPage(idx){
  if(!readerState)return;
  stopReaderSpeak();
  readerState.idx=idx;
  const p=readerState.pages[idx];
  const sents=(p.text||'').split(/\n+/).filter(s=>s.trim());
  let pxHtml=sents.length?sents.map((s,k)=>'<span class="rline" data-i="'+k+'">'+esc(s)+'</span>').join('<br>'):esc(p.text||'');
  const cnHtml=p.cn?'<div class="pcn">'+esc(p.cn)+'</div>':'';
  const stage=document.getElementById('readerStage');
  stage.innerHTML='<div class="page" id="rpage"><div class="pe">'+(p.e||p.emoji||'📖')+'</div>'+
    '<div class="pt">'+esc(p.t||p.title)+'</div><div class="px">'+pxHtml+'</div>'+cnHtml+'</div>';
  document.getElementById('readerPageNo').textContent=(idx+1)+' / '+readerState.pages.length;
  const dots=document.getElementById('readerDots');
  dots.innerHTML=readerState.pages.map((_,k)=>'<span class="'+(k===idx?'on':'')+'"></span>').join('');
  document.getElementById('readerPrev').disabled=idx===0;
  document.getElementById('readerNext').textContent=(idx===readerState.pages.length-1)?'读完啦 ✓':'下一页 →';
}
function readerTurn(delta){
  if(!readerState)return;
  const ni=readerState.idx+delta;
  if(ni<0||ni>=readerState.pages.length)return;
  const pg=document.getElementById('rpage');
  if(pg){pg.classList.add('flip');}
  setTimeout(()=>renderReaderPage(ni),180);
}
function stopReaderSpeak(){
  if('speechSynthesis'in window)speechSynthesis.cancel();
  readerFollowActive=false;
  if(readerFollowTimer){clearTimeout(readerFollowTimer);readerFollowTimer=null;}
  const stop=document.getElementById('readerStop');
  if(stop)stop.style.display='none';
  const f=document.getElementById('readerFollow');
  if(f)f.textContent='🎤 逐句跟读';
  const on=document.querySelector('#rpage .rline.on');
  if(on)on.classList.remove('on');
}
function readerSpeakPage(){
  if(!readerState)return;
  stopReaderSpeak();
  const p=readerState.pages[readerState.idx];
  if(!p)return;
  speak(p.text,readerState.lang);
  document.getElementById('readerStop').style.display='';
}
function readerSpeakFollow(){
  if(!readerState)return;
  if(readerFollowActive){stopReaderSpeak();return;}
  const p=readerState.pages[readerState.idx];
  if(!p)return;
  const sents=(p.text||'').split(/\n+/).filter(s=>s.trim());
  if(!sents.length){speak(p.text,readerState.lang);return;}
  readerFollowActive=true;
  document.getElementById('readerStop').style.display='';
  document.getElementById('readerFollow').textContent='⏸ 暂停跟读';
  const lines=document.querySelectorAll('#rpage .rline');
  const lang=readerState.lang;
  let i=0;
  (function sayNext(){
    if(!readerState||!readerFollowActive)return;
    if(i>=sents.length){stopReaderSpeak();return;}
    lines.forEach(l=>l.classList.remove('on'));
    if(lines[i])lines[i].classList.add('on');
    const u=new SpeechSynthesisUtterance(sents[i]);
    u.lang=lang;u.rate=(lang.indexOf('zh')===0)?0.8:0.9;u.pitch=1.05;
    const vs=speechSynthesis.getVoices();
    const pre=lang.split('-')[0].toLowerCase();
    const v=vs.find(x=>x.lang.toLowerCase().indexOf(pre)===0);
    if(v)u.voice=v;
    u.onend=function(){i++;readerFollowTimer=setTimeout(sayNext,350);};
    u.onerror=function(){stopReaderSpeak();};
    speechSynthesis.speak(u);
  })();
}
function closeReader(){
  if(!readerState)return;
  stopReaderSpeak();
  const {tab,i}=readerState;
  document.getElementById('reader').classList.remove('show');
  const key='picRead'+tab+i;
  if(!load(key,false)){save(key,true);addStars(2,'读完绘本：《'+((readerState.b||{}).t||'')+'》','picture');}
  readerState=null;
  go('picture');
}
document.getElementById('readerClose').onclick=closeReader;
document.getElementById('readerPrev').onclick=function(){readerTurn(-1);};
document.getElementById('readerNext').onclick=function(){
  if(readerState.idx===readerState.pages.length-1){closeReader();}
  else{readerTurn(1);}
};
document.getElementById('readerSpeakPage').onclick=readerSpeakPage;
document.getElementById('readerFollow').onclick=readerSpeakFollow;
document.getElementById('readerStop').onclick=stopReaderSpeak;
let touchX=null;
document.getElementById('readerStage').addEventListener('touchstart',e=>{touchX=e.changedTouches[0].clientX;},{passive:true});
document.getElementById('readerStage').addEventListener('touchend',e=>{
  if(touchX===null)return;const dx=e.changedTouches[0].clientX-touchX;
  if(dx>50)readerTurn(-1);else if(dx<-50)readerTurn(1);touchX=null;
},{passive:true});
