<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#4f46e5">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon.svg">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="学习工作台">
<title>学习管理工作台 · 模型学习平台</title>
<style>
  :root{
    --bg:#f5f7fb; --panel:#ffffff; --ink:#1f2937; --muted:#6b7280; --line:#e5e7eb;
    --mgmt:#2563eb; --psy:#db2777; --grow:#059669; --mkt:#ea580c;
    --shadow:0 6px 22px rgba(17,24,39,.08);
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  html,body{height:100%}
  body{
    font-family:-apple-system,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
    background:var(--bg); color:var(--ink);
    display:flex; flex-direction:column; height:100vh; height:100dvh; overflow:hidden;
  }
  header{
    padding:12px 16px; background:var(--panel); border-bottom:1px solid var(--line);
    display:flex; align-items:center; gap:10px; flex-shrink:0; padding-top:max(12px,env(safe-area-inset-top));
  }
  header .logo{
    width:34px;height:34px;border-radius:10px;flex-shrink:0;
    background:linear-gradient(135deg,#6366f1,#8b5cf6); color:#fff;
    display:flex;align-items:center;justify-content:center;font-size:18px;
  }
  header h1{font-size:16px;font-weight:700}
  header p{font-size:11px;color:var(--muted);margin-top:1px}
  header .stats{margin-left:auto;font-size:11px;color:var(--muted);text-align:right;line-height:1.4}
  header .stats b{color:var(--ink)}

  .body{flex:1; min-height:0; position:relative; overflow:hidden; display:flex; flex-direction:row;}
  .sidebar{display:none;}
  .subcat-h{font-size:12px;color:#94a3b8;font-weight:700;margin:12px 8px 6px;letter-spacing:.5px}
  .subcat-h:first-child{margin-top:2px}
  .model-item{
    display:flex;align-items:center;gap:9px;padding:9px 11px;border-radius:10px;cursor:pointer;
    margin-bottom:5px;transition:.15s;border:1px solid transparent;min-height:42px;
  }
  .model-item:hover{background:#f1f5f9}
  .model-item.active{background:#eef2ff;border-color:#c7d2fe}
  .model-item .ic{font-size:17px;width:28px;height:28px;flex-shrink:0;display:flex;align-items:center;justify-content:center;background:#f1f5f9;border-radius:8px}
  .model-item .nm{font-size:13.5px;font-weight:600;line-height:1.2}
  .model-item .tg{font-size:11px;color:var(--muted)}
  .model-item .done{margin-left:auto;font-size:11px;color:#16a34a;display:none}
  .model-item.learned .done{display:block}

  .content{flex:1; min-width:0; height:100%; overflow-y:auto; padding:18px 22px 26px; position:relative; will-change:transform;}
  .crumb{font-size:12px;color:var(--muted);margin-bottom:5px}
  .m-title{font-size:21px;font-weight:800;display:flex;align-items:center;gap:9px;flex-wrap:wrap}
  .m-tag{font-size:11px;font-weight:600;padding:3px 10px;border-radius:999px}
  .m-intro{margin:12px 0;font-size:14px;line-height:1.8;color:#374151}
  .detail{font-size:14.5px;line-height:1.9;color:#374151}
  .detail b{color:#1e293b}
  .points{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px;margin:14px 0}
  .point{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px;box-shadow:var(--shadow)}
  .point h4{font-size:13.5px;margin-bottom:3px}
  .point p{font-size:12.5px;color:var(--muted);line-height:1.6}

  .card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px;box-shadow:var(--shadow);margin:16px 0}
  .card h3{font-size:15px;margin-bottom:4px;display:flex;align-items:center;gap:8px}
  .card .sub{font-size:12px;color:var(--muted);margin-bottom:10px}
  .chart-wrap{width:100%;overflow-x:auto}
  svg{display:block;max-width:100%;height:auto;margin:0 auto}
  .case{margin-bottom:12px;padding:11px 13px;border-left:3px solid var(--line);background:#fafafa;border-radius:0 8px 8px 0}
  .case .ct{font-weight:700;font-size:13.5px;margin-bottom:3px}
  .case .cs{font-size:12.5px;color:#475569;line-height:1.7}
  .case .ca{font-size:12.5px;color:#1d4ed8;line-height:1.7;margin-top:5px}

  .tabs{display:flex;gap:6px;margin:6px 0 4px;border-bottom:1px solid var(--line)}
  .tab{padding:9px 14px;font-size:13.5px;font-weight:600;color:var(--muted);cursor:pointer;border-bottom:2px solid transparent}
  .tab.active{color:var(--ink);border-color:#6366f1}
  .tabpane{display:none}
  .tabpane.active{display:block}

  .ex-head{display:flex;align-items:center;gap:12px;margin:6px 0 14px;flex-wrap:wrap}
  .ex-score{font-size:13px;color:var(--muted)}
  .ex-score b{color:#16a34a;font-size:15px}
  .ex-progress{flex:1;height:8px;background:#e5e7eb;border-radius:999px;min-width:100px;overflow:hidden}
  .ex-progress > i{display:block;height:100%;width:0;background:linear-gradient(90deg,#22c55e,#16a34a);transition:.3s}
  .btn-reset{font-size:12px;padding:7px 12px;border:1px solid var(--line);background:#fff;border-radius:8px;cursor:pointer;color:var(--muted)}
  .btn-reset:hover{background:#f1f5f9}
  .quiz{margin-bottom:14px;border:1px solid var(--line);border-radius:12px;padding:14px;background:var(--panel)}
  .quiz .q{font-size:13.5px;font-weight:600;margin-bottom:9px;line-height:1.6;white-space:pre-line}
  .quiz .opts{display:flex;flex-direction:column;gap:7px}
  .opt{
    display:flex;align-items:center;gap:9px;padding:10px 11px;border:1px solid var(--line);border-radius:9px;
    cursor:pointer;font-size:13px;transition:.15s;background:#fff;min-height:42px;
  }
  .opt:hover{border-color:#c7d2fe;background:#f8fafc}
  .opt .k{width:22px;height:22px;border-radius:6px;background:#eef2ff;color:#4f46e5;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;flex-shrink:0}
  .opt.correct{border-color:#16a34a;background:#f0fdf4}
  .opt.correct .k{background:#16a34a;color:#fff}
  .opt.wrong{border-color:#dc2626;background:#fef2f2}
  .opt.wrong .k{background:#dc2626;color:#fff}
  .opt.locked{cursor:default}
  .explain{margin-top:9px;font-size:12.5px;line-height:1.7;padding:9px 11px;border-radius:8px;display:none}
  .explain.show{display:block}
  .explain.ok{background:#f0fdf4;color:#166534}
  .explain.no{background:#fef2f2;color:#991b1b}
  .qmeta{font-size:11px;color:#94a3b8;margin-top:6px}

  .taskbar{
    flex-shrink:0; width:160px; background:var(--panel); border-right:1px solid var(--line);
    display:flex; flex-direction:column; gap:7px; padding:14px 11px; overflow-y:auto;
    box-shadow:4px 0 18px rgba(17,24,39,.04);
  }
  /* 任务栏顶部：返回按钮 */
  .rail-back{
    display:none; align-items:center; gap:6px; width:100%; padding:9px 12px; margin-bottom:6px;
    border:1px solid var(--line); border-radius:10px; background:#fff; color:var(--muted);
    font-size:13px; font-weight:700; cursor:pointer; transition:.15s;
  }
  .rail-back:hover{background:#f1f5f9}
  .rail-back .rb-ic{font-size:19px;line-height:1}
  /* 折叠/展开按钮（顶部 header） */
  .header-toggle{
    margin-left:8px; width:36px; height:36px; flex-shrink:0;
    border:1px solid var(--line); background:#fff; color:#334155;
    border-radius:10px; font-size:18px; line-height:1; cursor:pointer; transition:.15s;
    display:flex; align-items:center; justify-content:center;
  }
  .header-toggle:hover{background:#f1f5f9}
  .task{
    display:flex;align-items:center;gap:10px;width:100%;padding:11px 12px;border-radius:12px;cursor:pointer;
    font-size:13.5px;font-weight:700;color:var(--muted);border:1px solid var(--line);background:#fff;transition:.15s;
  }
  .task .ti{font-size:18px}
  .task:hover{transform:translateX(2px)}
  .task.active{color:#fff;border-color:transparent}
  .task[data-cat="home"].active{background:#6366f1}
  .task[data-cat="management"].active{background:var(--mgmt)}
  .task[data-cat="psychology"].active{background:var(--psy)}
  .task[data-cat="growth"].active{background:var(--grow)}
  .task[data-cat="marketing"].active{background:var(--mkt)}
  .task[data-cat="errors"].active{background:#dc2626}

  .welcome{text-align:center;padding:50px 16px;color:var(--muted)}
  .welcome .big{font-size:26px;margin-bottom:8px}
  .cat-cards{display:flex;gap:14px;justify-content:center;flex-wrap:wrap;margin-top:22px}
  .cat-card{width:220px;background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:20px;cursor:pointer;box-shadow:var(--shadow);transition:.15s}
  .cat-card:hover{transform:translateY(-4px)}
  .cat-card .ci{font-size:30px}
  .cat-card h3{margin:8px 0 4px;font-size:16px}
  .cat-card p{font-size:12px;color:var(--muted)}
  .cat-card .cnt{margin-top:8px;font-size:12px;color:var(--muted)}

  /* 折叠状态：完全隐藏任务栏，内容区占满全屏 */
  body.rail-hidden .taskbar{display:none}
  body.rail-hidden .content{margin-left:0}

  /* 移动端：默认较窄 */
  @media(max-width:780px){
    .content{padding:14px 14px 20px}
    header p{display:none}
    .m-title{font-size:18px}
    .points{grid-template-columns:1fr 1fr}
    .cat-cards{flex-direction:column;align-items:center}
  }
  @media(max-width:430px){
    .points{grid-template-columns:1fr}
  }

  /* 首页进度卡片 */
  .home-wrap{padding:8px 0}
  .home-section{margin-bottom:20px}
  .home-section > h2{font-size:16px;font-weight:800;margin-bottom:10px;display:flex;align-items:center;gap:8px}
  .progress-ring{display:flex;align-items:center;gap:16px;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px;box-shadow:var(--shadow);margin-bottom:10px}
  .ring-svg{flex-shrink:0}
  .ring-info h3{font-size:14px;font-weight:700;margin-bottom:2px}
  .ring-info p{font-size:12px;color:var(--muted);line-height:1.5}
  .ring-info .ring-num{font-size:22px;font-weight:900}
  .home-model-list{display:none;flex-direction:column;gap:6px;margin-top:8px}
  .home-model-list.show{display:flex}
  .home-model-row{display:flex;align-items:center;gap:8px;padding:8px 12px;background:var(--panel);border:1px solid var(--line);border-radius:10px;cursor:pointer;transition:.15s}
  .home-model-row:hover{background:#f1f5f9}
  .home-model-row .hmi{font-size:15px;width:26px;text-align:center}
  .home-model-row .hmn{font-size:12.5px;font-weight:600;flex:1}
  .home-model-row .hmp{font-size:11px;color:var(--muted);white-space:nowrap}
  .home-model-row .hmb{width:50px;height:6px;background:#e5e7eb;border-radius:999px;overflow:hidden}
  .home-model-row .hmb > i{display:block;height:100%;background:linear-gradient(90deg,#6366f1,#8b5cf6);transition:.3s}
  .home-cat-toggle{font-size:12px;color:#6366f1;cursor:pointer;padding:4px 8px;user-select:none;font-weight:600}

  /* 错题集页面 */
  .err-wrap{padding:8px 0}
  .err-cat-card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px;box-shadow:var(--shadow);margin-bottom:12px;cursor:pointer;transition:.15s}
  .err-cat-card:hover{transform:translateY(-2px)}
  .err-cat-head{display:flex;align-items:center;gap:10px}
  .err-cat-head .eci{font-size:24px}
  .err-cat-head h3{font-size:15px;font-weight:700}
  .err-cat-head .err-badge{margin-left:auto;background:#fef2f2;color:#dc2626;font-size:13px;font-weight:700;padding:3px 12px;border-radius:999px}
  .err-model-list{display:none;flex-direction:column;gap:8px;margin-top:12px}
  .err-model-list.show{display:flex}
  .err-model-row{display:flex;align-items:center;gap:8px;padding:10px 12px;background:#fafafa;border:1px solid var(--line);border-radius:10px;cursor:pointer;transition:.15s}
  .err-model-row:hover{background:#f1f5f9}
  .err-model-row .emi{font-size:16px;width:26px;text-align:center}
  .err-model-row .emn{font-size:12.5px;font-weight:600;flex:1}
  .err-model-row .emc{font-size:11px;color:#dc2626;font-weight:700}
  .err-empty{text-align:center;padding:40px 16px;color:var(--muted)}
  .err-empty .big{font-size:30px;margin-bottom:8px}

  /* 学习卡片模块 —— 淡紫主题 */
  .cards-wrap{
    background:linear-gradient(160deg,#f5f0ff 0%,#faf5ff 60%,#f3eaff 100%);
    border:1px solid #e9defb; border-radius:18px; padding:18px 18px 22px;
    min-height:calc(100vh - 140px);
  }
  .card-big{background:linear-gradient(135deg,#eafaf0,#dcf5e6);color:#1f5135;border:1px solid #c7ebd5;border-radius:16px;padding:20px 18px;box-shadow:0 8px 24px rgba(34,139,87,.12)}
  .card-big-head{display:flex;align-items:center;justify-content:space-between;gap:10px}
  .card-name{font-size:22px;font-weight:800;letter-spacing:.5px;color:#176036}
  .card-badge{font-size:12px;background:rgba(22,96,54,.12);color:#176036;padding:3px 10px;border-radius:999px;white-space:nowrap}
  .card-badge.today{background:rgba(22,96,54,.2)}
  .card-author{font-size:13px;color:#3a7a55;margin:6px 0 14px}
  .card-sec{margin-bottom:12px}
  .card-sec b{display:inline-block;font-size:13px;background:rgba(22,96,54,.12);color:#176036;padding:2px 8px;border-radius:6px;margin-bottom:6px}
  .card-sec p{margin:0;line-height:1.7;font-size:15px;color:#1f5135}
  .card-sec.tip b{background:rgba(250,204,21,.92);color:#3a2a00}
  .card-backtoday{margin-top:6px;background:rgba(22,96,54,.12);border:none;color:#176036;padding:8px 14px;border-radius:10px;cursor:pointer;font-size:14px}
  .card-actions{display:flex;flex-wrap:wrap;align-items:center;gap:10px;margin:14px 0 6px}
  .card-btn{background:#fff;border:1px solid #bfe6cd;color:#176036;padding:9px 14px;border-radius:10px;cursor:pointer;font-size:14px;font-weight:600;transition:.15s}
  .card-btn:hover{border-color:#22b573;box-shadow:0 3px 10px rgba(34,181,115,.14)}
  .card-btn.done{background:#22b573;color:#fff;border-color:#22b573}
  .card-btn.primary{background:#22b573;color:#fff;border-color:#22b573}
  .card-stat{font-size:13px;color:#3a8a5c}
  .card-lib-btn{
    display:flex;align-items:center;justify-content:space-between;gap:10px;width:100%;
    margin-top:16px;padding:14px 16px;border-radius:14px;cursor:pointer;
    background:#fff;border:1px dashed #c9b2ee;color:#5b21b6;font-size:15px;font-weight:700;transition:.15s;
  }
  .card-lib-btn:hover{border-color:#7c3aed;box-shadow:0 4px 14px rgba(124,58,237,.12)}
  .card-lib-btn .cl-count{font-size:13px;font-weight:600;color:#9b6fd1;background:#f3eaff;padding:3px 10px;border-radius:999px}
  /* 学习卡片 · 学习态（点开学习时）—— 淡淡绿色背景 */
  .cards-wrap.study{background:linear-gradient(160deg,#f1faf3 0%,#f6fcf7 60%,#ecfaf0 100%);border:1px solid #d9efe2}
  .card-lib.study{background:linear-gradient(160deg,#f1faf3 0%,#f6fcf7 60%,#ecfaf0 100%);border:1px solid #d9efe2;border-radius:18px;padding:18px 18px 22px}
  .card-lib{margin-top:16px}
  .card-lib h3{font-size:15px;margin:0 0 10px;color:#7c3a9e}
  .card-lib .card-back{margin-bottom:12px}
  .card-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px}
  .card-chip{background:#fff;border:1px solid #e3d4f7;border-radius:12px;padding:10px 12px;cursor:pointer;transition:.15s}
  .card-chip:hover{border-color:#7c3aed;transform:translateY(-2px);box-shadow:0 4px 12px rgba(124,58,237,.12)}
  .card-chip.on{border-color:#7c3aed;box-shadow:0 0 0 2px rgba(124,58,237,.18);background:#f7f0ff}
  .card-chip .cc-tag{display:inline-block;font-size:10px;color:#9b6fd1;background:#f3eaff;border-radius:999px;padding:1px 7px;margin-bottom:4px}
  .cc-n{font-weight:700;font-size:14px;margin-bottom:3px;color:#4a1d8a}
  .cc-a{font-size:11px;color:#7c3a9e}

  /* 管理模型：板块总览与模型列表 */
  .mgmt-wrap{padding:6px 0}
  .mgmt-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:14px;margin-top:14px}
  .mgmt-card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:18px;cursor:pointer;box-shadow:var(--shadow);transition:.15s;border-left:4px solid var(--c)}
  .mgmt-card:hover{transform:translateY(-3px);box-shadow:0 8px 20px rgba(17,24,39,.1)}
  .mgmt-card .mc-ic{font-size:28px;width:48px;height:48px;display:flex;align-items:center;justify-content:center;border-radius:12px;margin-bottom:10px}
  .mgmt-card .mc-nm{font-size:17px;font-weight:800;margin-bottom:6px}
  .mgmt-card .mc-meta{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);margin-bottom:8px}
  .mgmt-card .mc-bar{height:7px;background:#e5e7eb;border-radius:999px;overflow:hidden}
  .mgmt-card .mc-bar>i{display:block;height:100%;transition:.3s}
  .subcat-models{padding:4px 0}
  .subcat-models .crumb{margin-bottom:10px}
  .back-link{color:#6366f1;cursor:pointer;font-weight:600}
  .back-link:hover{text-decoration:underline}
  .sm-head{display:flex;align-items:center;gap:12px;margin-bottom:14px}
  .sm-head .sm-ic{font-size:24px;width:44px;height:44px;display:flex;align-items:center;justify-content:center;border-radius:12px}
  .sm-head .sm-nm{font-size:18px;font-weight:800}
  .sm-head .sm-sub{font-size:12px;color:var(--muted)}
  .sm-model{display:flex;align-items:center;gap:11px;padding:13px 14px;background:var(--panel);border:1px solid var(--line);border-radius:12px;cursor:pointer;margin-bottom:9px;transition:.15s}
  .sm-model:hover{background:#f8fafc;border-color:#c7d2fe}
  .sm-model .sm-ic2{font-size:20px;width:38px;height:38px;flex-shrink:0;display:flex;align-items:center;justify-content:center;background:#f1f5f9;border-radius:9px}
  .sm-model .sm-info{flex:1}
  .sm-model .sm-nm2{font-size:14.5px;font-weight:700}
  .sm-model .sm-tag{font-size:12px;color:var(--muted)}
  .sm-model .sm-done{font-size:13px;color:#16a34a;font-weight:700;min-width:14px}
  .sm-model .sm-act{font-size:20px;color:#cbd5e1}
  .subcat-card{display:flex;align-items:center;gap:10px;padding:10px 11px;border-radius:10px;cursor:pointer;margin-bottom:6px;transition:.15s;border:1px solid transparent}
  .subcat-card:hover{background:#f1f5f9}
  .subcat-card .sc-ic{font-size:17px;width:30px;height:30px;flex-shrink:0;display:flex;align-items:center;justify-content:center;background:#eef2ff;border-radius:8px}
  .subcat-card .sc-nm{font-size:13.5px;font-weight:600;flex:1}
  .subcat-card .sc-cnt{font-size:11px;color:var(--muted)}
  .back-row{margin-top:2px}
  .back-btn{color:#6366f1;cursor:pointer;font-weight:600;font-size:12px}
  .back-btn:hover{text-decoration:underline}

  /* 返回按钮（顶部 header） */
  .h-back{display:none; align-items:center; justify-content:center; width:38px; height:38px; flex-shrink:0;
    margin-right:6px; border:none; background:#f1f5f9; color:#334155; border-radius:11px; font-size:24px; line-height:1; cursor:pointer; transition:.15s;}
  .h-back:hover{background:#e2e8f0}
  .h-back.show{display:flex}
  @media(max-width:780px){ .h-back{width:40px;height:40px;font-size:26px} }

  /* 内容区返回条 */
  .topback{display:flex;align-items:center;gap:10px;margin-bottom:12px;padding:6px 0;}
  .topback .tb-btn{flex-shrink:0;display:inline-flex;align-items:center;gap:3px;padding:7px 14px;border:none;
    background:#f1f5f9;color:#334155;border-radius:10px;font-size:14px;font-weight:700;cursor:pointer;transition:.15s}
  .topback .tb-btn:active{background:#e2e8f0}

  /* ---- 管理学 · 战略与竞争分析 ---- */
  "fiveforces":"波特五力由迈克尔·波特于1979年提出，用于判断一个行业的长期盈利潜力。它认为行业利润被五种竞争力量共同挤压：上游供应商、下游购买者、潜在进入者、替代品，以及现有竞争者之间的厮杀。分析时应逐项评估'谁的议价能力强、哪个力量在恶化'，从而找到最薄弱的环节去规避或建立壁垒。注意：五力是行业结构分析，不等于企业自身战略，需结合内部能力一起看。",
  "valuechain":"价值链由波特提出，把企业活动拆成基本活动（进料、生产、出货、营销、服务）与支持活动（人事、研发、采购、基建）。其核心思想是：竞争优势来自某些环节比对手做得更出色、更能创造价值。使用时先画出全链路，再用'哪些环节客户愿付溢价、哪些只是成本'来定位发力点。常见误区是把所有环节平均用力，或只盯生产成本而忽略服务、品牌等隐性价值环节。",
  "pestel":"PESTEL 是宏观环境扫描工具，覆盖政治、经济、社会、技术、环境、法律六类外部因素，常用于战略规划、市场进入与风险评估。它帮你跳出企业自身、看见大势：政策风向、消费代际变化、技术颠覆、合规红线等。适合在定战略、出海、转型前做一次系统扫描。注意：PESTEL 只列有哪些影响因素，不判影响多大，需结合权重与情景判断，否则容易列一堆无关项。",
  "blueocean":"蓝海战略（W. Chan Kim 与 Renée Mauborgne）主张避开血腥竞争的红海，通过价值创新同时追求差异化与低成本，开创没有对手的新需求空间。四步动作框架（剔除-减少-增加-创造）是落地核心：剔除行业习以为常的冗余、减少过度竞争元素、增加买家真正看重的、创造全新价值。适用于行业同质化严重、增长见顶时。误区是为创新而创新，却没人愿意买单。",
  "vrio":"VRIO 由 Barney 提出，是检验资源能否成为持续竞争优势的框架。四个字母分别代表：有价值 Value、稀缺 Rarity、难以模仿 Inimitability、组织可承载 Organization。只有四项全满足，资源才是持续竞争优势；缺一项就退化为竞争优势、暂时优势或竞争均势。常用于评估核心能力、专利、品牌、数据等。误区是只看有价值就以为有优势，忽略了组织能否真正把资源用起来。",
  "ansoff":"安索夫矩阵用现有/新产品 × 现有/新市场构成四个增长象限：市场渗透、市场开发、产品开发、多元化。它帮企业在做增长决策时先想清楚是靠老产品挖老市场，还是冒险开新线。风险从左上到右下递增，多元化最危险。适用于定年度增长方向、评估扩张路径。注意它只给方向，不评估能力是否匹配，进入新市场/新产品前需配套能力与资源分析。",
  "positioning":"定位理论（Trout 与 Ries）认为，在信息过载时代，胜负不在工厂或市场，而在顾客心智。企业应在某个品类里占据一个清晰、差异化、能被一句话说清的位置（如安全=沃尔沃）。关键动作是找到对手强势中的弱点，给自己一个词。误区是定位模糊（什么都想占）、频繁改定位，或只做产品不思心智。定位一旦确立需长期投入守住。",
  "genericstrategy":"波特的基本竞争战略指出，企业必须在三种通用战略中择一：成本领先、差异化、集中化（聚焦某一细分）。核心警告是夹在中间——既无成本优势也无差异，两头不靠最危险。选择取决于行业结构与自身资源。注意三种并非互斥到不能组合，但战略必须有一条清晰主线；同时追多线容易资源分散、定位失焦。",
  "ge":"GE/麦肯锡九宫格矩阵由通用电气与麦肯锡联合开发，用于多业务组合的投资决策。它以行业吸引力（市场增长、规模、利润、政策等加权）为横轴、企业竞争力（份额、品牌、技术、渠道等加权）为纵轴，把业务落入 3×3 九宫格，按绿/黄/红三区决定投资、选择性投资、收割退出。相比 BCG 矩阵只用增长率与份额两维，它维度更丰富，更适合复杂组合。使用步骤：列出业务 → 多因素打分 → 落位 → 分配资源。误区是打分主观、不动态复盘会变僵化。",
  /* ---- 管理学 · 组织与部门管理 ---- */
  "orgtype":"组织结构类型决定信息、权力与协作的走向。职能制按专业（财务、研发、销售）划分，效率高但易筑部门墙；事业部制按产品/区域划分，贴近市场、决策快但资源重复；矩阵制双线汇报，兼顾专业与项目协同但管理复杂。选择应匹配战略与规模：单一业务早期用职能制，多业务扩张转事业部/矩阵。注意结构不是越先进越好，要随战略阶段演进，频繁重组反而伤组织。",
  "flatvs":"层级与扁平化是管理幅度的两极。层级多（高耸型）命令链清晰、控制强，但信息传递慢、决策离一线远；扁平化管理层级少、信息快、授权一线，但对管理者幅度与员工自驱要求高。没有绝对优劣：小团队/创新业务适合扁平，大规模/强合规业务仍需一定层级。误区是盲目去中层导致管理者管不过来、失控，或层级过多养出官僚主义。应随规模与人才密度动态调整。",
  "zql":"责权利对等是管理的基本原则：给一个人多大责任，就要配多大权力与相应利益，三者必须对等才能落地。有责无权推不动、有权无责乱作为、有责无利留不住人。应用在定岗定编、授权、绩效考核中：指标下达时必须同步授予资源与决策权，并把收益与贡献挂钩。常见失败是只压 KPI 不给预算/人权，结果目标必然落空。",
  "amoeba":"阿米巴经营由稻盛和夫创立，把大企业划成多个独立核算的小单元（阿米巴），单元间按内部价格模拟交易，使每个单元都像一个小公司、人人算账。核心三要素：划小单元、内部市场化定价、经营数据透明。目的是把市场压力传导到每个细胞，激发一线主人翁意识。适用于中大型制造/服务企业想激活基层。注意内部定价若不公、核算太繁会引发内耗，需配套文化与 IT 支撑。",
  "matrixorg":"矩阵式组织让成员同时向职能经理（管专业与资源）和项目经理（管目标与交付）双线汇报，兼顾专业深度与跨职能协同。常见于研发、工程、咨询。最大优点是资源灵活共享、项目导向；最大痛点是双老板冲突、权责不清。落地关键是明确两条线的决策权重与冲突裁决机制、项目经理与职能经理的职责切分。误区是只设矩阵不立规则，结果人人都听自己的上级，协同落空。",
  /* ---- 管理学 · 目标与绩效管理 ---- */
  "kpi":"KPI（关键绩效指标）用少数关键指标量化目标达成度，分滞后指标（结果，如营收、利润）与领先指标（驱动因素，如拜访量、培训时长）。好的 KPI 应少而精、可量化、可追踪。它适合成熟业务的例行监控。注意只盯滞后指标（结果）会来不及纠偏，需配领先指标提前干预；也要避免 KPI 过多变成数字游戏，或指标与战略脱节。",
  "okr":"OKR（目标与关键结果）由 Intel 兴起、Google 发扬，用定性的目标 O（鼓舞人心）配 3-5 个量化的关键结果 KR 来对齐方向、聚焦重点。强调挑战性（达成 70% 即优秀）、公开透明、上下对齐。适合不确定高、需快速迭代的业务。与 KPI 区别：KPI 多用于考核维稳，OKR 多用于挑战突破。误区是把 OKR 当考核扣分工具、KR 写成任务清单而非结果，或上下不对齐各写各的。",
  "bsc":"平衡计分卡（Kaplan 与 Norton）从财务、客户、内部流程、学习成长四个维度平衡评价组织，避免唯财务短视。它把战略转化为可衡量的指标体系，四层因果相连：学习成长驱动流程、流程支撑客户、客户带来财务。适用于希望战略落地、关注长期健康的组织。误区是四个维度指标堆太多失去重点，或只当考核表，没用来讲战略故事与对齐行动。",
  "ksf":"KSF（关键成功因子）指在特定行业/业务中，决定胜负必须做好的少数几件事。比如便利店是选址与补货时效、手游是留存与社交。找出 KSF 后，把资源集中压在关键处，而非平均用力。使用是先界定在这个行业赢靠什么，再对照自身强弱。误区是 KSF 笼统（如服务好），应具体到可行动；且 KSF 随行业阶段变化，需定期重评。",
  "onion":"目标分解（剥洋葱法）把总目标逐层拆成年度 → 季度 → 月度 → 周 → 日，让宏大目标变成每天可执行的小动作。核心是每个层次都是上一层的支撑、下一层的方向。适用于把战略/年度 OKR 落到日常。注意分解要可承诺、可检查，避免层层加码变成不可能完成的数字；同时要保留弹性，防止为完成日指标牺牲长期。",
  "360":"360 度评估收集上级、同级、下级、自评甚至客户的全方位反馈，得到比单一上级视角更全面的绩效与发展画像。它擅长暴露盲点（自评与他评差距）。多用于发展性反馈而非纯粹奖惩。误区是当成打分手、匿名变泄愤，或评估者不熟悉被评人导致失真。须配套清晰标准、保密与反馈辅导，否则流于形式甚至伤团队。",
  "pfm":"绩效面谈是把考核转为发展的关键场景，常用四步：准备（用数据与事例而非印象）、反馈（具体、对事不对人）、倾听（听员工视角与困难）、改进（共同定行动计划）。好的面谈让人被看见、有方向；差的变成批斗或走过场。误区是只念分数不举事例、只批评不给支持，或主管一言堂不听解释。面谈谈的是未来怎么更好，不是过去谁错了。",
  "talent9":"麦肯锡人才九宫格（绩效-潜力九宫格）用当前绩效为横轴、未来潜力为纵轴，把人才落入 3×3 网格，用于人才盘点与差异化管理。右上超级明星（高绩效高潜力）重点保留与加速培养；左上高潜新秀需给挑战机会；右下业务专家/贡献者是稳定顶梁柱；中区中坚/核心骨干重点激励；左下问题员工需改进或淘汰。它帮管理者把模糊的人才判断变成九类可行动决策。注意潜力评估主观，需多源校准；落入网格只是起点，须配套发展计划。",
  /* ---- 管理学 · 团队管理工具 ---- */
  "belbin":"贝尔宾团队角色理论把团队角色分为九类：智多星（创新）、外交家（外接资源）、协调者（凝聚方向）、鞭策者（驱动节奏）、审议员（谨慎判断）、凝聚者（润滑关系）、执行者（落地）、完成者（细节把关）、专业师（技术权威）。核心洞见是高效团队靠角色互补而非全堆明星（九个智多星会吵成一团）。应用是组队前测角色、查缺口、做搭配。误区是把角色当固定标签给人贴死，忽略人可发展，或只选强角色忽视弱角色的必要性。",
  "tuckman":"塔克曼团队发展模型提出团队经历五阶段：形成 Forming（试探依赖）、震荡 Storming（冲突显现）、规范 Norming（建立规则）、成熟 Performing（高效协同）、解散 Adjourning（收尾转交）。管理者应因阶段施法：形成期给方向、震荡期疏导冲突而非压制、规范期立约、成熟期授权。误区是把震荡期的正常冲突当成团队不行而换人，或跳过规范直接要产出，结果地动山摇。",
  "conflict":"Thomas-Kilmann 冲突模型用坚持己见与合作两个维度，给出五种策略：竞争（高坚持低合作，紧急决断）、合作（双高，共赢解决）、妥协（各退一步）、回避（暂不涉及）、迁就（顾全关系）。没有哪种永远对，关键看情境：重要且可持续选合作，小事可迁就，紧急可竞争。误区是凡事竞争伤关系、凡事回避问题发酵，或把妥协当万能。先判断重要吗、关系重要吗再选策略。",
  "raci":"RACI 为每一项任务/决策明确四种角色：R 负责执行 Responsible、A 问责最终 Accountable（唯一）、C 咨询 Consulted（事前征求）、I 知会 Informed（事后告知）。它消除这事谁说了算、谁来做的模糊。应用是项目职责矩阵、会议角色、流程问责。关键是每项任务必须恰好一个 A，否则责任落空；R 可以有多个。误区是人人都是 A（等于没人负责），或 C/I 过多导致低效。",
  /* ---- 管理学 · 运营与流程管理 ---- */
  "pdca":"PDCA（戴明环）是计划 Plan-执行 Do-检查 Check-处理 Act 的持续改进闭环，强调小步试跑、周而复始。P 定目标方案、D 小范围试行、C 对照评估、A 把有效做法标准化、无效则进入下一轮改进。适用于质量管理、流程优化、个人习惯。优势是用低成本试错降低大改风险。误区是只 P 不 A（问题反复），或一次失败就放弃，没把闭环转起来。",
  "dmaic":"六西格玛 DMAIC 是数据驱动的质量改进方法论：定义 Define 问题与目标、测量 Measure 收集基线数据、分析 Analyze 找根因、改进 Improve 优化方案、控制 Control 固化维持。它追求把缺陷率降到百万分之三点四。适合流程稳定、波动大的问题。与 PDCA 区别是更强调统计测量与根因。误区是跳过测量凭经验，或改进后不控制导致回弹。",
  "7wastes":"精益七浪费指生产中不创造客户价值的七类损耗：过量生产、等待、运输、过度加工、库存、动作、不良品。精益的核心就是系统性识别并消除它们。使用是到现场 Gemba 逐条对照，优先消除过量生产（其他浪费之源）。常见误区是只砍显性浪费（如库存）却放任等待与过度加工，或只为降本牺牲质量——不良品反而是最大浪费。",
  "5s":"5S 源自日本现场的整理 Seiri、整顿 Seiton、清扫 Seiso、清洁 Seiketsu、素养 Shitsuke，打造有序、安全、高效的作业环境。前四 S 是方法与标准，最终落到素养——让员工养成习惯。适用于车间、仓库、办公室整理。价值是减少找物时间、降低差错与安全隐患。误区是只做卫生大扫除而不定置定位（整顿），或运动式搞一阵就回潮，没形成素养与标准。",
  "vsm":"价值流图 VSM 把从接单到交付的全流程——信息流、物流、增值与非增值（等待）——画在一张图上，让端到端一目了然，暴露瓶颈与浪费。核心是区分增值时间与等待时间，多数流程等待占比极高。使用是先画现状图、算交付周期、找最大等待、再画未来图。误区是只优化加工速度却放任排队等待，整体周期毫无改善。",
  "kanban":"看板 Kanban 源自丰田，用可视化看板与在制品 WIP 限制实现拉动式流动：下游完成才向上游拉取新任务，而非上游一股脑推。价值是任务一眼可见、瓶颈自动暴露、节奏平滑。适用于研发、运维、知识工作。关键是必须限制在制品才有用，否则只是任务墙。误区是把看板当展示板、不设上限，结果人人多任务切换、交付更慢。",
  /* ---- 管理学 · 创新与变革管理 ---- */
  "changecurve":"变革曲线（Kübler-Ross 适配组织变革）描述人面对变化经历否认 → 愤怒 → 讨价还价 → 抑郁 → 接受五阶段。它不是线性必达，但提示抵触是正常情绪过程。管理变革时识别员工所处阶段、用对应沟通（否认期讲清 why、愤怒期给支持而非强制）。误区是把抵触当不配合去压，反而延长曲线；或忽视情绪只推流程，变革必败。",
  "diffusion":"创新扩散（Rogers）描述新技术/产品如何被社会采用：经历导入期（慢、风险高）、成长期（早期采用者带动）、成熟期（主流跟随）、饱和/衰退期。叠加 S 曲线可见拐点。应用是判断进入时机、制定扩散策略（找早期意见领袖）。误区是在成熟期才重金进入红利已尽，或忽略跨越鸿沟（早期尝鲜者到主流之间的断裂带）导致夭折。",
  "designthink":"设计思维是以共情用户为核心的人本创新方法：共情 Empathize 理解真实需求、定义 Define 锁定真问题、创意 Ideate 发散、原型 Prototype 快速做样、测试 Test 验证迭代。它反对闭门造车，强调做给用户看。适用于需求不明、需突破的创新。误区是跳过共情直接想方案（做成自嗨产品），或过度调研不敢动手，迟迟不出原型。",
  "secondcurve":"第二曲线（Handy）主张在第一曲线（当前主业）仍处高峰、资源充裕时就启动第二曲线（新增长引擎），在两条曲线重叠期平滑接力，避免盛极而衰。难点在于未衰先变的反人性。适用于增长见顶、单一业务依赖的企业/个人。误区是等到主业明显下滑才找新路，此时资源与士气都已枯竭；或第二曲线与核心能力毫无关联，胜算低。",
  /* ---- 自我成长 ---- */
  "growthmindset":"成长型思维（Dweck）认为能力可通过努力与策略提升，而非天生固定。它带来更强的抗挫力与学习意愿：把挑战当机会、把失败当信息。对照固定型思维（我不行 → 放弃）。培养是用暂时还没替代不会、夸努力与策略而非天赋。误区是把成长型当口号，实际仍用结果给人贴标签，或误以为努力就行而忽略方法。",
  "habitloop":"习惯四步模型（Clear《原子习惯》）揭示习惯由提示 Cue → 渴求 Craving → 反应 Response → 奖赏 Reward 循环构成。要养成好习惯，就让它明显（提示）、有吸引力（渴求）、容易（反应）、令人满足（奖赏）；要戒除则反向——看不见、无吸引、难、不满足。应用是设计环境而非靠意志。误区是只靠打鸡血启动反应却无奖赏闭合，习惯难以自动维持。",
  "eisenhower":"艾森豪威尔矩阵按重要与紧急把事务分四象限：Q1 重要紧急（立即做）、Q2 重要不紧急（重点投资，如计划学习关系）、Q3 不重要紧急（授权）、Q4 不重要不紧急（减少）。多数人被困在 Q1/Q3 救火，忽略了决定长期成效的 Q2。使用是每日先把 Q2 排进固定时段。误区是把紧急误判为重要，或长期逃避 Q2 导致永远被动。",
  "flow":"心流（Csikszentmihalyi）指当挑战与技能相匹配、目标清晰、反馈即时时，人进入全神贯注、忘我高效的状态。过难焦虑、过易无聊，只有略超能力且反馈即时才入流。应用是设计工作/学习难度与即时反馈（如游戏化）。误区是以为越难越好反而制造焦虑，或环境频繁打断（多任务）永远进不了心流。",
  "review":"复盘四步法（如 AAR 回顾-评估-分析-总结）：回顾 Recall 客观还原事实、评估 Review 对照目标看差距、分析 Analyze 追问为什么找根因、总结 Improve 提炼规律并形成行动。它把一次经验转化为可复用能力。适用于项目结束、事故、每日站会。关键是对事不对人、深挖根因而非归咎。误区是变成秋后算账批斗会，或只谈感受不找根因，复盘流于形式。",
  "grow":"GROW 教练模型用四步引导对方自己找到答案：G 目标 Goal（想达成什么）、R 现状 Reality（现在在哪）、O 方案 Options（有哪些选择）、W 意愿 Will（下一步行动与承诺）。教练不直接给答案，而是通过提问激发对方责任感。适用于带人、辅导、自我规划。误区是管理者忍不住给建议抢了 GROW 的 O/W，下属依然不担责，或跳过现状直接想方案，方案脱离实际。",
  "kolb":"库尔布 Kolb 经验学习循环：具体经验 Experience → 反思观察 Reflect → 抽象概念 Conceptualize → 主动实验 Experiment，四步轮转把经验变能力。它说明只经历不反思学不深、只理论不实践落不了地。应用是设计培训与实践交替。误区是学完就过（缺反思与实验），或一直看书（缺具体经验），都学不牢。",
  "covey7":"柯维七个习惯构建从依赖到独立再到互赖的原则中心体系：主动积极、以终为始、要事第一（个人成功），双赢思维、知彼解己、统合综效（公众成功），不断更新（自我投资）。它强调先修内再连外。适用于个人效能与团队协作。误区是只学工具（要事第一）不修底层原则（主动积极），或跳过独立直接求互赖根基不稳，把双赢当妥协。",
  "sbi":"SBI 反馈模型让反馈客观可接收：S 情境 Situation（何时何地）、B 行为 Behavior（可观察的具体动作）、I 影响 Impact（对团队/结果的影响）。它只描述行为不贴标签，降低防御。适用于绩效反馈、批评、表扬都应结构化。误区是一开口就评价你态度差（触发防御），或只说影响不举行为对方不知改哪，表扬也要用 SBI 才具体。",
  "pyramid":"金字塔原理（Minto）主张表达与思考结论先行、以上统下、归类分组、逻辑递进。MECE 是配套原则：Mutually Exclusive 相互独立（不重叠）、Collectively Exhaustive 完全穷尽（不遗漏），常用于拆解问题。应用是汇报先抛观点再用三点 MECE 支撑；分析时干净切分。误区是背景讲十分钟领导没抓住重点，或分组既重叠又遗漏，论证站不住。",
  "firstprinciples":"第一性原理（马斯克常用）把问题拆到最基本、不可再分的事实/真理，再由此向上重构方案，而不是依赖类比（别人都这么做）。它利于颠覆式创新。步骤是列出假设 → 追问到基本事实 → 从零重组。误区是凡事都拆解到原子级太耗成本，或把类比全盘否定——类比快而省，适合成熟场景，第一性原理适合破局。",
  "goldencircle":"黄金圈（Sinek）用三个同心圆：Why 为什么（信念初心）→ How 怎么做（差异化方式）→ What 做什么（具体产品）。多数人从 What 向外讲，卖的是你做什么；伟大的组织由内而外，先讲 Why 来赢得认同与忠诚。应用是品牌、招聘、个人使命陈述。误区是只堆产品参数（What）用户无感，或 Why 假大空不真诚反而失信。",
  "deliberate":"刻意练习（Ericsson）指在有明确目标、处于舒适区外、极度专注、并获得即时反馈地练习，远胜无脑重复。关键要素是定义改进点、高投入不自动、马上知道错在哪、难度略超当前。适用于技能、乐器、运动、专业能力提升。误区是把十年重复当练习（实则同一水平打转），或只练已会的（流畅陷阱），不碰薄弱处。",
  "feynman":"费曼学习法以教代学检验真懂：①选一个概念 ②用大白话讲给外行听 ③讲不顺的地方就是盲区 ④回头补强再简化（用类比）。它的威力在于输出倒逼输入，暴露伪装的理解。适用于备考、掌握新领域。误区是只看不输出误以为懂，或讲解时用术语糊弄没真简化——术语堆砌正是没懂的信号。",
  /* ---- 心理学 ---- */
  "ebbinghaus":"艾宾浩斯遗忘曲线显示：识记后记忆保持率随时间急剧下降，且先快后慢——最初几小时忘得最多。对策是在陡降区前及时复习（如当天、第 2、4、7、15 天），用分散复习替代填鸭；更重要的是主动回忆（遮住答案回想）比重复阅读有效得多。误区是只在考前集中突击（学完即忘大半），或只重读不回忆错觉我会了。",
  "abc":"情绪 ABC（Ellis，理性情绪行为疗法）：不是事件 A 直接引发情绪 C，而是你对事件的信念 B 决定了结果。改变非理性信念 B（如一次失败=我完了）就能改善情绪与行为，步骤 D 辩论即质疑该信念。应用于情绪管理、认知重构。误区是把情绪归咎于外界（都是他气我），忽略自己解读的作用，或辩论时只喊口号不找证据。",
  "big5":"大五人格 OCEAN 用五个相对稳定的人格维度描述个体差异：开放性（好奇接纳新）、尽责性（自律可靠）、外向性（社交获取能量）、宜人性（信任合作）、神经质（情绪不稳）。它是学界最被广泛验证的框架，用于招聘、团队搭配、自我觉察。注意维度是连续谱非标签；高/低无绝对好坏，要看岗位匹配（如高尽责适合精细岗，高外向适合销售）。",
  "system12":"双重加工理论（Kahneman《思考，快与慢》）：系统 1 快思考自动、直觉、省力但易受偏差；系统 2 慢思考理性、分析、准确但费神。大脑默认省能走系统 1，多数误判源于此。应用是重要决策（投资、用人）刻意启动系统 2 复核，识别常见偏差（锚定、损失厌恶）。误区是以为自己总理性，或凡事都系统 2 太耗神，应区分何时该慢下来。",
  "maslow":"马斯洛需求层次把动机由低到高分为生理、安全、归属与爱、尊重、自我实现五层，通常低层满足后才追求高层（但非绝对阶梯）。应用是管理激励要看员工当前缺哪层——基层先给薪资安全，再给认可归属感，再到成长。误区是只盯钱（生理）忽略归属与尊重，或假设人人都先要自我实现；现代研究也提示需求可并存而非严格递进。",
  "structinterview":"结构化面试预先设定考察维度与评分标准，对所有候选人问相同问题、按统一锚定量表打分，显著降低晕轮、首因等主观偏差，提升预测效度（比非结构化高很多）。关键是基于岗位胜任力出题、用行为/情境题、多人独立评分。误区是问题太空泛（你最大优点），或虽有维度但打分凭印象无锚定，依然不可比。",
  "iceberg":"胜任力冰山模型（McClelland）把素质分水上/水下：水上知识、技能易识别易培养；水下角色定位、自我形象、特质、动机难改变却更决定长期绩效。选拔与发展应既看水上更看水下，尤其动机与特质。误区是只认学历证书（水上）忽视深层动机，招来好看不好用的人，或以为水下不能评估——可用行为面试与测评逼近。",
  "star":"STAR 面试法用情境 Situation 背景、任务 Task 目标、行动 Action 你具体做了什么、结果 Result 量化成果，结构化讲述一段经历，让回答有事实、可验证、难造假。候选人用它组织回答；面试官用它深挖。误区是只讲团队成果不提我做了啥（Result 无个人贡献），或 Result 无量化（取得了成功），或 S/T 冗长淹没 A。",
  "learnedhelpless":"习得性无助（Seligman 1967）指个体在反复遭遇无法掌控的负面事件后，即使后来环境改变、控制成为可能，仍放弃尝试。实验中被反复电击且无法逃避的狗，后来能轻松逃脱也不尝试。人同理——长期无效努力会内化为'做什么都没用'的信念，表现为被动、抑郁与动机丧失。破解之道是识别'真不可控'与'过去失败形成的惯性'，主动寻找哪怕一个小的可控点（如微目标、微行动）来重建掌控感，逐步打破放弃循环。它提醒我们：很多'我不行'其实是'我曾失控'，而非能力真缺。",
  "locus":"控制点理论（Rotter 1954）描述人解释事件成因的稳定倾向：内控者认为结果由自己努力与选择决定，外控者归因于运气、环境或他人。研究表明内控倾向与更高学业/职业成就、更好心理健康相关，因为它把能量投在可改变处。但需注意，并非凡事都该内控——承认某些不可控因素（宏观环境、他人决定）同样是理性，避免陷入'一切都是我的错'的自我苛责。实用做法是画两个圈：内控圈（你能影响的事，重点投入）与外控圈（你改不了的，学会放下与止损）。",
  "selfdetermination":"自我决定理论（Deci & Ryan）提出人的内在动机由三大基本心理需求驱动：自主（autonomy，感到掌控与选择）、胜任（competence，觉得自己能做好）、关系（relatedness，感到被接纳连接）。当三者被满足，人会主动、持久、幸福地投入；若用外部奖惩、命令、评价打压去'操控'，内在动机反而被侵蚀（过度理由效应）。应用：带人时给选择权而非命令、设可达成的挑战、建支持性关系；自我管理时问自己'这件事我自主吗、我能胜任吗、我和谁连接'。它解释了为什么'为兴趣而做'比'为钱而被逼'走得更远。",
  "impostor":"冒名顶替综合征（Clance & Imes 1978）指高成就者内心深处坚信自己的成功是运气或欺骗所得，随时会被'拆穿'，并不配拥有当前地位。它常见于女性、少数群体与新晋高手，导致长期自我贬低、过度准备与焦虑。关键事实是：你的成果真实存在，怀疑本身才是错觉。应对方法是建立'成就档案'——记录具体成果与赞美，在自我怀疑时翻出来对冲；并把'我只是运气'重构为'我准备了、我值得'。注意它不同于真正能力不足，而是对能力的系统性低估。",
  "fixedmindset":"固定型思维（Dweck）与成长型思维相对，认为人的能力是天生固定、不可改变的。持有它的人把失败解读为'我不行'而非'方法未到'，于是回避挑战、保护面子、在困难前早早退缩。它与成长型此消彼长，决定面对困难是前进还是逃跑。培养成长型的关键是用'暂时还没'替代'不会'（我还没掌握≠我永远不能），夸努力与策略而非天赋，把评价从能力转向过程。误区是把成长型当口号却不改底层评价习惯，或误以为'努力就行'而忽略方法。",
  "reactance":"心理抗拒（Brehm 1966）指当人感知到自由选择被剥夺或遭到强行说服时，会产生抵触情绪并反向行动——越被禁止越想要，越被说教越不听。它解释了逆反心理、'禁果效应'与命令式沟通的失效。应用在亲子、管理与说服中：少命令多给选项，把'你必须'换成'你可以选择'，保留对方的自主感。注意适度留白而非完全放任，否则失去引导；核心是让人觉得'这是我自己的决定'，而非'被你安排'。",
  "spotlight":"聚光灯效应（Gilovich 1999）指人系统性高估自己在他人眼中的显眼程度，以为出丑、打扮不当会被众人长时间记住，而实际他人注意力很快移开。它源于自我中心偏差——我们总以自己为主角，别人却各有各的事。意识到'别人没空一直盯着我'，能显著降低社交焦虑、过度自省与当众发言的恐惧。实用提醒：出糗后多数人几分钟内就忘了，与其反复回放自己的尴尬，不如把注意力放回当下要做的事。",
  "fundamental":"基本归因错误指人们在解释他人行为时，过度归因于其性格特质、低估情境因素（如压力、环境）；而解释自己时却相反，把失败推给外部。它导致苛责同事、误解陌生人。纠正方法是评价他人前先看'当时处境'再论'他是什么人'，区分偶发与一贯，少贴性格标签。自我侧则警惕自利归因（成功归己、失败归外）带来的盲目。它提醒：很多'他真不靠谱'其实是'他那一刻很难'，情境常比个性更关键。",
  "scarcity":"稀缺效应（Cialdini 影响原则之一）指当某物显得有限或限时，人的欲求与紧迫感陡增，同时认知变窄——只盯'快没了'而忽略自己是否真需要、有无更好替代。营销的'仅剩3件''倒计时失效'正是利用它促成冲动决策。觉察后能避免：面对稀缺话术，先问'没有这个紧迫感我还买吗'，把稀缺滤掉看真实需求；也提醒自己真正的稀缺资源是时间与注意力，别被人为制造的稀缺劫持。",
  "catharsis":"宣泄误区挑战了'发泄愤怒能减压'的传统假设。研究表明，反复大吵大闹、攻击性宣泄反而会强化大脑的愤怒回路，让下一次更容易暴怒，短期'爽'了长期更糟。真正有效的情绪调节是：先冷静（呼吸、离场降温）、再认知重构（理解触发源而非怪罪）、用运动代谢压力激素、或用表达性书写整理思绪。别把'骂出来'当疗愈，尤其对孩子——示范冷静处理比陪着发泄更有益。",
  "bystander":"旁观者效应（Latané & Darley 1964）指紧急情况下在场人数越多，个体出手相助概率反而越低，因为责任被分摊（'别人会管'）、且众人沉默被误读为'没事'。经典案例是38人目击却无人报警。破解有两面：作为求助者，务必指定具体人（'穿蓝衣的您，帮我报警'），把模糊责任变清晰；作为旁观者，主动认领责任、第一个行动，能打破集体沉默。它提醒：责任清晰才有人帮，别指望'总会有人'。",
  "socialpenetration":"社会渗透理论（Altman & Taylor）用'洋葱'比喻人际关系：由表及里分多层，从公开层（爱好、近况，谁都聊）到态度层（观点喜好，朋友间）、私人层（情感经历，挚友）、核心层（自我认同，极少数）。关系通过广度（话题数量）与深度（私密程度）双向扩展。实用启示：建立信任别一上来掏心掏肺，先扩广度再稳稳加深；且暴露要互惠——你深一层我才敢深一层，单向过度暴露反而让对方不适。关系质量取决于深度递进的节奏与 mutual 的信任。"
};

/* ============ 学习卡片：365 天每日一张、不重样 ============
   每张：n=名称 a=提出者 c=核心概念(80-200字) l=生活例子 t=今日启示
   要扩到真正 365 天不重样，只需往此数组继续补充卡片即可。 */
const CARDS = [
  {n:`自我效能感`, a:`Albert Bandura · 1977`, c:`自我效能感是班杜拉社会认知理论的核心概念，指个体对自己能否成功执行特定行为以达成预期结果的信念判断。它不同于一般自信，而是针对具体任务的能力预期，直接影响行为选择、努力程度和坚持时长。四大来源：成功体验（最强来源）、替代经验（看到他人成功）、社会劝说（他人的鼓励）、生理情绪状态（焦虑降低效能感）。效能感高的人把困难视为挑战而非威胁。`, l:`相信自己能学会弹吉他的人会比怀疑自己的人多练半小时，而这半小时又反过来增强信心。`, t:`通过小步骤的成功体验建立自信，把大目标拆成能做到的小事。`},
  {n:`成长型思维`, a:`Carol Dweck · 2006`, c:`成长型思维认为人的能力并非固定，而是可以通过努力、策略和反馈不断发展。与之相对的是固定型思维，把能力看作天生不变。拥有成长型思维的人更愿接受挑战、在失败后坚持，并把批评视为学习机会。脑科学也支持神经可塑性：持续练习能重塑大脑连接。关键在于"尚未"思维——暂时不会，不等于永远不能。`, l:`孩子数学考砸，固定型思维说"我笨"；成长型思维说"我还没掌握方法，换个思路再练"。`, t:`遇到挫折时把"我不行"改成"我还没学会"，把评价从能力转向过程。`},
  {n:`习得性无助`, a:`Martin Seligman · 1967`, c:`习得性无助指个体在反复经历无法掌控的负面事件后，即使后来环境改变、控制成为可能，仍放弃尝试的现象。塞利格曼用电击狗实验发现：当狗学会"无论怎么努力都无法逃避电击"，之后即便能轻松逃脱也不会尝试。人类类似——长期受困于无效努力的人会陷入"做什么都没用"的信念，表现为被动、抑郁与动机丧失。`, l:`反复投简历石沉大海的人，后来有面试机会也懒得准备，觉得自己"注定没戏"。`, t:`区分"真的无能为力"和"过去失败形成的惯性"，主动寻找哪怕一个小可控点。`},
  {n:`延迟满足`, a:`Walter Mischel · 1972`, c:`延迟满足是抑制即时诱惑、为更大长远回报等待的能力。米歇尔的棉花糖实验中，能等住不吃眼前棉花糖、换取双倍奖励的幼儿，多年后在学业、健康、抗压上表现更佳。它关联自控力与执行功能。但后续研究发现，等待能力也受"成人是否可信""环境是否稳定"影响——若承诺常落空，及时行乐才是理性选择。`, l:`健身的人今晚忍住不点外卖，换来的不是一块肌肉，而是半年后更健康的身体。`, t:`想要的东西值得等，就给未来的自己一个具体承诺；别让"马上就要"替你做决定。`},
  {n:`确认偏误`, a:`Raymond Nickerson · 1998`, c:`确认偏误指人倾向于寻找、解读、记忆那些支持自己已有信念的信息，而忽视或贬低相反证据。它让我们在社交媒体里只看到同温层观点，在投资时只关注利好消息。即使面对同样事实，不同立场的人也会得出相反结论。打破它需要主动寻找"最有可能证明我错"的信息，并认真对待反例。`, l:`买了某只股票后，你会不自觉地只刷看涨分析，对利空新闻视而不见。`, t:`做重要决定前，强迫自己列出三条"我可能错了"的理由。`},
  {n:`锚定效应`, a:`Tversky & Kahneman · 1974`, c:`锚定效应指人在判断不确定数值时，会过度受最初获得的信息（"锚"）影响，后续调整往往不足。即使锚是随机、无关的，也会扭曲估计。谈判中先开价者设定了锚；商场"原价划掉"的标签也是锚。理性决策需意识到锚的存在，主动从多个独立来源校准，而非围绕第一个数字修正。`, l:`看到"原价999、现价399"你会觉得划算，其实你根本不知道它值不值999。`, t:`面对数字先问"这个参照从哪来"，必要时归零重估，别被第一个数字带跑。`},
  {n:`损失厌恶`, a:`Kahneman & Tversky · 1979`, c:`损失厌恶指人对损失的痛苦感约为同等收益喜悦感的两倍，失去100元的难受要用赚约200元来抵消。它属于前景理论核心。这解释了为何人宁愿不卖亏损股票、不愿换更优方案、对"可能失去"极度敏感。营销的"限时优惠即将失效"正是利用损失厌恶推动行动。`, l:`免费试用到期要扣费，你明明用不上却懒得取消，只因为"放弃已拥有的"很疼。`, t:`把决策框架从"会失去什么"切换到"会得到什么"，避免被怕亏裹挟。`},
  {n:`峰终定律`, a:`Daniel Kahneman · 1999`, c:`峰终定律指人对一段体验的记忆，主要由"高峰时刻"（最强烈的正负情绪点）和"结束时刻"决定，而非总时长或全程平均。一次两小时的聚餐，若结尾难堪，整体印象便糟糕；痛苦的检查若结尾舒缓，回忆也没那么糟。它启示我们：设计体验时不必拉平全程，而要雕琢高潮与收尾。`, l:`一场电影前面精彩、结尾烂尾，你记得的会是"这部片毁了"。`, t:`重要的事（聚餐、汇报、一天）刻意安排一个漂亮的结尾，记忆会原谅过程的小瑕疵。`},
  {n:`心流`, a:`Mihaly Csikszentmihalyi · 1975`, c:`心流是当人们从事挑战与技能相匹配、目标清晰、反馈即时活动时，全神贯注、忘却时间的主观状态。此时自我意识消退、行动与意识合一。太易则无聊，太难则焦虑——最优区在两者交界。心流是幸福与高绩效的来源，常见于创作、运动、游戏。营造心流需减少干扰、设定明确小目标。`, l:`程序员debug三小时抬头发现天亮了，那种"忘了自己"的投入就是心流。`, t:`把大任务切成"跳一跳够得着"的关卡，关掉通知，让自己沉浸进去。`},
  {n:`邓巴数`, a:`Robin Dunbar · 1992`, c:`邓巴数指受大脑皮层容量限制，一个人能维持稳定社交关系（彼此认识且知对方关系）的人数上限约150人。再往外是熟人（约500）、脸熟（约1500）。它解释了原始部落规模、公司班组人数、社交软件好友上限等现象。提醒我们：关系质量取决于深度而非数量，泛泛之交难以替代挚友。`, l:`微信好友两千，真遇到事能借钱或倾诉的，往往还是那十几个老朋友。`, t:`与其广加好友，不如定期维护几段真正重要的关系。`},
  {n:`晕轮效应`, a:`Edward Thorndike · 1920`, c:`晕轮效应指人对某人某一方面（如外貌、声望）的好印象，会"光环"般扩散到其它无关特质，形成"好看=聪明=善良"的错误推断。反之负面特质也会连累整体。它在招聘、教学、品牌中广泛存在，导致判断失真。破除方法是把评价维度拆开、逐一基于证据，而非被单一亮点带偏。`, l:`面试时候选人名校光环太亮，面试官便默认他沟通能力也强，疏于验证。`, t:`评价人时逐项打分、写明依据，别让一个优点替其它能力背书。`},
  {n:`破窗效应`, a:`Wilson & Kelling · 1982`, c:`破窗效应指如果环境中的小失序（一扇破窗、一处涂鸦）长期不被修复，会暗示"这里没人管"，诱发更多违规行为，最终恶性循环。它强调"防微杜渐"：及时纠正微小偏差，能防止系统性溃败。应用于城市管理、团队纪律、个人习惯——第一处乱糟糟不收拾，很快处处乱糟糟。`, l:`楼道里第一袋垃圾没人清，过一周就堆成垃圾角。`, t:`坏习惯刚冒头就处理，别等"小问题"滚成"大问题"才动手。`},
  {n:`皮格马利翁效应`, a:`Rosenthal & Jacobson · 1968`, c:`皮格马利翁效应（又称罗森塔尔效应）指他人对一个人的期望，会通过态度、语言、互动方式被对方内化，最终使之表现真的朝期望方向发展。实验中，被告知"有潜力"的学生一年后成绩确实提升——并非能力突变，而是教师无意中给予更多关注与鼓励。它说明期望是种隐形塑造力。`, l:`教练坚信这孩子能成材，训练里多给机会，孩子真就越来越自信出色。`, t:`对人（尤其孩子、下属）给出具体的高期望，你的信任会变成他们的天花板高度。`},
  {n:`蔡格尼克效应`, a:`Bluma Zeigarnik · 1927`, c:`蔡格尼克效应指人对未完成、被打断的任务记忆更清晰、心理张力更强，而已完成的事容易被遗忘。服务员能记住未结账的订单细节，结账后就忘——因为"待办"状态持续占用心智。它既让人挂念未竟之事，也可被善用：主动暂停在关键处，能提升后续回忆与动力。`, l:`追的剧卡在悬念你念念不忘，看完大结局反而很快忘了剧情。`, t:`工作卡壳时故意在"快解出"处停手，大脑会在后台替你惦记，下次上手更快。`},
  {n:`虚假同感偏差`, a:`Lee Ross · 1977`, c:`虚假同感偏差指人倾向于高估别人与自己想法、偏好一致的程度，把自己的观点当作"常识"。支持某观点的人觉得"谁都该这么想"，喜欢某口味的人以为大众也爱。它源于以己度人，会加剧群体对立、误判民意。缓解方法是主动接触异见，把"我觉得"和"事实如此"分开。`, l:`你爱熬夜看书，便以为室友也"晚上效率高"，其实人家早睡早起。`, t:`下次想说"大家都这么认为"前，先想想：你问过几个人？`},
  {n:`控制点`, a:`Julian Rotter · 1954`, c:`控制点指人解释事件成因时，倾向归于内部（自己能掌控）还是外部（运气、环境、他人）的稳定信念。内控者认为努力改变结果，外控者觉得凡事靠运气或强权。内控倾向与更高的学业、职业成就和心理健康相关，但并非绝对——有时承认不可控因素也是理性。关键是分清"我能改的"和"我改不了的"。`, l:`项目失败，内控者复盘自己哪里可改进，外控者怪客户不靠谱、运气差。`, t:`把能量投在"内控圈"——你能影响的事上，对外因学会放下。`},
  {n:`认知重构`, a:`Aaron Beck · 1960s`, c:`认知重构是认知行为疗法的核心技术，指识别并挑战自动化负性思维（如"全或无""灾难化"），用更客观、平衡的想法替代，从而改善情绪与行为。它不否定事实，而是修正对事实的扭曲解读。例如把"我搞砸了一次=我一无是处"重构为"这次没做好，但能找到原因改进"。`, l:`被拒一次就觉得"没人会要我"，重构后会想"这家不合适，下家可能匹配"。`, t:`情绪崩时先抓出脑中那句话，问它：有证据吗？有没有更温和的版本？`},
  {n:`达克效应`, a:`Dunning & Kruger · 1999`, c:`达克效应指能力不足的人往往缺乏元认知，既做不对也意识不到自己不对，因而高估自己；而真正高能力者常因见多识广，反而低估自己。于是"无知者无畏，专家谦虚"。它提醒我们：遇到极度自信却漏洞百出的人，未必是狂妄，可能真不知道自己不知道。弥补靠持续学习与外部反馈。`, l:`刚学三天炒股的人敢教别人，真正研究十年的反而谨慎说"不一定"。`, t:`对自己"很懂"的领域保持警惕，主动找行家挑刺；对谦虚的高手多听。`},
  {n:`心理账户`, a:`Richard Thaler · 1985`, c:`心理账户指人会在心里把钱分门别类（吃喝、储蓄、赌资、礼金），每类有不同"该不该花"的规则，违背经济学"钱等价"原则。于是有人舍不得花工资买书，却大方用中奖钱请客；丢了100元心疼，赌场输100却不在意。理解它可帮我们统一财务决策，避免被分类偏见左右。`, l:`同样的500元，若是"年终奖"你就敢花，若是"房贷余额"就舍不得。`, t:`记账时把所有钱归到一个总账，按目标而非来源分配，花钱更清醒。`},
  {n:`沉没成本`, a:`经济学概念`, c:`沉没成本是已经发生、无论如何无法收回的投入（时间、金钱、精力）。理性决策只应看未来成本与收益，不应被过去投入绑架。但人常因"都付出这么多了"而继续加码，越陷越深，典型如烂尾项目硬撑、难吃却吃完的套餐。及时止损不是认输，而是把资源留给更值得处。`, l:`电影难看你看半小时就想走，却因"票钱都花了"硬坐到结尾更难受。`, t:`问自己"如果现在从头、没投过一分，我还做这件事吗"，答案常是止损。`},
  {n:`框架效应`, a:`Tversky & Kahneman · 1981`, c:`框架效应指同一信息的不同表述方式（框架）会改变人的选择，哪怕实质等价。"手术存活率90%"比"死亡率10%"更让人接受；"买一送一"比"打五折"诱人。它揭示决策依赖表述而非纯理性。应用：重要沟通选对框架；被推销时还原信息本质，看数字本身而非修辞。`, l:`同笔手续费，说"免首年"比"次年收"听起来更划算，其实一样。`, t:`被人用话术推动时，把话翻成中性数字再判断，别被包装带节奏。`},
  {n:`幸存者偏差`, a:`Abraham Wald · 1943`, c:`幸存者偏差指只看到"活下来/成功"的样本，忽略沉默的失败者，从而得出错误结论。二战时统计返航战机弹孔，军方想加固弹多处；统计学家瓦尔德指出应加固弹少处——那些中弹多的飞机根本没回来。商业成功学常犯此错：只研究富豪习惯，却无视同样习惯的普通人。`, l:`鸡汤书总结富豪都辍学，却不说辍学破产的更多，只是没人写书。`, t:`学榜样时追问"和TA做同样选择却失败的人去哪了"，结论才完整。`},
  {n:`马太效应`, a:`Robert Merton · 1968`, c:`马太效应源自"凡有的还要加给他"，指优势积累：已有资源、声望、成绩的人更容易获得更多，差距自我强化。学术界大牛更易发顶刊、拿经费；富者投资渠道更多。它解释不平等为何扩大。意识到它，可在早期主动积累关键"第一桶金"（技能、信用、人脉），让正向循环启动。`, l:`班级里受表扬多的孩子更自信更敢答，机会越多，差距悄悄拉大。`, t:`趁早在一个小领域做到前20%，让"微小优势"有机会滚成雪球。`},
  {n:`墨菲定律`, a:`Edward Murphy · 1949`, c:`墨菲定律：凡事只要有可能出错，就终会出错。它并非宿命，而是工程警示：复杂系统里隐患若未被排除，迟早暴露。应对之道不是焦虑，而是冗余设计、预演失败、小步验证。把"万一"变"预案"，把"可能出错"变成"已为它留后路"。`, l:`你赶时间偏遇堵车、重要汇报前一晚电脑死机——墨菲总挑关键节点。`, t:`对关键事多做一步备份（保存副本、提前到场），把墨菲变成"已防住"。`},
  {n:`帕金森定律`, a:`Cyril Parkinson · 1955`, c:`帕金森定律：工作会自动膨胀，占满所有可用时间。给一周的任务，往往拖到最后两天才突击完成；给两小时会议，两小时刚好用完却未必有结论。它揭示时间预算塑造行为。反制：人为压缩期限、设明确交付节点、用"时间盒"逼出效率。`, l:`论文 deadline 在月底，你前二十天刷剧，最后三天通宵赶完。`, t:`把大期限拆成多个"提前的小截止"，别让任务舒舒服服躺满全程。`},
  {n:`旁观者效应`, a:`Latané & Darley · 1964`, c:`旁观者效应指紧急情况下在场人数越多，个体出手相助的概率反而越低。因为责任被分散（"别人会管"）、且众人沉默被误读为"没事"。经典案例：38人目击谋杀却无人报警。破解：作为求助者要指定具体人（"穿蓝衣的您，帮我报警"），作为旁观者要主动认领责任。`, l:`地铁有人晕倒，一圈人围观却都等别人先动，结果没人动。`, t:`遇险别喊"救命"泛呼，要锁定一个人下指令，责任清晰才有人帮。`},
  {n:`纯粹接触效应`, a:`Robert Zajonc · 1968`, c:`纯粹接触效应（多看效应）指人仅因反复接触某事物，就会对其产生更高好感，无需任何额外信息。广告洗脑、循环中歌曲越听越顺耳，皆源于此。它说明熟悉即偏爱，是品牌曝光与人际亲近的低门槛策略。但也提醒：别把"眼熟"错当成"真好"。`, l:`某首歌初听一般，电台放了一周你竟开始跟着哼。`, t:`想让人接受新事物（方案、自己），先保证适度、重复、无害的曝光。`},
  {n:`自我实现预言`, a:`Robert Merton · 1948`, c:`自我实现预言指一个最初未必真实的预期，因被相信并采取相应行动，最终变成现实。老师以为某生聪明→多关注→该生真变好；被诬"小偷"的人因被当贼防，久之行为失当坐实标签。它既是皮格马利翁的正面版，也含负面标签的恶性循环。掌控它：给自己和他人贴上"能变好"的预言。`, l:`被认为"捣蛋"的孩子，在持续防备中真学会了捣蛋。`, t:`警惕别人贴给你的负面标签，也别轻易给旁人下定论。`},
  {n:`认知失调`, a:`Leon Festinger · 1957`, c:`认知失调指当人同时持有矛盾信念，或行为与自我认知冲突时，会产生心理不适，进而通过改变态度、否认事实或找理由来消解。吸烟者明知有害却说"我爷爷也抽，活到90"——正是用新理由平衡失调。理解它可解释诸多自欺，也提醒：减少失调靠面对而非自圆其说。`, l:`剁手买完又后悔，便说服自己"反正划算、迟早要买"来安抚内心。`, t:`发现自己强找理由原谅行为时，暂停一下：是真的合理，还是只为舒服？`},
  {n:`霍桑效应`, a:`Elton Mayo · 1924`, c:`霍桑效应指当人意识到自己正被观察、关注时，行为会暂时改善。工厂实验发现，无论调亮调暗灯光，工人效率都上升——变因不是环境，而是"被重视"。它说明关注本身即动力，也警示：实验或管理中的"被观察"会污染真实表现，评估需看长期常态。`, l:`老板站身后那会儿你打字飞快，他一走又摸鱼——你只是被看见了。`, t:`想激励人，先让其感到被看见；但评估成效要排除"表演性努力"。`},
  {n:`二八定律`, a:`Vilfredo Pareto · 1896`, c:`二八定律（帕累托法则）指许多系统中，约80%的结果来自20%的原因：20%客户贡献80%营收，20%bug导致80%崩溃，20%努力产出80%价值。它非精确铁律，而是提醒分布常高度不均。应用：把精力压在关键少数上，而非平均用力。识别你的"那20%"是杠杆点。`, l:`衣橱里常穿的永远就那几件，其余多数一年碰不到两次。`, t:`列清单找出产出最高的20%事项，优先做它们，其余能外包就外包。`},
  {n:`复利效应`, a:`金融/数学原理`, c:`复利指收益再投资，使本金与利息共同生息，呈现指数增长。它被称"世界第八大奇迹"。它的威力在后期爆发，前期缓慢——这正是多数人半途而废的原因。它不只用于钱：每天读10页、练20分钟，长期积累远超想象。关键是"不中断"，中断会让曲线归零重来。`, l:`每月存500、年化8%，二十年后远不止12万本金，而是近30万。`, t:`选一件小事每天做，把"持续"当作核心指标，让时间为你复利。`},
  {n:`黑天鹅事件`, a:`Nassim Taleb · 2007`, c:`黑天鹅指罕见、冲击巨大、事后看似可解释却事前难预测的极端事件（如2008金融危机、疫情）。它挑战"世界可被正态分布描述"的错觉：真正改变历史的常是离群值。应对：少做脆弱的线性押注，构建"反脆弱"——小亏能扛、大变能受益的组合，并为未知留冗余。`, l:`一家店平日平安，一场暴雨泡了仓库，没买保险的全年利润归零。`, t:`别只看平均风险，给极端情况留缓冲；用"如果最糟发生怎么办"做压力测试。`},
  {n:`公地悲剧`, a:`Garrett Hardin · 1968`, c:`公地悲剧指当资源为众人共享、个体可免费使用却由全体承担后果时，每个人理性地多占一点，最终资源枯竭、所有人受损。牧场、渔场、空气皆然。它揭示"个体理性导致集体非理性"。破解靠明晰产权、规则约束、或把外部成本内部化（如碳税、配额）。`, l:`小区草坪人人踩近道，最后没路可走，谁都埋怨别人却都踩。`, t:`面对共享资源先问"规则谁定"，能者自管，别等集体耗尽才后悔。`},
  {n:`囚徒困境`, a:`Albert Tucker · 1950`, c:`囚徒困境是博弈论经典：两嫌犯隔离审讯，若都沉默各判1年，若互相揭发各判3年，若一人揭发另一人沉默则揭发者自由、沉默者判5年。理性下双方都选揭发，结果(3,3)反差于最优(1,1)。它说明个体最优不等于集体最优，合作需要信任或重复博弈中的声誉约束。`, l:`两家公司都不降价能共赢，可每家都怕对手先降，于是轮流降价两败。`, t:`长期关系里主动释放合作信号、建立信任，能跳出"互相伤害"的均衡。`},
  {n:`艾宾浩斯遗忘曲线`, a:`Hermann Ebbinghaus · 1885`, c:`遗忘曲线揭示记忆随时间呈先快后慢的衰退：学完一天后遗留约33%，六天后仅约25%。遗忘在初期最猛，随后趋缓。对抗方法是"间隔重复"——在即将遗忘的节点复习，能把记忆加固并拉长。它奠定了 flashcards、Anki 等高效学习的科学依据。`, l:`考前通宵背的单词，考完一周基本还回给书本，因为没在遗忘点复习。`, t:`学完别等全忘再翻，按1天、3天、7天节奏回看，记得牢得多。`}
,
  {n:`白熊效应`, a:`Daniel Wegner · 1987`, c:`白熊效应（讽刺性反弹）指越刻意压抑某个念头，它越频繁冒出。韦格纳实验让受试者"别想白熊"，结果白熊反而萦绕心头。这是因为压抑需先"监控"该念头，反而提高了它的可得性。它解释了节食者总想食物、失恋者越想忘越难忘。破解法不是硬压，而是接纳并转移注意力到替代活动。`, l:`越告诉自己"别紧张"，心跳反而越快，白熊在脑子里越跳越欢。`, t:`不想某事时，别命令大脑停下，给它一个具体的替代焦点（如深呼吸、数呼吸）。`},
  {n:`聚光灯效应`, a:`Thomas Gilovich · 2000`, c:`聚光灯效应指人高估自己在他人眼中的显眼程度，仿佛被聚光灯打亮，以为自己的失误、外貌、尴尬都被人紧盯。实验中被要求穿丑衫的人估计半数人会注意，实际仅两成。它源于自我中心偏见——我们自己的世界以"我"为中心，便误以为别人也一样。放下它，社交焦虑会大幅缓解。`, l:`你今天头发乱了，一整天怕人笑，其实没人记得，大家都在想自己的事。`, t:`出丑后提醒自己"别人没那么关注我"，尴尬会更快过去。`},
  {n:`基本归因错误`, a:`Lee Ross · 1977`, c:`基本归因错误指评他人行为时过度归因于性格、低估情境；评自己则相反，把失败推给外因。看到别人迟到，我们想"他懒"；自己迟到，想"堵车没办法"。它导致人际误判与苛责。意识到它，能在指责前先问"他当时处境如何"，既宽容也更接近真相。`, l:`同事开会走神，你腹诽他不敬业，却不知他刚处理完家里急事。`, t:`评判别人前，先为对方想一个情境性理由，再下结论。`},
  {n:`稀缺效应`, a:`Robert Cialdini · 1984`, c:`稀缺效应指当某物显得有限、难得或即将失去时，其吸引力与紧迫感会骤升。"最后两件""限时优惠"正是利用它劫持决策。稀缺放大了我们对损失的敏感，让人冲动购买本不需要的东西。理性做法是暂停，问"若永远不缺，我还想要吗"。`, l:`直播间"只剩3单"的倒计时让你秒下单，到手才发现用不上。`, t:`面对稀缺话术先冷三秒，把它还原成"有没有真实价值"再决定。`},
  {n:`宣泄误区`, a:`Brad Bushman · 1999`, c:`宣泄误区指"发泄能消气"的常识并不可靠。研究发现，击打沙袋发泄愤怒后，人反而更具攻击性、情绪更差。情绪像火焰，添柴（发泄）会旺，而非灭。真正有效的是冷处理、运动、正念或表达性书写——把情绪转化为理解，而非强化。`, l:`跟人吵完你摔门骂街，气没消，反倒越想越火大。`, t:`怒上心头先离开现场、深呼吸，别用发泄给情绪加油。`},
  {n:`社会渗透理论`, a:`Irwin Altman · 1973`, c:`社会渗透理论把关系发展比作洋葱：由浅入深、由广度到深度，靠"自我暴露"层层推进。初识聊兴趣（表层），熟了谈价值观与脆弱（核心）。暴露需互惠且渐进，单方面掏心会吓退人。它解释了为什么深交需要时间，也提示经营关系要循序渐进地交换真诚。`, l:`新同事一上来就跟你倒苦水家丑，你本能想退后三步。`, t:`建立信任别一次交底，按对方节奏慢慢加深，关系才稳。`},
  {n:`承诺一致`, a:`Robert Cialdini · 1984`, c:`承诺一致原理指人一旦公开或主动做出承诺，会倾向于保持行为与其一致，以维护自我形象。写下目标的人更易坚持，因为食言带来认知失调。营销与小团体都善用"小承诺→大顺从"。善用它可以帮自己建立好习惯：把目标写下来、告诉朋友，用一致性推着自己走。`, l:`你公开说"本月读完三本书"，月底真的不好意思一本没碰。`, t:`想养成习惯，先做个小公开承诺，让"一致感"替你坚持。`},
  {n:`权威服从`, a:`Stanley Milgram · 1963`, c:`米尔格拉姆实验显示，普通人在"权威"指令下，会对陌生人施加远超预期的电击伤害，只因穿着白大褂的人说"继续"。它揭示人对权威的服从远超想象，也警示盲从的危险。保持独立判断需意识到权威未必正确，并允许自己质疑"凭什么"。`, l:`穿制服的人说"按我说的做"，你明明觉得不对，手却照做了。`, t:`遇到权威指令先问"依据是什么、后果谁担"，别让制服替你思考。`},
  {n:`从众效应`, a:`Solomon Asch · 1951`, c:`阿希实验中，当群体一致给出错误答案，约七成受试者至少一次跟着错答，只为不显得另类。从众源于归属需求与信息依赖——"大家都这么选，应该没错"。它既能维持秩序，也制造群体盲目。保持清醒需在关键决策时独立核实，而非被人数说服。`, l:`一排人都往一个方向看，你也跟着抬头，其实啥也没有。`, t:`众人一致时，先确认"他们真知道，还是也只是跟着"，再决定跟不跟。`},
  {n:`近因与首因`, a:`心理学发现 · 20世纪`, c:`首因效应指最先接收的信息印象最深，近因效应指最后接收的信息最易回忆，中间内容最易被遗忘。面试、演讲、汇报里，开场与收尾决定了大部分评价。应用：重要表达把好内容放在头尾，中间放支撑细节；记忆时也优先巩固首尾。`, l:`一场汇报开头惊艳、结尾有力，中间平铺，听众记住的仍是首尾。`, t:`写东西、做展示，把最关键的两点放在开头和结尾。`},
  {n:`启动效应`, a:`心理学发现 · 1980s`, c:`启动效应指先前接触的刺激会无意识地影响后续判断与行为。看到"老"字的人走路更慢，被"教授"启动的人解题更优。它说明环境线索悄悄塑造我们。善用：学习区贴目标词、桌面放书，让环境"启动"你想要的状态；警惕广告用暗示引导你。`, l:`桌上摆着健身照，你今天莫名多走了两千步。`, t:`想成为什么样的人，就先让环境里充满相关线索。`},
  {n:`情绪粒度`, a:`Lisa Feldman Barrett · 2016`, c:`情绪粒度指人区分和命名细微情绪的能力。粒度高能精准说出"是失落还是委屈、是焦虑还是疲惫"，而非笼统"不开心"。研究显示高粒度者情绪调节更好、压力更低，因为命名即安抚（ Affect Labeling 降低杏仁核反应）。提升方法：细化情绪词汇，写情绪日记。`, l:`你说不清是烦还是累，乱发脾气；朋友能分清"被忽视的委屈"，很快平复。`, t:`情绪上来时，试着给它一个更精确的名字，命名本身就能降温。`},
  {n:`过度自信`, a:`心理学发现 · 1990s`, c:`过度自信指人系统性高估自己的知识、能力与预测准确度，尤其对困难任务。90%的司机认为自己高于平均，投资者过度交易亏损更多。它源于"知道得越少越觉得自己懂"。缓解：主动列"我可能错在哪"、用外部基准校准、对小概率事件保持敬畏。`, l:`你估项目一周能完，实际拖了三周，还坚信"这次不一样"。`, t:`做预测时写下置信度和最坏情况，事后复盘，校准你的自信。`},
  {n:`选择过载`, a:`Barry Schwartz · 2004`, c:`选择过载（悖论）指选项过多反而降低满意度、增加后悔与决策瘫痪。24种果酱试吃摊转化率低，6种的高。太多选择让人疲于比较、总惦记"没选的那条更好"。应用：主动删减选项、设"足够好"阈值、减少不必要决策，把精力留给真正重要的。`, l:`外卖翻半小时菜单越看越饿却点不下，最后随便凑合还不满意。`, t:`小事用"满意即可"标准快速定，把选择力留给大事。`},
  {n:`曝光效应`, a:`Robert Zajonc · 1968`, c:`曝光效应（多看效应）指人仅因反复接触某事物就产生更高好感，无需任何额外信息。它说明熟悉即偏爱，是品牌曝光与人际亲近的低门槛策略，但也提醒别把"眼熟"错当"真好"。适度、重复、无害的曝光最能培养好感。`, l:`某首歌初听一般，电台放一周你竟开始跟着哼。`, t:`想让人接受新事物或新自己，先保证适度、重复、无害的出场。`},
  {n:`自我监控`, a:`Mark Snyder · 1974`, c:`自我监控指人根据情境调整言行以符合社交期待的程度。高自我监控者灵活应变、读气氛；低者更一致、表里如一。没有绝对优劣：高者在销售、外交占优，低者在需要真诚稳定的关系里更可信。了解自己的倾向，能在该变时变、该真时真。`, l:`聚会里有人八面玲珑切换话题，有人始终聊自己那点事，各有各的场。`, t:`需要合作时主动读气氛调姿态；需要被信任时保持前后一致。`},
  {n:`可得性启发`, a:`Tversky & Kahneman · 1973`, c:`可得性启发指人用"某事多容易想起"来判断它多常见。飞机失事新闻铺天盖地，让人怕飞却不怕更危险的驾车。 vivid、近期、情绪化的事更易得，扭曲风险评估。修正：用统计数据替代直觉，问"真实频率是多少"而非"我能想起几个"。`, l:`看完食品安全新闻你不敢外食，却天天忽视更致命的久坐。`, t:`恐惧某个小概率风险前，先查真实发生率，别被"好记"骗了。`},
  {n:`代表性启发`, a:`Tversky & Kahneman · 1974`, c:`代表性启发指人用"像不像某类"来判断概率，忽略基础概率。一个安静爱书的人，你更猜他是 librarian 而非 farmer，尽管农民基数大得多。它导致刻板印象与误判。修正：先想基础比率，再叠特征，别被典型形象带跑。`, l:`看到纹身壮汉，你本能防备，其实他可能是最温和的兽医。`, t:`判断前先问"这类人在总体里占多少"，基础概率常比表象更准。`},
  {n:`心理韧性`, a:`心理学概念 · 1970s`, c:`心理韧性（复原力）指面对逆境、创伤、压力时能有效适应并恢复的能力，而非"不受伤"。它像肌肉可锻炼：建立支持性关系、培养成长型思维、保持规律作息与意义感都能提升。韧性不是硬扛，而是允许脆弱、善用资源、在挫折后重建。`, l:`两人同遇裁员，一个消沉半年，一个三个月转型上岸，差在复原力。`, t:`把每次打击当"练韧性"的机会，平时攒好支持系统和好习惯。`},
  {n:`自律肌肉`, a:`Roy Baumeister · 1998`, c:`自我损耗理论把自律比作会疲劳的肌肉：连续克制后意志力下降，如拒甜点后更难忍烦躁。虽后被部分质疑，但"能量有限"提示我们：重要自律放精力高峰、减少同时克制、用习惯替代意志。把决策自动化，才能省下自制力。`, l:`白天硬撑专注，晚上报复性刷手机——意志力早已耗尽。`, t:`把最难的事放上午做，用流程和习惯替你省意志力。`},
  {n:`正念`, a:`Jon Kabat-Zinn · 1979`, c:`正念指有意识、不加评判地觉察当下身心与念头。它源自古典禅修，被科学证明可降焦虑、提升专注与情绪调节。核心不是清空头脑，而是"看见念头飘过却不跟随"。日常可借呼吸锚定、身体扫描、三步呼吸空间练习，把觉察带入吃饭走路。`, l:`你吃饭刷手机味同嚼蜡，正念吃饭时每一口都清楚，饱得更快。`, t:`每天留三分钟只关注呼吸，把"自动 pilots"拉回当下。`},
  {n:`微习惯`, a:`Stephen Guise · 2013`, c:`微习惯指把目标缩到小到不可能失败的一步：每天读1页、做1个俯卧撑。因门槛极低，行动阻力消失，而一旦启动易顺势多做；更重要的是它训练"行动的开关"。靠微量积累与复利，长期撬动大改变，专治"计划很美、执行为零"。`, l:`你定"每天跑5公里"三天放弃；改"穿好鞋站门口"反而坚持了半年。`, t:`想养成习惯，先把它砍到小到荒谬，让"开始"不再需要勇气。`},
  {n:`番茄工作法`, a:`Francesco Cirillo · 1980s`, c:`番茄工作法用25分钟专注+5分钟休息的节奏对抗拖延与疲劳。固定时长降低启动门槛，短休息防止烧干，记录番茄数提升成就感。核心是"期间只做一件事"，用计时器制造边界。适配写作、编程、学习等需要深度专注的任务。`, l:`你一上午刷手机啥也没干，改用番茄钟竟写完了报告初稿。`, t:`挑一件难事，设25分钟闹钟只做它，休息时彻底离开屏幕。`},
  {n:`SMART原则`, a:`Peter Drucker 衍生 · 1981`, c:`SMART 把目标拆为具体 Specific、可衡量 Measurable、可达 Achievable、相关 Relevant、有时限 Time-bound 五要素。模糊的"变好"难推进，清晰的"每月读两本书并写笔记"才可执行、可追踪。它是目标管理的基石，也适用于个人成长计划的落地。`, l:`你说"要健身"，三个月没动；写"每周三五次、每次30分"反而上了轨道。`, t:`把愿望改写成 SMART 句式，目标立刻从幻想变计划。`},
  {n:`两分钟法则`, a:`David Allen · 2001`, c:`两分钟法则来自 GTD：若一件事两分钟内能做完，立刻做，别排入待办。它避免"记录+稍后"的 overhead 超过执行本身，也清掉大量微小待办带来的心理负担。对稍大的事则"立刻开个头"，用启动成本的最小化对抗拖延。`, l:`邮件两分钟回完就清，你却标记未读堆了三百封越来越烦。`, t:`小事当场解决，别让它们排队消耗你的注意力。`},
  {n:`艾森豪威尔矩阵`, a:`Dwight Eisenhower · 1950s`, c:`艾森豪威尔矩阵按"重要/紧急"把事务分四格：重要紧急立刻做，重要不紧急计划做（最易被忽略却最关键），紧急不重要委派，不重要不紧急删除。多数人溺于"紧急"而荒废"重要不紧急"的健康、学习、关系，长期吃亏。`, l:`你天天救火回消息，健身读书永远"没空"，半年后身体亮红灯。`, t:`每天先安排一两件"重要不紧急"的事，别全被紧急绑架。`},
  {n:`习惯回路`, a:`Charles Duhigg · 2012`, c:`习惯回路由线索 Cue、惯例 Routine、奖赏 Reward 三要素构成，大脑用它节能。改习惯不是删惯例，而是保留线索与奖赏、替换中间惯例——如用散步替代抽烟来满足"休息奖赏"。识别自己的回路，才能有效重塑行为。`, l:`下午三点你自动伸手拿零食，其实是"累了要安慰"的回路在跑。`, t:`想改习惯，先记下"何时何地触发、得到了什么"，再换中间动作。`},
  {n:`刻意练习`, a:`Anders Ericsson · 1993`, c:`刻意练习指为提升特定能力而进行的高度结构化、有反馈、走出舒适区的练习，区别于自动化的"经验"。要点：明确目标、专注、即时反馈、反复修正弱点。它解释为何一万小时需"对的练"而非"混时间"。适用于技能、乐器、运动、专业领域。`, l:`同是十年工龄，有人年年精进，有人只是把第一年重复十遍。`, t:`练一样东西时，专挑不会的那块死磕，并找人给你反馈。`},
  {n:`费曼技巧`, a:`Richard Feynman`, c:`费曼技巧用"教别人"检验真懂与否：选一概念，假装讲给小白听，卡住处即知识漏洞，回去补，再简化语言。它逼你从记忆转向理解，暴露含糊。四步：学→讲→查漏→简化。是高效自学与备考的利器。`, l:`你以为懂了量子纠缠，一张嘴就卡壳，才知只是背了术语。`, t:`学完一点，试着讲给外行听，讲不顺的地方就是该补的。`},
  {n:`第一性原理`, a:`Aristotle / Elon Musk`, c:`第一性原理指抛开类比与既有假设，回归事物最基本的真理，再据此重建推理。马斯克造火箭时不被"火箭很贵"吓住，而是拆到材料成本重新算。它对抗"向来如此"的思维惰性，适合突破性创新与重大决策，但比类比思考更费脑力。`, l:`大家都说"这行就这样"，你回到需求本质，反而做出差异化产品。`, t:`遇到"不可能"，问"最底层的真相是什么"，从那里重新推导。`},
  {n:`黄金圈`, a:`Simon Sinek · 2009`, c:`黄金圈用 Why（为何）→ How（如何）→ What（做什么）三层解释卓越者如何打动人。多数人从 What 外圈讲起，伟大者从 Why 内核出发：人们不为你做什么买单，而为相信你为什么做。它适用于品牌、领导与个人定位——先说意义，再谈方法。`, l:`两个手机广告，一个列参数，一个讲"让创作自由"，你记住了后者。`, t:`说服人或规划时，先写清楚"为什么"，再补怎么做、做什么。`},
  {n:`金字塔原理`, a:`Barbara Minto · 1987`, c:`金字塔原理主张结论先行、以上统下、归类分组（MECE）、逻辑递进。汇报先抛核心观点，再用论据支撑，读者不绕路。MECE 指"相互独立、完全穷尽"地切分问题，避免重叠遗漏。它是咨询与高管沟通的标配，也提升个人表达效率。`, l:`你写了三页背景才到结论，领导早走神；同事一句结论再展开，全场跟住。`, t:`开口写东西前，先写那句"所以呢"，再围绕它搭论据。`},
  {n:`柯维七个习惯`, a:`Stephen Covey · 1989`, c:`柯维七习惯分"依赖→独立→互赖"三阶段：主动积极、以终为始、要事第一（独立）；双赢思维、知彼解己、统合综效（互赖）；不断更新（持续）。它从原则而非技巧入手，强调品格与内在操守，是个人与领导力成长的经典框架。`, l:`你总被邮件推着走，学了"要事第一"开始每天先啃最难那块。`, t:`挑一个习惯先练透（如主动积极），别七个一起上。`},
  {n:`GROW模型`, a:`John Whitmore · 1992`, c:`GROW 是教练式对话框架：Goal 目标、Reality 现状、Options 选项、Will 意愿/行动。教练不直接给答案，而是用提问帮对方自己理清"想去哪、现在哪、有哪些路、准备怎么做"。它适用于辅导、自我管理，把思考权交还给当事人。`, l:`下属卡壳你别急着给方案，用 GROW 问几句，他自己想通了。`, t:`遇纠结时，拿 GROW 四问自己：目标、现状、选项、下一步。`},
  {n:`库尔布学习循环`, a:`David Kolb · 1984`, c:`库尔布经验学习循环分四步：具体体验→反思观察→抽象概念→主动实验，再回到体验，螺旋上升。它强调"做中学"与"复盘"缺一不可：只体验不反思是盲目，只理论不实践是空谈。适配培训设计与个人复盘，让每次经历都转化为能力。`, l:`你踩坑后写复盘才真正长记性，光经历不反思等于白摔。`, t:`做完一件事，花十分钟走一遍"体验-反思-总结-再试"。`},
  {n:`SBI反馈`, a:`CTI · 1980s`, c:`SBI 反馈模型用 Situation 情境、Behavior 行为、Impact 影响 三要素给出具体、非评判的反馈。不说"你态度差"，而说"刚才会上（S）你打断了他三次（B），让他没法说完、团队也没听到关键意见（I）"。它降低防御、聚焦事实，是高效沟通工具。`, l:`你说"你总是不靠谱"对方炸毛；换成 SBI 他安静听进去了。`, t:`给别人反馈时，先说具体场景和行为，再说对你的影响。`},
  {n:`乔哈里窗`, a:`Luft & Ingham · 1955`, c:`乔哈里窗用四象限描述自我认知与他人认知的关系：公开区、盲目区（别人知你不知）、隐藏区（你知别人不知）、未知区。沟通与信任通过"自我暴露"扩大公开区、通过"寻求反馈"缩小盲目区而深化。它是团队与关系建设的经典工具。`, l:`你以为自己很好说话，同事却觉得你难接近——那是你的盲目区。`, t:`想被理解，适度暴露隐藏区；想成长，主动请人给你盲区反馈。`},
  {n:`期望理论`, a:`Victor Vroom · 1964`, c:`期望理论认为动机=期望（努力能达标）×工具性（达标有回报）×效价（回报对我有价值）。三者任一为零，动力就枯竭。它解释为何"画大饼"无效——员工不信道具、或不在乎奖品。激励他人要先确证这三环都通。`, l:`老板许诺升职你却不动，因为你不信真能轮到你。`, t:`自己没动力时，查哪环断了：是没信心、不信回报，还是根本不想要。`},
  {n:`目标梯度`, a:`Clark Hull · 1932`, c:`目标梯度效应指越接近目标，行动动力越强、速度越快，如老鼠离食物越近跑越快。营销的"进度条""集点卡"利用它促复购。个人应用：把大目标切成可见的小里程碑，每完成一个离终点更近，动力自然回升。`, l:` Loyalty 卡盖到第八格你跑得比前两格勤，因为"就差两个了"。`, t:`把长远目标画成进度条，临近完成时你会自动加速。`},
  {n:`蔡格尼克续`, a:`Bluma Zeigarnik`, c:`蔡格尼克效应还有积极一面：主动在任务关键点暂停，能让大脑后台持续惦记，下次上手更快、回忆更好。作家写到精彩处停笔、程序员留个 TODO，都是借"未完成张力"保持投入。它是对抗拖延与保持心流的巧妙杠杆。`, l:`你故意在解法快出来时去吃饭，饭后一坐竟顺手就写完了。`, t:`卡在一个好节点时主动停，让潜意识替你接着想。`},
  {n:`登门槛`, a:`Freedman & Fraser · 1966`, c:`登门槛技巧指先提一个小到难拒绝的请求，被答应后再提更大的，顺从率显著提升。因为它让人形成"我是乐于助人"的自我认知，后续保持一致。反之也可用于自己：先答应自己一个小改变，再逐步升级，习惯更易建立。`, l:`推销员先让你填个小问卷，再邀你听讲座，你一步步进了套。`, t:`想让自己坚持，先许一个小承诺，再用一致性推大一点的。`},
  {n:`门面技巧`, a:`Cialdini 等 · 1975`, c:`门面技巧（留面子法）指先提一个会被拒绝的大请求，再退而求其次提真想要的较小请求，对方因对比与补偿心理更易答应。它利用了拒绝后的愧疚与让步互惠。日常协商可善用，也需警惕被他人反向操作。`, l:`你先报高价被拒，再报真实价，客户反而觉得捡了便宜爽快签。`, t:`谈判或求助时，先抛一个稍大的方案，再退到真实目标。`},
  {n:`锚定修正`, a:`Tversky & Kahneman`, c:`锚定效应的对治是"有意识去锚"：面对第一个数字先质疑来源，主动从零估算，并参考多个独立锚（如市场价、历史值、第三方评估）取中。薪酬谈判前先调研区间，购物前先想"没有这个锚我愿付多少"，决策质量显著提升。`, l:`面试官先问期望薪资你被带偏，若先查行业区间再开价就稳了。`, t:`任何带数字的判断，先问"锚哪来的"，再独立重估一次。`},
  {n:`损失框架`, a:`前景理论应用`, c:`同一事用"得"或"失"框架表述，选择截然不同：疫苗"90%有效"比"10%失效"更易接受。了解框架效应，既能让自己的沟通更有说服力，也能在被营销时还原本质。关键是把话翻成中性数字再判断，别被修辞牵着走。`, l:`保险说"不买损失几十万"比"买了保几十万"更让你心动。`, t:`被人推动时，把话还原成中性数字，看本质而非包装。`},
  {n:`默认效应`, a:`Richard Thaler · 2008`, c:`默认效应（现状偏差）指人倾向于接受预设的默认选项，因为惰性、损失厌恶与"被设置即合理"的暗示。器官捐献率在国家间差异巨大，主因是"默认同意"还是"默认拒绝"。善用：把想做的设为默认（如自动储蓄、预装好习惯）；警惕他人用默认替你决定。`, l:`软件默认勾选续费你懒得改，半年后才发现被扣款。`, t:`把好习惯设成"默认开启"，把坏习惯设成"需主动开启"。`},
  {n:`心理距离`, a:`Yaacov Trope · 2000s`, c:`解释水平理论认为，事物离我们时间、空间、社会性越远，我们越用抽象、本质的方式思考；越近越具体。因此为远方目标（如明年减肥）易想得美好，临近时却被具体困难劝退。应用：远期规划想"为什么"，近期执行想"怎么做"，匹配心理距离才有效。`, l:`年初豪情"今年读50本"，年底发现只买了50本摆在架上。`, t:`远景靠意义驱动，近景靠步骤驱动，别用一套话术对付两者。`},
  {n:`自我同情`, a:`Kristin Neff · 2003`, c:`自我同情指以对待好友的善意、理解对待自己的失败与痛苦，而非自我苛责。研究显示它比自尊更稳定，能降焦虑、提复原力，因为它不依赖"比人强"。三要素：正念（不淹没）、共通人性（不止我这样）、自我友善。失败时是自我的盟友而非敌人。`, l:`朋友搞砸你安慰他，自己搞砸却骂自己废物——换个对待方式吧。`, t:`出错时先像安慰朋友那样对自己说句话，再想怎么改。`},
  {n:`成长记录`, a:`个人成长方法`, c:`成长记录（复盘日志）指定期把经历、决策、结果、教训写下来，把隐性经验显性化。它让进步可追踪、错误不重复，也是自我认知的镜子。形式不拘：日记、周复盘、项目 postmortem。关键在于诚实与定期回看，而非华丽文笔。`, l:`你年年犯同一种坑，因为从没写下过；同事有复盘本，三年少踩一半雷。`, t:`每周花二十分钟写"这周做对什么、踩了什么坑、下次怎么改"。`},
  {n:`能量管理`, a:`Jim Loehr · 2003`, c:`能量管理主张用"管理体能、情绪、专注、意义四种能量"替代单纯管时间，因为高效输出靠的是能量而非时钟。规律睡眠、间歇恢复、情绪调节、价值锚定，才能让人在关键时段全情投入。它重塑了"高效=更久工作"的误区。`, l:`你硬撑加班产出稀烂，同事按时休息反而交付更稳。`, t:`觉得效率低先查能量（睡够没、情绪稳否），别只会加时间。`},
  {n:`深度工作`, a:`Cal Newport · 2016`, c:`深度工作指在无干扰状态下进行的高认知价值活动，是稀缺且可训练的能力。与之相对的是浮浅工作（邮件、会议碎片）。它要求主动屏蔽干扰、设定专注时段、训练专注耐力。在信息过载时代，能深度工作者拥有不对称的优势。`, l:`你一天回消息开会，真正动脑为零；同事锁手机三小时写出了核心方案。`, t:`每天划出一段"免打扰"深度时段，只做那件最烧脑的事。`},
  {n:`最小可行产品`, a:`Eric Ries · 2008`, c:`MVP（最小可行产品）指用最低成本做出能验证核心假设的最简版本，快速试错而非闭门造完美。它把"大赌注"拆成"小实验"，用真实反馈迭代。适用于创业，也适用于个人项目：先发布粗糙版看反应，再决定投入，避免自嗨式空转。`, l:`你想做个 App 先学半年技术，别人用表单一周就验证了他要的需求。`, t:`有个想法别等完美，先做最简版扔出去看有人要吗。`},
  {n:`奥卡姆剃刀`, a:`William Ockham · 14世纪`, c:`奥卡姆剃刀原则：若无必要，勿增实体；对现象的解释，假设最少的最可能正确。它反对过度复杂化，提醒我们"简单往往更真"。排查问题时从最简假设入手，设计产品时删掉多余功能，沟通时去掉废话，都受其指引。`, l:`系统出 bug 你瞎猜十种复杂原因，其实只是没插电。`, t:`面对多种解释，先验证最简单的那个，别上来就搞复杂。`},
  {n:`汉隆剃刀`, a:`Robert Hanlon · 1990s`, c:`汉隆剃刀：能用愚蠢解释的，别归因于恶意。同事没回消息，多半是忙或漏看，而非针对你。它能大幅降低人际猜疑与内耗，把能量用在沟通而非揣测。当然不是纵容真恶意，而是先给一个善意、低消耗的默认解释。`, l:`朋友没邀你，你暗想"他故意的"，其实他名单漏发了。`, t:`被人"冒犯"先想"会不会只是疏忽"，少一点恶意解读。`},
  {n:`史托克代尔`, a:`James Stockdale · 1990s`, c:`史托克代尔悖论：身处绝境既要坚信终会胜利，又必须直面最残酷的现实，而非盲目乐观或绝望。越战被俘最久的将军靠它存活——乐观主义者总猜"圣诞前能出"而崩溃，他既信能活着出去，也接受当下每一天都难。它是韧性的核心姿态。`, l:`创业最惨时你既信能成，也老实承认账上只够三个月，反而稳住了。`, t:`艰难时同时握住两样：相信终会好，也承认现在有多糟。`},
  {n:`反脆弱`, a:`Nassim Taleb · 2012`, c:`反脆弱指不只抗打击（坚韧），而是能从波动、压力、混乱中获益、越挫越强。如肌肉经微损而增长、系统经小故障而健壮。应用：主动小成本试错、留冗余、避免"优化到零容错"的脆弱。它颠覆"稳定=安全"的认知，主张适度无序是养分。`, l:`你啥都备份到完美反而一遇变故就崩，朋友留余量反而稳。`, t:`别把生活优化到零缓冲，给小风浪留空间，让压力替你强身。`},
  {n:`系统思维`, a:`Donella Meadows · 1990s`, c:`系统思维把事物看作相互连接的反馈回路，而非孤立部件。它关注存量、流量、延迟与杠杆点——小处发力可撬动全局（如改规则而非加人手）。它警示"头痛医头"常转移问题。理解系统，才能在复杂问题里找到真正有效的干预点。`, l:`你天天灭火却不停产火，系统思维让你先把"火源"堵了。`, t:`反复出同样问题，别补漏洞，去查上游那个生成漏洞的机制。`},
  {n:`反馈环路`, a:`系统动力学`, c:`反馈环路分增强（正，如复利、口碑滚雪球）与调节（负，如恒温器、市场供需平衡）两类，且常有延迟。忽视延迟会让人误判因果、过度反应。识别你生活里的回路：哪些在自我强化、哪些在拉回平衡，便能有意识地设计良性循环。`, l:`你健身前两周没变化就放弃，其实增益回路有延迟，挺过就上坡。`, t:`好结果迟迟不来，先确认是不是"延迟的增强回路"，别中途断供。`},
  {n:`冰山模型`, a:`Sigmund Freud 衍生`, c:`冰山模型把人比作冰山：水面上的知识、技能易见易培养；水面下的特质、动机、自我概念难察却决定长期表现。招聘与自我认知都该穿透表象——会用什么工具（显性）不如为什么做（隐性）重要。它是人才评估的经典隐喻。`, l:`两人简历一样，一个为钱一个为真爱，三年后投入度天差地别。`, t:`看人看己别停在"会什么"，多问"底下那层是什么在驱动"。`},
  {n:`约哈里应用`, a:`Luft & Ingham`, c:`乔哈里窗在团队中的实操：用"自我暴露"分享顾虑与想法扩大公开区，用"360反馈"揭示盲目区，两者共同建立心理安全与信任。高绩效团队公开区大、彼此盲区小。个人可主动请同事"我哪点你最受不了"，把盲区变成长点。`, l:`团队复盘敢说"我这边卡了"，比互相甩锅的项目快一倍。`, t:`想团队变强，带头暴露自己的盲区，别人才敢跟。`},
  {n:`认知负荷`, a:`John Sweller · 1988`, c:`认知负荷理论指工作记忆容量有限，学习时若被无关信息、杂乱呈现占满，理解就崩。三类负荷：内在（内容难度）、外在（呈现方式）、相关（深度学习）。减负靠拆解、清晰结构、去除干扰。它直接指导了教材设计与高效自学的方法。`, l:`一页 PPT 塞满字图你啥也没记住，留白清晰的反而记住了。`, t:`学东西卡住，先看是不是呈现太乱，而非自己笨。`},
  {n:`生成效应`, a:`Norman Slamecka · 1972`, c:`生成效应指自己主动产出（写出、说出、推导）的信息比被动阅读记得更牢。因为生成需深度加工。应用：学完合上书复述、做题而非只看答案、教别人。它解释了为何"主动学"远胜"反复看"，是高效记忆的核心策略之一。`, l:`你划重点读了五遍不如闭眼默写一遍记得住。`, t:`学完立刻合上资料，自己把要点"生成"一遍。`},
  {n:`测试效应`, a:`心理学发现 · 2006`, c:`测试效应（提取练习）指回忆所学比重读更能巩固记忆。考过一次的知识点留存远高于多看几遍。它颠覆"复习=重读"的直觉，提倡用自测、闪卡、闭卷回想代替反复浏览。代价是提取时更费力——但费力正是加固的信号。`, l:`你考前狂看笔记还是忘，同学靠刷题自测反而记得牢。`, t:`别光看，合上书自测、做错题，记忆才真正长牢。`},
  {n:`交错学习`, a:`Robert Bjork · 1990s`, c:`交错学习指把不同但相关的主题/题型混合练习，而非集中死磕一种（massed）。虽当下更吃力，长期迁移与辨别力更强，因为大脑被迫区别适用场景。适用于数学题型、运动技能、语言。它提醒"舒服的重复"未必有效。`, l:`你一晚上只练一类题以为会了，考场上换顺序就懵；交错练的反而稳。`, t:`练一样东西时，把几种混着来，别舒服地重复同一种。`},
  {n:`间隔重复`, a:`Hermann Ebbinghaus 衍生`, c:`间隔重复基于遗忘曲线：在即将遗忘的节点复习，并逐步拉长间隔，用最少次数把记忆固成长久。Anki、闪卡都据此设计。关键不是"多看"，而是"在刚好快忘时再看"。它让大量知识以可承受的节奏真正记住。`, l:`你背单词每天从头来，永远停在第一页；按遗忘点复习的早滚完三遍。`, t:`学完设几个复习点（1天/3天/7天），在快忘时回看最省时。`},
  {n:`双重编码`, a:`Allan Paivio · 1971`, c:`双重编码理论：信息同时以语言与图像两种形式编码时，记忆更牢，因为两条提取路径互为备份。读书配图表、记单词想画面、学概念画脑图，都利用了它。它解释了为何"图文并茂"胜过纯文字，也指导了笔记与教学的呈现。`, l:`你死记历史事件枯燥，配上时间轴图一下就串起来了。`, t:`学抽象内容时，顺手画个图或想个画面，记得更牢。`},
  {n:`睡眠记忆`, a:`睡眠科学 · 2000s`, c:`睡眠中大脑会回放、整合白天所学，把短期记忆巩固进长期，并清理代谢废物。缺睡直接削弱记忆与创造力。研究建议成人7-9小时，重要学习后保睡眠比多刷题更有效。它把"早睡"从养生升级为学习策略。`, l:`你熬夜突击，考完全忘；室友早睡，知识反而焊进了脑子。`, t:`关键考试前别熬夜，睡好那一觉比多刷两套题值。`},
  {n:`注意力残留`, a:`Sophie Leroy · 2009`, c:`注意力残留指从任务A切到B后，部分注意力仍黏在A上，导致B表现下降，切换越未收尾越严重。频繁多任务因此低效。破解：任务间设"收尾仪式"（记一句进度、合上文档），让大脑真正切换，残留清零再开工。`, l:`你回完邮件立刻写报告，脑子里还转着刚才那封，半天进不了状态。`, t:`换事前花一分钟给上件"收尾"，再开始下一件，效率差很多。`},
  {n:`心象模拟`, a:`心理学发现 · 1990s`, c:`心象模拟（心理演练）指通过在脑中清晰预演动作与流程来提升真实表现，运动员赛前常做。它激活近似实际的神经通路，增强信心与熟练度。适用于演讲、考试、手术。要点是具体、多感官、重复，而非空泛"我能行"。`, l:`你上台前把每句话在脑子里过三遍，真上去竟不慌了。`, t:`重要场合前，闭上眼把过程演练几遍，身体会提前记住。`},
  {n:`社会比较`, a:`Leon Festinger · 1954`, c:`社会比较理论：人通过和他人比来评估自己，分上行（比更强，既激励也挫败）与下行（比更弱，获安慰）。社交媒体放大了上行比较，易致焦虑。健康用法：选可借鉴的榜样学方法，而非比结果；必要时退一步，记得比的是截图不是全貌。`, l:`刷朋友圈全是别人的高光，你默默觉得自己一事无成。`, t:`比较时问"我能学他什么"，而不是"我怎么不如他"。`},
  {n:`自我效能续`, a:`Albert Bandura`, c:`自我效能感有四大来源，最可主动经营的是"掌控体验"——做成小事积累的信心。其次是替代经验（见同况者成功）、言语劝说（他人鼓励）、情绪状态（焦虑降效能）。它比天赋更能预测坚持与成就，且可训练。`, l:`你连着小赢几把，竟敢接以前怕的大项目了。`, t:`想自信，别等大事，先攒一串"我做到了"的小胜利。`},
  {n:`内驱力`, a:`Edward Deci · 1985`, c:`自我决定理论区分外在驱动（奖罚）与内在驱动（兴趣、意义）。外在奖励有时反而"挤出"内在动机——本来爱画，一被按件计酬就不想画了。保护内驱力要满足自主、胜任、关系三需求，少用控制性奖励，多用认可与意义。`, l:`孩子爱看书，你一给"读一本奖十元"他反而不看了。`, t:`想长久做一件事，护住"我喜欢/有意义"，别轻易用钱绑架。`},
  {n:`成就动机`, a:`David McClelland · 1961`, c:`成就动机指追求卓越、把事做好的内在驱动力。高成就动机者偏好中等难度挑战（太易无感、太难挫败）、愿担责、重反馈。它可培养：通过设置可达又有点难的目标、建立清晰反馈。理解它有助于选职业与带队。`, l:`有人专挑"跳一跳够得着"的活干得带劲，有人只挑稳的慢慢废。`, t:`给自己设"有点难但够得着"的目标，成就感的燃料最持久。`},
  {n:`情绪劳动`, a:`Arlie Hochschild · 1983`, c:`情绪劳动指工作中需按规则管理、表演情绪（如客服微笑、护士镇定），长期消耗大，尤其当真实感受与要求相悖。它揭示"对人和善"也是体力活。应对：区分角色与自我、设情绪界限、下班后真正卸妆，避免情绪耗竭。`, l:`你白天对客笑脸晚上回家一句不想说，那是情绪劳动在透支。`, t:`需要表演情绪的职业，下班给自己一段"卸妆"时间。`},
  {n:`决策疲劳`, a:`心理学发现 · 2011`, c:`决策疲劳指一天中做的选择越多，后续决策质量越差、越倾向逃避或冲动。法官下午假释批准率骤降、人晚饭后乱吃，皆因如此。应对：把重要决定放精力高峰、减少日常小决策（固定菜单）、设默认选项，保护稀缺的意志力。`, l:`你早上还能理性，晚上逛超市全凭冲动往车里扔零食。`, t:`难决定放上午做；琐事设默认，别让小选择耗光你。`},
  {n:`峰终再探`, a:`Daniel Kahneman`, c:`峰终定律在服务的应用：用户评价一次体验看"最爽/最糟的那刻"加"结尾"，全程平均反而次要。投诉处理若结尾妥善，满意度反超从未出错的。它教我们主动设计高潮与收尾——一场培训、一次旅行、一天工作，漂亮结尾能挽救过程。`, l:`医院检查挺舒服，结尾护士一句冷嘲，你记住的全是那句。`, t:`任何交付都刻意安排一个温暖或有力量的结尾。`},
  {n:`禀赋效应`, a:`Richard Thaler · 1980`, c:`禀赋效应指人一旦拥有某物，就对其估值高于未拥有时，卖价远高于买价。它源于损失厌恶与"我的"身份绑定。解释为何烂在手里也不卖、免费试用后难退订。理性决策需想象"若从未拥有，我愿花多少买"，剥离拥有带来的溢价。`, l:`你闲置的会员舍不得退，明明用不上，只因"已经是我了的"。`, t:`纠结留不留时，问"若现在没有，我愿花这价买吗"，答案常是弃。`},
  {n:`沉没再探`, a:`行为经济学`, c:`沉没成本在关系与职业里同样致命：一段消耗你的感情、一个没前途的方向，因"都付出这么多年"而硬撑。理性做法是把"已投入"从账上划掉，只评估"从现在起，继续 vs 退出哪个更优"。及时转身不是浪费，是把剩余资源救回来。`, l:`你守着亏钱项目三年，只因"都投了这么多"，其实早撤能少亏一半。`, t:`卡在旧局里时，假装"重来没投过"，你会怎么选就怎么选。`},
  {n:`叙事自我`, a:`Daniel Kahneman`, c:`卡尼曼区分"体验自我"（实时感受）与"叙事自我"（回忆时重构的故事）。我们做决定常听叙事自我，而它受峰终定律扭曲——忽略漫长平淡、放大高潮结尾。理解这点，能在评价经历时更诚实，也别让"会怎么记住"过度绑架"当下怎么过"。`, l:`一趟旅行累惨了，回来你却只记得最后那张美照说"值了"。`, t:`别只按"以后会怎么回忆"活，也照顾当下真实的体验自我。`},
  {n:`拇指法则`, a:`启发式思维`, c:`拇指法则（经验法则）指用简单规则快速近似复杂判断，省时但易错。如"股价低于净值可买""出门带伞看云"。它在信息不足时高效，但别当铁律。关键是知道哪些是可靠启发、哪些已被证伪，并在重要决策时换精确方法。`, l:`你凭"看着顺眼"招人踩过雷，后来改成结构化面试才稳。`, t:`小事用经验法则提速，大事别偷懒，该算的还得算。`},
  {n:`情绪传染`, a:`心理学发现 · 1990s`, c:`情绪传染指人的情绪状态会通过表情、语调、姿态无意识传递给他，群体里尤其快——一个焦虑的领导能让全组紧绷。它解释了办公室气氛、家庭情绪。善用：主动带入平静与积极；自护：觉察"这情绪是谁的"，别照单全收。`, l:`你本来挺好，进会议室被主管的低气压瞬间带沉了。`, t:`进群体先稳住自己，别让别人的情绪默认下载到你身上。`},
  {n:`成长档案`, a:`个人发展方法`, c:`成长档案指系统收集能证明你进步的证据：完成的项目、学会的技能、收到的正向反馈。它对抗"冒名顶替"（觉得自己不配）与"当下焦虑"（觉得毫无进展）。定期翻看，能在低谷时给你客观底气，也是复盘与求职的素材库。`, l:`你怀疑自己没长进，翻去年的作品才发现早已脱胎换骨。`, t:`建个文件夹存"我做到了"的证据，低谷时它就是你的锚。`}
];

/* ============ 图表渲染 ============ */
function esc(s){return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");}
const PAL=["#2563eb","#7c3aed","#db2777","#059669","#f59e0b","#0ea5e9","#ef4444","#14b8a6","#a855f7"];
function pal(i){return PAL[i%PAL.length];}

function renderChart(cfg,m){
  const c=Object.assign({},cfg);
  if(cfg.type==="bar" && !cfg.items) c.items=m.points.map((p,i)=>({label:p.h,value:i+1,color:pal(i)}));
  if((cfg.type==="flow"||cfg.type==="cycle") && !cfg.steps) c.steps=m.points.map(p=>({l:p.h,d:p.p}));
  if(cfg.type==="pyramid" && !cfg.levels) c.levels=[...m.points].reverse().map(p=>({l:p.h,s:p.p}));
  switch(c.type){
    case "bar":return svgBar(c);
    case "matrix":return svgMatrix(c);
    case "cycle":return svgCycle(c);
    case "split":return svgSplit(c);
    case "flow":return svgFlow(c);
    case "line":return svgLine(c);
    case "pyramid":return svgPyramid(c);
    case "channel":return svgChannel(c);
    case "ninebox":return svgNinebox(c);
    default:return "";
  }
}

function svgBar(cfg){
  const w=640,h=360,pad=46;
  const max=cfg.max||Math.max(...cfg.items.map(i=>i.value));
  const n=cfg.items.length, gap=(w-pad*2)/n, bw=gap*0.6;
  let s=`<svg viewBox="0 0 ${w} ${h}" role="img" aria-label="${esc(cfg.title||'')}">`;
  for(let g=0;g<=4;g++){const y=pad+(h-pad*2)*g/4;const val=Math.round(max*(1-g/4));
    s+=`<line x1="${pad}" y1="${y}" x2="${w-pad}" y2="${y}" stroke="#eef2f7"/>`;
    s+=`<text x="${pad-8}" y="${y+4}" text-anchor="end" font-size="11" fill="#94a3b8">${val}</text>`;}
  cfg.items.forEach((it,i)=>{const x=pad+gap*i+(gap-bw)/2;const bh=(h-pad*2)*it.value/max;const y=h-pad-bh;
    s+=`<rect x="${x}" y="${y}" width="${bw}" height="${bh}" rx="7" fill="${it.color}"/>`;
    s+=`<text x="${x+bw/2}" y="${y-8}" text-anchor="middle" font-size="13" font-weight="700" fill="#334155">${it.value}${cfg.unit||""}</text>`;
    s+=`<text x="${x+bw/2}" y="${h-pad+20}" text-anchor="middle" font-size="12.5" fill="#475569">${esc(it.label)}</text>`;});
  s+=`</svg>`;return s;
}
function svgMatrix(cfg){
  const w=620,h=420,pad=20,cx=w/2,cy=h/2+10;const q=cfg.quad;
  let s=`<svg viewBox="0 0 ${w} ${h}" role="img" aria-label="${esc(cfg.title||'')}">`;
  const quads=[{x:pad,y:pad,w:cx-pad-6,h:cy-pad-6,c:q[0]},{x:cx+6,y:pad,w:w-cx-6-pad,h:cy-pad-6,c:q[1]},
    {x:pad,y:cy+6,w:cx-pad-6,h:h-cy-6-pad,c:q[2]},{x:cx+6,y:cy+6,w:w-cx-6-pad,h:h-cy-6-pad,c:q[3]}];
  quads.forEach(qd=>{s+=`<rect x="${qd.x}" y="${qd.y}" width="${qd.w}" height="${qd.h}" rx="12" fill="${qd.c.c}1a" stroke="${qd.c.c}" stroke-width="1.5"/>`;
    s+=`<text x="${qd.x+qd.w/2}" y="${qd.y+30}" text-anchor="middle" font-size="16" font-weight="800" fill="${qd.c.c}">${esc(qd.c.t)}</text>`;
    s+=`<text x="${qd.x+qd.w/2}" y="${qd.y+52}" text-anchor="middle" font-size="12" fill="${qd.c.c}">${esc(qd.c.d)}</text>`;});
  s+=`</svg>`;return s;
}
function svgCycle(cfg){
  const w=560,h=380,cx=280,cy=200,r=120,n=cfg.steps.length;
  let s=`<svg viewBox="0 0 ${w} ${h}" role="img" aria-label="${esc(cfg.title||'')}">`;
  for(let i=0;i<n;i++){const a=-Math.PI/2+i*2*Math.PI/n;const x=cx+Math.cos(a)*r,y=cy+Math.sin(a)*r;const col=pal(i);
    s+=`<circle cx="${x}" cy="${y}" r="56" fill="${col}" opacity="0.92"/>`;
    s+=`<text x="${x}" y="${y-4}" text-anchor="middle" font-size="13.5" font-weight="800" fill="#fff">${esc(cfg.steps[i].l)}</text>`;
    s+=`<text x="${x}" y="${y+13}" text-anchor="middle" font-size="10" fill="#fff">${esc(cfg.steps[i].d)}</text>`;
    const a2=-Math.PI/2+(i+0.5)*2*Math.PI/n;const ax=cx+Math.cos(a2)*(r+34),ay=cy+Math.sin(a2)*(r+34);
    s+=`<text x="${ax}" y="${ay+5}" text-anchor="middle" font-size="18" fill="#94a3b8">➜</text>`;}
  s+=`<circle cx="${cx}" cy="${cy}" r="26" fill="#1f2937"/><text x="${cx}" y="${cy+5}" text-anchor="middle" font-size="11" fill="#fff">循环</text>`;
  s+=`</svg>`;return s;
}
function svgSplit(cfg){
  const w=640,h=360;const cols=cfg.groups;const cw=(w-60)/2;
  let s=`<svg viewBox="0 0 ${w} ${h}" role="img" aria-label="${esc(cfg.title||'')}">`;
  cols.forEach((c,ci)=>{const x=20+ci*(cw+20);
    s+=`<rect x="${x}" y="20" width="${cw}" height="${h-40}" rx="12" fill="${pal(ci)}14" stroke="${pal(ci)}" stroke-width="1.5"/>`;
    s+=`<rect x="${x}" y="20" width="${cw}" height="34" rx="12" fill="${pal(ci)}"/>`;
    s+=`<text x="${x+cw/2}" y="42" text-anchor="middle" font-size="13.5" font-weight="800" fill="#fff">${esc(c.t)}</text>`;
    c.items.forEach((it,ii)=>{const iy=80+ii*((h-100)/c.items.length);
      s+=`<circle cx="${x+22}" cy="${iy+8}" r="5" fill="${pal(ci)}"/>`;
      s+=`<text x="${x+38}" y="${iy+13}" font-size="12.5" fill="#374151">${esc(it)}</text>`;});});
  s+=`</svg>`;return s;
}
function svgFlow(cfg){
  const w=680,h=230,n=cfg.steps.length;
  let s=`<svg viewBox="0 0 ${w} ${h}" role="img" aria-label="${esc(cfg.title||'')}">`;
  const bw=(w-40-(n-1)*26)/n,by=55,bh=110;
  cfg.steps.forEach((st,i)=>{const x=20+i*(bw+26);const col=pal(i);
    s+=`<rect x="${x}" y="${by}" width="${bw}" height="${bh}" rx="12" fill="${col}" opacity="0.12" stroke="${col}" stroke-width="1.5"/>`;
    s+=`<text x="${x+bw/2}" y="${by+32}" text-anchor="middle" font-size="14.5" font-weight="800" fill="${col}">${esc(st.l)}</text>`;
    s+=`<text x="${x+bw/2}" y="${by+60}" text-anchor="middle" font-size="11.5" fill="#475569">${esc(st.d)}</text>`;
    if(i<n-1)s+=`<text x="${x+bw+13}" y="${by+bh/2+6}" text-anchor="middle" font-size="20" fill="#94a3b8">➜</text>`;});
  s+=`</svg>`;return s;
}
function svgLine(cfg){
  const w=640,h=380,pad=46,yMax=cfg.yMax||100,pts=cfg.points,n=pts.length,xstep=(w-pad*2)/(n-1);
  let s=`<svg viewBox="0 0 ${w} ${h}" role="img" aria-label="${esc(cfg.title||'')}">`;
  for(let g=0;g<=4;g++){const y=pad+(h-pad*2)*g/4;const val=Math.round(yMax*(1-g/4));
    s+=`<line x1="${pad}" y1="${y}" x2="${w-pad}" y2="${y}" stroke="#eef2f7"/>`;
    s+=`<text x="${pad-8}" y="${y+4}" text-anchor="end" font-size="11" fill="#94a3b8">${val}</text>`;}
  const draw=(P,col)=>{const xy=P.map((p,i)=>[pad+xstep*i,h-pad-(h-pad*2)*p.y/yMax]);
    let d="M"+xy.map(p=>p[0].toFixed(1)+" "+p[1].toFixed(1)).join(" L");
    s+=`<path d="${d}" fill="none" stroke="${col}" stroke-width="3"/>`;
    xy.forEach((p,i)=>{s+=`<circle cx="${p[0]}" cy="${p[1]}" r="5" fill="${col}"/>`;
      s+=`<text x="${p[0]}" y="${p[1]-10}" text-anchor="middle" font-size="11" font-weight="700" fill="${col}">${P[i].y}</text>`;
      s+=`<text x="${p[0]}" y="${h-pad+20}" text-anchor="middle" font-size="11" fill="#64748b">${esc(cfg.xLabels[i]||'')}</text>`;});};
  draw(pts,"#db2777");
  if(cfg.points2) draw(cfg.points2,"#059669");
  s+=`</svg>`;return s;
}
function svgPyramid(cfg){
  const w=560,h=400,top=50,bottom=h-40,levels=cfg.levels,n=levels.length,gap=(bottom-top)/n;
  let s=`<svg viewBox="0 0 ${w} ${h}" role="img" aria-label="${esc(cfg.title||'')}">`;
  const cols=["#db2777","#e11d48","#be185d","#9d174d","#831843","#6b1133"];
  for(let i=0;i<n;i++){const yb=bottom-i*gap,yt=yb-gap+6;const wb=w*0.92*(i+1)/n,wt=w*0.92*(i+0.4)/n;
    const xb=(w-wb)/2,xt=(w-wt)/2;
    s+=`<polygon points="${xt},${yt} ${xt+wt},${yt} ${xb+wb},${yb} ${xb},${yb}" fill="${cols[i%cols.length]}" opacity="0.9"/>`;
    s+=`<text x="${w/2}" y="${yt+gap/2-2}" text-anchor="middle" font-size="14" font-weight="800" fill="#fff">${esc(levels[i].l)}</text>`;
    s+=`<text x="${w/2}" y="${yt+gap/2+15}" text-anchor="middle" font-size="11" fill="#ffe4ef">${esc(levels[i].s)}</text>`;}
  s+=`</svg>`;return s;
}
function svgChannel(cfg){
  const w=560,h=400,pad=46;
  let s=`<svg viewBox="0 0 ${w} ${h}" role="img" aria-label="${esc(cfg.title||'')}">`;
  s+=`<line x1="${pad}" y1="${h-pad}" x2="${w-pad}" y2="${h-pad}" stroke="#cbd5e1"/>`;
  s+=`<line x1="${pad}" y1="${h-pad}" x2="${pad}" y2="${pad}" stroke="#cbd5e1"/>`;
  s+=`<text x="${w-30}" y="${h-pad+22}" font-size="12" fill="#64748b">技能 →</text>`;
  s+=`<text x="14" y="${pad-10}" font-size="12" fill="#64748b">↑ 挑战</text>`;
  const x1=pad,y1=h-pad,x2=w-pad,y2=pad,off=46;
  s+=`<polygon points="${x1+off},${y1} ${x2},${y2} ${x2-off},${y2} ${x1},${y1-off}" fill="#059669" opacity="0.18"/>`;
  s+=`<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="#059669" stroke-width="2.5" stroke-dasharray="6 5"/>`;
  s+=`<text x="${w/2-70}" y="${pad+30}" font-size="12" font-weight="700" fill="#7c3aed">焦虑区</text>`;
  s+=`<text x="${w/2+30}" y="${h-pad-30}" font-size="12" font-weight="700" fill="#f59e0b">无聊区</text>`;
  s+=`<text x="${w/2-14}" y="${h/2}" font-size="12.5" font-weight="800" fill="#059669">心流通道</text>`;
  s+=`</svg>`;return s;
}
function svgNinebox(cfg){
  const w=560,h=520,gx=80,gy=28;
  const gw=w-gx-34, gh=h-gy-62, cw=gw/3, ch=gh/3;
  const cells=cfg.cells; // 9 strings, row-major: top-left -> bottom-right
  let s=`<svg viewBox="0 0 ${w} ${h}" role="img" aria-label="${esc(cfg.title||'九宫格矩阵')}">`;
  for(let r=0;r<3;r++)for(let c=0;c<3;c++){
    const x=gx+c*cw, y=gy+r*ch;
    const score=(2-r)+c; // 强者落在右上
    const col= score>=3?"#16a34a": score===2?"#f59e0b":"#ef4444";
    s+=`<rect x="${x+3}" y="${y+3}" width="${cw-6}" height="${ch-6}" rx="10" fill="${col}" opacity="0.13" stroke="${col}" stroke-width="1.4"/>`;
    s+=`<text x="${x+cw/2}" y="${y+ch/2+5}" text-anchor="middle" font-size="13.5" font-weight="800" fill="${col}">${esc(cells[r*3+c])}</text>`;
  }
  s+=`<text x="${gx+gw/2}" y="${h-34}" text-anchor="middle" font-size="12.5" font-weight="700" fill="#475569">${esc(cfg.xLabel||'')}</text>`;
  s+=`<text x="${gx+gw/2}" y="${h-15}" text-anchor="middle" font-size="11" fill="#94a3b8">低 ←→ 高</text>`;
  s+=`<text x="20" y="${gy+gh/2}" text-anchor="middle" font-size="12.5" font-weight="700" fill="#475569" transform="rotate(-90 20 ${gy+gh/2})">${esc(cfg.yLabel||'')}</text>`;
  s+=`</svg>`;return s;
}

/* ============ 练习题生成器（每模型 30 道案例分析选择题） ============ */
const SCENARIOS=[
  "某创业公司面对行业巨头碾压，市场份额持续下滑",
  "团队连续两次项目延期，成员士气低落、互相埋怨",

function seeded(seed){let s=seed%2147483647;if(s<=0)s+=2147483646;return ()=>(s=s*16807%2147483647)/2147483647;}
function shuffleArr(arr, rnd){
  const a=arr.slice();
  for(let i=a.length-1;i>0;i--){const j=Math.floor(rnd()*(i+1));[a[i],a[j]]=[a[j],a[i]];}
  return a;
}
/* 全模型扁平列表（用于"模型定位记忆"题的干扰项），带缓存 */
let _allModelsCache=null;
function allModelList(){
  if(_allModelsCache)return _allModelsCache;
  const arr=[];
  MGMT.subcats.forEach(sc=>sc.models.forEach(x=>arr.push(x)));
  for(const k in MODELS)MODELS[k].forEach(x=>arr.push(x));
  _allModelsCache=arr; return arr;
}
/* 每道题都明确绑定该模型的某个要点(j)或整体概念，正确答案即该要点的真实内容，
   干扰项来自同模型其他要点 / 其他模型简介——保证题干、选项、答案三者强相关。
   题型：A 概念记忆 · B 要点识别 · C 场景应用 · D 概念理解 · E 模型定位记忆 · F 真实案例解析。 */
function genQuestions(m){
  const pts=m.points;
  const labels=pts.map(p=>p.h);
  const descs=pts.map(p=>p.p);
  const N=pts.length;
  const hash=m.id.split("").reduce((a,c)=>a+c.charCodeAt(0),0);
  const rnd=seeded(hash+13);
  const othersIdx=j=>{const o=[];for(let i=0;i<N;i++)if(i!==j)o.push(i);return o;};
  const othersName=j=>othersIdx(j).map(i=>labels[i]).join("、");
  const allM=allModelList();
  const otherIntrosAll=shuffleArr([...new Set(allM.filter(x=>x.id!==m.id).map(x=>x.intro))], rnd);
  const hasCases=m.cases&&m.cases.length>0;
  const GENERIC=["该要点在实际操作中可暂缓，并非本模型核心内容","可直接照搬其他模型的同类做法，无需区分"];
  const TYPES=[
    // A 概念记忆：要点含义
    (j,scn,v)=>({stem:["在「"+m.name+"」中，\""+labels[j]+"\"这一要点的含义是？",
                       "关于「"+m.name+"」的\""+labels[j]+"\"，下列说法最准确的是？"][v%2],
      pool:[descs[j], ...othersIdx(j).map(i=>descs[i])],
      expl:"【概念记忆】\""+labels[j]+"\"指："+descs[j]+"。其余选项为该模型的其他要点，含义不同，不能混为一谈。"}),
    // B 要点识别
    (j,scn,v)=>({stem:["下面这描述的是「"+m.name+"」中的哪一个要点？\n\""+descs[j]+"\"",
                       "「"+m.name+"」里，下列描述对应的是哪一个要点？\n\""+descs[j]+"\""][v%2],
      pool:[labels[j], ...othersIdx(j).map(i=>labels[i])],
      expl:"【要点识别】\""+descs[j]+"\"正是「"+m.name+"」中\""+labels[j]+"\"要点的内容；其余为该模型其他要点的名称。"}),
    // C 场景应用
    (j,scn,v)=>({stem:[scn+"。运用「"+m.name+"」分析，最符合\""+labels[j]+"\"这一要点的做法是？",
                       scn+"。若以「"+m.name+"」的\""+labels[j]+"\"来改进，最贴切的做法是？"][v%2],
      pool:[descs[j], ...othersIdx(j).map(i=>descs[i])],
      expl:"【为什么选这项】在「"+scn+"」的情境下，"+labels[j]+"（"+descs[j]+"）直击当前最紧迫的问题，是最对路的切入点。\n【为什么不选其他】其余选项（"+othersName(j)+"）属于该模型的其他要点，侧重不同环节，并非本情境的首要抓手。"}),
    // D 概念理解
    (j,scn,v)=>({stem:["运用「"+m.name+"」时，关于\""+labels[j]+"\"下列说法符合该模型的是？",
                       "按「"+m.name+"」的逻辑，对\""+labels[j]+"\"理解正确的是？"][v%2],
      pool:[descs[j], ...othersIdx(j).map(i=>descs[i])],
      expl:"【概念理解】\""+labels[j]+"\"："+descs[j]+" 其余选项描述的是该模型其他要点，属于不同环节，不能张冠李戴。"}),
    // E 模型定位记忆（整体概念）
    (j,scn,v,job)=>{const foils=otherIntrosAll.slice((job.e||0)*3,(job.e||0)*3+3);
      return {stem:["「"+m.name+"」这一模型，其核心思想 / 主要用途最接近下列哪句话？",
                    "如果要一句话记住「"+m.name+"」，下面哪句最贴切？"][v%2],
        pool:[m.intro, ...foils],
        expl:"【模型定位】「"+m.name+"」的简介是："+m.intro+"——这才是本模型的核心定位。其余选项为其他模型的简介，容易混淆，需把模型与其用途对应记忆。"};},
    // F 真实案例解析
    (j,scn,v,job)=>{
      if(hasCases){
        const ci=job.ci % m.cases.length;
        const cs=m.cases[ci];
        return {stem:"【案例】"+cs.t+"："+cs.s+"\n依据「"+m.name+"」，此时最应侧重的是哪一项？",
          pool:[descs[j], ...othersIdx(j).map(i=>descs[i])],
          expl:"【为什么选这项】"+cs.a+" 落到本模型，"+labels[j]+"（"+descs[j]+"）正是该案例的关键。\n【为什么不选其他】其余要点（"+othersName(j)+"）虽属同模型，但侧重点不同，在本案例中并非首要。"};
      }
      return {stem:scn+"。依据「"+m.name+"」，此时最应优先把握的是？",
        pool:[descs[j], ...othersIdx(j).map(i=>descs[i])],
        expl:"【为什么选这项】「"+scn+"」情境下，"+labels[j]+"（"+descs[j]+"）最对路。其余为该模型其他要点，非本情境首要。"};}
  ];
  // 构造 30 题清单（与要点数 N 无关，恒为 30）：概念记忆/理解为主，案例少量但带"为什么"
  const typePlan=[];
  [['A',7],['B',4],['C',4],['D',6],['E',3],['F',6]].forEach(([t,c])=>{for(let i=0;i<c;i++)typePlan.push(t);});
  const tp=shuffleArr(typePlan, rnd);            // 确定性打乱顺序
  const TI={A:0,B:1,C:2,D:3,E:4,F:5};
  const eIdx=tp.map((t,i)=>t==='E'?i:-1).filter(i=>i>=0);
  const q=[]; let jc=0;
  tp.forEach((type,idx)=>{
    const j=(type==='E')?0:(jc++ % N);
    const job={type, j, ci:idx, e:eIdx.indexOf(idx)};
    const g=TYPES[TI[type]](j, SCENARIOS[(idx*3)%SCENARIOS.length], idx%2, job);
    let pool=g.pool.slice(0,4);
    if(pool.length<4){let gi=0;while(pool.length<4&&gi<GENERIC.length)pool.push(GENERIC[gi++]);}
    const correctText=pool[0];
    const opts=shuffleArr(pool,rnd);
    const a=opts.indexOf(correctText);
    q.push({q:g.stem, o:opts, a:a, e:g.expl});
  });
  return q;
}

const LS_KEY="study_wb_v1";
function saveProgress(){
  try{
    const data={learned:[...learned], exState:{}};
    for(const k in exState){
      const s=exState[k];
      data.exState[k]={answered:[...s.answered], correct:s.correct, wrong:s.wrong?[...s.wrong]:[]};
    }
    localStorage.setItem(LS_KEY, JSON.stringify(data));
  }catch(e){}
}
function loadProgress(){
  try{
    const raw=localStorage.getItem(LS_KEY);
    if(!raw)return;
    const data=JSON.parse(raw);
    if(data.learned) data.learned.forEach(id=>learned.add(id));
    if(data.exState){
      for(const k in data.exState){
        const d=data.exState[k];
        exState[k]={answered:new Set(d.answered), correct:d.correct||0, wrong:new Set(d.wrong||[])};
      }
    }
  }catch(e){}
}

function catStats(cat){
  const models=MODELS[cat];
  let learnedCount=0, totalAnswered=0, totalCorrect=0, totalQ=0;
  models.forEach(m=>{
    if(learned.has(m.id))learnedCount++;
    const st=exState[m.id];
    totalQ+=30;
    if(st){totalAnswered+=st.answered.size; totalCorrect+=st.correct;}
  });
  return {learned:learnedCount, total:models.length, answered:totalAnswered, correct:totalCorrect, totalQ, acc: totalAnswered?Math.round(totalCorrect/totalAnswered*100):0};
}

  const st=exState[id]||{answered:new Set(),correct:0,wrong:new Set()};
  return {answered:st.answered.size, correct:st.correct, total:30, acc:st.answered.size?Math.round(st.correct/st.answered.size*100):0, learned:learned.has(id), wrong:st.wrong?st.wrong.size:0};

/* 右滑返回（移动端）：从屏幕最左边缘向右滑动才返回上一级；纵向滚动(下滑看题)绝不误触发 */
let _sx=0,_sy=0,_dragging=false,_swiping=false,_curX=0,_edge=false;
function setupSwipe(){
  content.addEventListener("touchstart",e=>{
    if(e.touches.length!==1)return;
    _sx=e.touches[0].clientX; _sy=e.touches[0].clientY;
    _edge=_sx<40;                  // 必须从屏幕最左边缘开始
    _dragging=true; _swiping=false; _curX=0;
  },{passive:true});
  content.addEventListener("touchmove",e=>{
    if(!_dragging)return;
    const dx=e.touches[0].clientX-_sx, dy=e.touches[0].clientY-_sy;
    if(!_swiping){
      // 只认「从最左边缘明显的右滑」：dx 向右(正)且横向位移是纵向的 2 倍以上；否则一律交回浏览器(滚动/左滑)
      if(_edge && dx>10 && Math.abs(dx)>Math.abs(dy)*2) _swiping=true;
      else if(Math.abs(dy)>Math.abs(dx)){ _dragging=false; return; }
    }
    if(_swiping){
      e.preventDefault();
      _curX=Math.max(0,Math.min(dx,90));    // 跟随手指向右，最多 90px
      content.style.transition="none";
      content.style.transform="translateX("+_curX+"px)";
      content.classList.add("swiping");
    }
  },{passive:false});
  content.addEventListener("touchend",()=>{
    if(!_dragging)return; _dragging=false;
    if(_swiping){
      content.style.transition="transform .2s ease";
      if(_curX>55){ content.style.transform=""; goBack(); }    // 右滑够深 → 返回
      else { content.style.transform="translateX(0)"; }        // 否则回弹
      setTimeout(()=>{content.style.transition="";content.style.transform="";content.classList.remove("swiping");},220);
    }
    _swiping=false;
  });
}

      <span class="m-tag" style="background:var(${state.cat==='management'?'--mgmt':state.cat==='psychology'?'--psy':state.cat==='growth'?'--grow':'--mkt'})1a;color:var(${state.cat==='management'?'--mgmt':state.cat==='psychology'?'--psy':state.cat==='growth'?'--grow':'--mkt'})">${m.tag}</span>
    </div>
    <p class="m-intro">${m.intro}</p>
    <div class="tabs">
      <div class="tab active" data-p="learn">📖 介绍与学习</div>
      <div class="tab" data-p="quiz">✍️ 练习题（30）</div>
    </div>
    <div class="tabpane active" id="pane-learn">${learnPane(m)}</div>
    <div class="tabpane" id="pane-quiz">${quizPane(m)}</div>`;
  content.querySelectorAll(".tab").forEach(t=>t.onclick=()=>{
    content.querySelectorAll(".tab").forEach(x=>x.classList.remove("active"));
    content.querySelectorAll(".tabpane").forEach(x=>x.classList.remove("active"));
    t.classList.add("active");
    document.getElementById("pane-"+(t.dataset.p==="learn"?"learn":"quiz")).classList.add("active");
  });
  const tb=content.querySelector("#tbBack"); if(tb)tb.onclick=goBack;
  bindQuiz(m); updateStats();
}

/* ---- 进度环 SVG ---- */
function ringSVG(pct,color,r){
  r=r||52; const c=2*Math.PI*r; const off=c*(1-pct/100);
  return `<svg class="ring-svg" width="130" height="130" viewBox="0 0 130 130">
    <circle cx="65" cy="65" r="${r}" fill="none" stroke="#e5e7eb" stroke-width="9"/>
    <circle cx="65" cy="65" r="${r}" fill="none" stroke="${color}" stroke-width="9"
      stroke-dasharray="${c}" stroke-dashoffset="${off}" stroke-linecap="round"
      transform="rotate(-90 65 65)" style="transition:stroke-dashoffset .5s"/>
    <text x="65" y="62" text-anchor="middle" font-size="26" font-weight="900" fill="${color}">${pct}%</text>
    <text x="65" y="82" text-anchor="middle" font-size="11" fill="#94a3b8">完成率</text>
  </svg>`;
}

/* ---- 首页 ---- */
function homeHTML(){
  const totalModels=Object.values(MODELS).reduce((a,b)=>a+b.length,0);
  let totalLearned=0, totalAnswered=0, totalCorrect=0, totalQ=0;
  CATS.filter(c=>MODELS[c.key]).forEach(c=>{
    const s=catStats(c.key);
    totalLearned+=s.learned; totalAnswered+=s.answered; totalCorrect+=s.correct; totalQ+=s.totalQ;
  });
  const overallPct=Math.round(totalLearned/totalModels*100);
  const overallAcc=totalAnswered?Math.round(totalCorrect/totalAnswered*100):0;
  let h=`<div class="home-wrap">
    <div class="progress-ring">
      ${ringSVG(overallPct,"#6366f1")}
      <div class="ring-info">
        <h3>📈 总学习进度</h3>
        <p>已学 <span class="ring-num">${totalLearned}</span> / ${totalModels} 个模型<br>
        答题 <b>${totalAnswered}</b> / ${totalQ} 题 · 总正确率 <span class="ring-num" style="color:#16a34a">${overallAcc}%</span></p>
      </div>
    </div>`;
  // 三大板块
  CATS.filter(c=>MODELS[c.key]).forEach(c=>{
    const s=catStats(c.key);
    const pct=Math.round(s.learned/s.total*100);
    h+=`<div class="home-section">
      <h2>${c.icon} ${c.name}
        <span class="home-cat-toggle" data-cat="${c.key}">展开详情 ▼</span>
        <span style="margin-left:auto;font-size:13px;color:${c.color};font-weight:700">${pct}% · 正确率 ${s.acc}%</span>
      </h2>
      <div class="progress-ring" style="margin-bottom:8px">
        ${ringSVG(pct,c.color,40)}
        <div class="ring-info">
          <h3>${c.name}</h3>
          <p>已学 <b>${s.learned}</b>/${s.total} 模型 · 答题 <b>${s.answered}</b>/${s.totalQ} 题 · 正确率 <b style="color:#16a34a">${s.acc}%</b></p>
        </div>
      </div>
      <div class="home-model-list" data-cat="${c.key}">`;
    // 列出板块内每个模型
    if(c.key==="management"){
      MGMT.subcats.forEach(sc=>{
        h+=`<div class="subcat-h">${sc.name}</div>`;
        sc.models.forEach(m=>{const ms=modelStats(m.id);
          h+=homeModelRow(m,c.key,ms);});

      MODELS[c.key].forEach(m=>{const ms=modelStats(m.id);
        h+=homeModelRow(m,c.key,ms);});

function homeModelRow(m,cat,ms){
  const pct=Math.round(ms.answered/ms.total*100);

}
function bindHome(){
