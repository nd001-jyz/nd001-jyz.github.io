  h+=`<div class="card"><h3>📊 模型图解</h3><div class="sub">${m.chart.type==='matrix'?'结构示意':m.chart.type==='pyramid'?'层次示意':m.chart.type==='channel'?'状态通道':m.chart.type==='ninebox'?'九宫格矩阵':'核心框架'}</div>
      <div class="chart-wrap">${renderChart(m.chart,m)}</div></div>`;
  h+=`<div class="card"><h3>📌 学习案例</h3><div class="sub">结合真实场景理解模型</div>`+
      m.cases.map(c=>`<div class="case"><div class="ct">${c.t}</div><div class="cs">场景：${c.s}</div><div class="ca">分析：${c.a}</div></div>`).join("")+`</div>`;
  return h;
}
function quizPane(m){
  if(!exState[m.id]) exState[m.id]={answered:new Set(),correct:0,wrong:new Set()};
  const qs=m._q||(m._q=genQuestions(m));
  const st=exState[m.id];
  const total=qs.length;
  // 标记错题（如果有错题，排在前面）
  let order=Array.from({length:total},(_,i)=>i);
  if(st.wrong.size>0){
    order.sort((a,b)=>{
      const wa=st.wrong.has(a)?0:1, wb=st.wrong.has(b)?0:1;
      return wa-wb;
    });
  }
  let h=`<div class="ex-head">
      <div class="ex-score">已完成 <b id="exDone">${st.answered.size}</b>/${total} 题 · 正确率 <b id="exAcc">${st.answered.size?Math.round(st.correct/st.answered.size*100):0}%</b>${st.wrong.size?` · <span style="color:#dc2626">错题 ${st.wrong.size}</span>`:''}</div>
      <div class="ex-progress"><i id="exBar" style="width:${st.answered.size/total*100}%"></i></div>
      <button class="btn-reset" id="exReset">重置本题练习</button></div>`;
  h+=order.map((qi,idx)=>{
    const ex=qs[qi]; const isWrong=st.wrong.has(qi); const wasAnswered=st.answered.has(qi);
    let optsHTML=ex.o.map((o,oi)=>{
      let cls="opt"; let lk="";
      if(wasAnswered){cls+=" locked"; if(oi===ex.a)cls+=" correct";}
      return `<div class="${cls}" data-oi="${oi}" data-qi="${qi}"><span class="k">${String.fromCharCode(65+oi)}</span><span>${o}</span></div>`;
    }).join("");
    let exCls="explain";
    if(wasAnswered)exCls+=" show "+(isWrong?"no":"ok");
    let exHTML=wasAnswered?(isWrong?("❌ 正确答案："+String.fromCharCode(65+ex.a)+"。 "):"✅ 回答正确！ ")+ex.e:"";
    return `<div class="quiz" data-i="${qi}">
      <div class="q">${isWrong?'<span style="color:#dc2626;font-weight:800">[错题] </span>':''}${idx+1}. ${ex.q}</div>
      <div class="opts">${optsHTML}</div>
      <div class="explain ${wasAnswered?'show':''} ${wasAnswered?(isWrong?'no':'ok'):''}" id="ex-${qi}">${exHTML}</div></div>`;
  }).join("");
  return h;
}
function bindQuiz(m){
  const pane=document.getElementById("pane-quiz"); if(!pane)return;
  const qs=m._q||(m._q=genQuestions(m));
  const st=exState[m.id]||(exState[m.id]={answered:new Set(),correct:0,wrong:new Set()});
  pane.querySelectorAll(".quiz").forEach(q=>{
    const qi=+q.dataset.i; const ex=qs[qi];
    if(st.answered.has(qi))return; // 已答过的不可再点
    q.querySelectorAll(".opt:not(.locked)").forEach(opt=>opt.onclick=()=>{
      if(st.answered.has(qi))return;
      const oi=+opt.dataset.oi; const correct=oi===ex.a;
      q.querySelectorAll(".opt").forEach(o=>{o.classList.add("locked");if(+o.dataset.oi===ex.a)o.classList.add("correct");});
      if(!correct)opt.classList.add("wrong");
      const box=document.getElementById("ex-"+qi);
      box.className="explain show "+(correct?"ok":"no");
      box.innerHTML=(correct?"✅ 回答正确！ ":"❌ 正确答案："+String.fromCharCode(65+ex.a)+"。 ")+ex.e;
      st.answered.add(qi); if(correct)st.correct++; else st.wrong.add(qi);
      learned.add(m.id); updateExScore(m); renderSidebar(); updateStats(); saveProgress();
    });
  });
  const reset=document.getElementById("exReset");
  if(reset)reset.onclick=()=>{
    exState[m.id]={answered:new Set(),correct:0,wrong:new Set()}; saveProgress(); renderContent();
  };
}
function updateExScore(m){
  const st=exState[m.id]; const qs=m._q||[]; if(!st)return; const total=qs.length;
  const done=document.getElementById("exDone"),acc=document.getElementById("exAcc"),bar=document.getElementById("exBar");
  if(done)done.textContent=st.answered.size;
  if(acc)acc.textContent=(st.answered.size?Math.round(st.correct/st.answered.size*100):0)+"%";
  if(bar)bar.style.width=(st.answered.size/total*100)+"%";
}
function updateStats(){
  const total=Object.values(MODELS).reduce((a,b)=>a+b.length,0);
  document.getElementById("stTotal").textContent=total;
  document.getElementById("stLearned").textContent=learned.size;
  let done=0,correct=0;Object.values(exState).forEach(s=>{done+=s.answered.size;correct+=s.correct;});
  document.getElementById("stAcc").textContent=done?Math.round(correct/done*100)+"%":"—";
}

  let h=`<div class="welcome"><div class="big">👋 欢迎来到学习管理工作台</div>
    <p>请选择下方任务栏的模型分类，开始你的模型化学习之旅。共 ${Object.values(MODELS).reduce((a,b)=>a+b.length,0)} 个模型，每模型 30 道案例分析练习题。</p>
