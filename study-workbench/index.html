/* ============ 学习卡片模块 ============ */
function todayStr(){ const d=new Date(); return d.getFullYear()+"-"+(d.getMonth()+1)+"-"+d.getDate(); }
function cardTodayIndex(){
  // 以 2026-01-01 为纪元，按天取模 → 每天固定一张、循环不重样
  const epoch=new Date(2026,0,1); const now=new Date();
  epoch.setHours(0,0,0,0); now.setHours(0,0,0,0);
  const day=Math.floor((now-epoch)/86400000);
  return ((day%CARDS.length)+CARDS.length)%CARDS.length;
}
function cardsReadStore(){
  try{ return JSON.parse(localStorage.getItem("swb_cards_read")||"{}"); }catch(e){ return {}; }
}
function markCardRead(){
  const d=todayStr(); const s=cardsReadStore(); s[d]=(s[d]||0)+1;
  localStorage.setItem("swb_cards_read",JSON.stringify(s));
}
function isCardReadToday(){ return !!cardsReadStore()[todayStr()]; }
function cardsReadTodayCount(){ return cardsReadStore()[todayStr()]||0; }
function cardStreak(){
  const s=cardsReadStore(); if(!Object.keys(s).length) return 0;
  let streak=0; const d=new Date(); d.setHours(0,0,0,0);
  for(;;){
    const k=d.getFullYear()+"-"+(d.getMonth()+1)+"-"+d.getDate();
    if(s[k]){ streak++; d.setDate(d.getDate()-1); } else break;
  }
  return streak;
}
function cardsTotalRead(){ const s=cardsReadStore(); return Object.values(s).reduce((a,b)=>a+b,0); }
function cardBigHTML(c, opts){
  opts=opts||{};
  const badge = opts.random ? `<span class="card-badge">随机浏览</span>` : `<span class="card-badge today">今日卡片</span>`;
  const back  = opts.random ? `<button class="card-backtoday" id="backToday">↩ 返回今日卡片</button>` : "";
  return `<div class="card-big">
    <div class="card-big-head"><div class="card-name">${c.n}</div>${badge}</div>
    <div class="card-author">${c.a}</div>
    <div class="card-sec"><b>核心概念</b><p>${c.c}</p></div>
    <div class="card-sec"><b>生活例子</b><p>${c.l}</p></div>
    <div class="card-sec tip"><b>今日启示</b><p>${c.t}</p></div>
    ${back}
  </div>`;
}
function cardsHTML(){
  // 平时只认真学「当天的卡片」；未学习的卡片汇总到「卡片总览」，单独点开才总览
  const idx=cardTodayIndex(); const c=CARDS[idx];
  const todayN=cardsReadTodayCount();
  return `
    <div class="topback"><button class="tb-btn" id="tbBack">‹ 返回</button><span class="tb-crumb">学习卡片</span></div>
    <div class="cards-wrap study">
      <div class="card-stage" id="cardStage">${cardBigHTML(c,{random:false})}</div>
      <div class="card-actions">

        <button class="card-btn" id="reStudy">🔁 再学一遍</button>
        <span class="card-stat">今日已学 ${todayN} 次 · 累计 ${cardsTotalRead()} 天 · 连续 ${cardStreak()} 天</span>
      </div>
      <button class="card-lib-btn" id="openLib">📚 卡片总览（未学 ${CARDS.length} 张，点开可任意学习）<span class="cl-count">全部 ${CARDS.length} 张</span></button>
    </div>`;
}
function cardLibHTML(){
  const idx=cardTodayIndex();
  return `
    <div class="topback"><button class="tb-btn" id="tbBack">‹ 返回</button><span class="tb-crumb">学习卡片 · 总览</span></div>
    <div class="cards-wrap">
      <div class="card-lib">
        <h3>全部 ${CARDS.length} 张卡片 · 点任意一张学习（可重复）</h3>
        <div class="card-grid">
          ${CARDS.map((x,k)=>`<div class="card-chip ${k===idx?'on':''}" data-i="${k}"><span class="cc-tag">#${k+1}</span><div class="cc-n">${x.n}</div><div class="cc-a">${x.a}</div></div>`).join("")}
        </div>
      </div>
    </div>`;
}
function bindCards(){
  const tb=content.querySelector("#tbBack"); if(tb)tb.onclick=goBack;
  const stage=content.querySelector("#cardStage");
  function setStage(idx, random){
    if(stage){ stage.innerHTML=cardBigHTML(CARDS[idx],{random:random});
      const bt=stage.querySelector("#backToday"); if(bt)bt.onclick=()=>setStage(cardTodayIndex(),false); }
  }
  const rnd=content.querySelector("#randCard");
  if(rnd)rnd.onclick=()=>{ setStage(Math.floor(Math.random()*CARDS.length),true); };
  const re=content.querySelector("#reStudy");
  if(re)re.onclick=()=>{ markCardRead(); const st=content.querySelector(".card-stat");
    if(st)st.textContent=`今日已学 ${cardsReadTodayCount()} 次 · 累计 ${cardsTotalRead()} 天 · 连续 ${cardStreak()} 天`; };

  if(lib)lib.onclick=()=>{ content.innerHTML=cardLibHTML(); bindCardLib(); };

function bindCardLib(){
  const tb=content.querySelector("#tbBack"); if(tb)tb.onclick=()=>{ content.innerHTML=cardsHTML(); bindCards(); };
  content.querySelectorAll(".card-chip").forEach(el=>el.onclick=()=>{
    const i=parseInt(el.dataset.i,10);
    const wrap=document.createElement("div");
    wrap.innerHTML=cardBigHTML(CARDS[i],{random:true});
    const stage=document.createElement("div"); stage.className="card-stage"; stage.id="cardStageLib";
    stage.appendChild(wrap.firstChild);
    const backBtn=document.createElement("button");
    backBtn.className="card-backtoday"; backBtn.textContent="↩ 返回总览";
    stage.querySelector(".card-big").appendChild(backBtn);
    const lib=content.querySelector(".card-lib");
    const libWrap=content.querySelector(".cards-wrap");
    if(libWrap)libWrap.classList.add("study");
    lib.classList.add("study");
    lib.innerHTML=""; lib.appendChild(stage);
    backBtn.onclick=()=>{ content.innerHTML=cardLibHTML(); bindCardLib(); };
  });
}

/* ---- 错题集 ---- */
function errorsHTML(){
  let h=`<div class="err-wrap"><div class="welcome" style="padding:20px 0 16px"><div class="big">❌ 错题集</div>
    <p>这里汇总了你在练习中答错的题目。点击对应板块查看错题模型，重新学习后再做题。</p></div>`;
  let hasErrors=false;
  CATS.filter(c=>MODELS[c.key]).forEach(c=>{
    const models=MODELS[c.key].filter(m=>{
      const st=exState[m.id]; return st&&st.wrong&&st.wrong.size>0;});
    if(models.length===0)return;
    hasErrors=true;
    let wrongCount=0;
    models.forEach(m=>{const st=exState[m.id]; wrongCount+=st.wrong.size;});
    h+=`<div class="err-cat-card" data-cat="${c.key}">
      <div class="err-cat-head">
        <span class="eci">${c.icon}</span>
        <h3>${c.name}</h3>
        <span class="err-badge">${wrongCount} 道错题</span>
      </div>
      <div class="err-model-list" data-cat="${c.key}">`;
    models.forEach(m=>{
      const st=exState[m.id];
      h+=`<div class="err-model-row" data-mid="${m.id}" data-cat="${c.key}">
        <span class="emi">${m.icon}</span>
        <span class="emn">${m.name}</span>
        <span class="emc">错 ${st.wrong.size} 题</span>
      </div>`;
    });
    h+=`</div></div>`;
  });
  if(!hasErrors){
    h+=`<div class="err-empty"><div class="big">🎉</div><p>暂无错题！继续做练习，做错的题目会自动收集到这里。</p></div>`;
  }
  h+=`</div>`;
  return h;
}
function bindErrors(){
  content.querySelectorAll(".err-cat-card").forEach(card=>{
    const head=card.querySelector(".err-cat-head");
    head.onclick=()=>{const list=card.querySelector(".err-model-list"); list.classList.toggle("show");};
  });
  content.querySelectorAll(".err-model-row").forEach(r=>r.onclick=()=>{
    state.cat=r.dataset.cat; state.model=r.dataset.mid;
    const mm=getModel(state.model); state.subcat = state.cat==="management"? mm.subcat : null;
    renderSidebar(); renderContent();
    const quizTab=content.querySelector(".tab[data-p='quiz']");
    if(quizTab)quizTab.click();
    setActiveTask(state.cat);
  });
}

/* ---- 学习面板（不变） ---- */
function learnPane(m){
  let h="";
  if(DETAILS[m.id]) h+=`<div class="card"><h3>📚 模型详解</h3><div class="detail">${esc(DETAILS[m.id])}</div></div>`;
  h+=`<div class="points">`+m.points.map(p=>`<div class="point"><h4>${p.h}</h4><p>${p.p}</p></div>`).join("")+`</div>`;
  h+=`<div class="card"><h3>📊 模型图解</h3><div class="sub">${m.chart.type==='matrix'?'结构示意':m.chart.type==='pyramid'?'层次示意':m.chart.type==='channel'?'状态通道':m.chart.type==='ninebox'?'九宫格矩阵':'核心框架'}</div>
      <div class="chart-wrap">${renderChart(m.chart,m)}</div></div>`;
  h+=`<div class="card"><h3>📌 学习案例</h3><div class="sub">结合真实场景理解模型</div>`+
      m.cases.map(c=>`<div class="case"><div class="ct">${c.t}</div><div class="cs">场景：${c.s}</div><div class="ca">分析：${c.a}</div></div>`).join("")+`</div>`;
  return h;
}
function quizPane(m){
  if(!exState[m.id]) exState[m.id]={answered:new Set(),correct:0,wrong:new Set()};
  const qs=m._q||(m._q=genQuestions(m));
  const st=exState[m.id];
  const total=qs.length;
  // 标记错题（如果有错题，排在前面）
  let order=Array.from({length:total},(_,i)=>i);
  if(st.wrong.size>0){
    order.sort((a,b)=>{
      const wa=st.wrong.has(a)?0:1, wb=st.wrong.has(b)?0:1;
      return wa-wb;
    });
  }
  let h=`<div class="ex-head">
      <div class="ex-score">已完成 <b id="exDone">${st.answered.size}</b>/${total} 题 · 正确率 <b id="exAcc">${st.answered.size?Math.round(st.correct/st.answered.size*100):0}%</b>${st.wrong.size?` · <span style="color:#dc2626">错题 ${st.wrong.size}</span>`:''}</div>
      <div class="ex-progress"><i id="exBar" style="width:${st.answered.size/total*100}%"></i></div>
      <button class="btn-reset" id="exReset">重置本题练习</button></div>`;
  h+=order.map((qi,idx)=>{
    const ex=qs[qi]; const isWrong=st.wrong.has(qi); const wasAnswered=st.answered.has(qi);
    let optsHTML=ex.o.map((o,oi)=>{
      let cls="opt"; let lk="";
      if(wasAnswered){cls+=" locked"; if(oi===ex.a)cls+=" correct";}
      return `<div class="${cls}" data-oi="${oi}" data-qi="${qi}"><span class="k">${String.fromCharCode(65+oi)}</span><span>${o}</span></div>`;
    }).join("");
    let exCls="explain";
    if(wasAnswered)exCls+=" show "+(isWrong?"no":"ok");
    let exHTML=wasAnswered?(isWrong?("❌ 正确答案："+String.fromCharCode(65+ex.a)+"。 "):"✅ 回答正确！ ")+ex.e:"";
    return `<div class="quiz" data-i="${qi}">
      <div class="q">${isWrong?'<span style="color:#dc2626;font-weight:800">[错题] </span>':''}${idx+1}. ${ex.q}</div>
      <div class="opts">${optsHTML}</div>
      <div class="explain ${wasAnswered?'show':''} ${wasAnswered?(isWrong?'no':'ok'):''}" id="ex-${qi}">${exHTML}</div></div>`;
  }).join("");
  return h;
}
function bindQuiz(m){
  const pane=document.getElementById("pane-quiz"); if(!pane)return;
  const qs=m._q||(m._q=genQuestions(m));
  const st=exState[m.id]||(exState[m.id]={answered:new Set(),correct:0,wrong:new Set()});
  pane.querySelectorAll(".quiz").forEach(q=>{
    const qi=+q.dataset.i; const ex=qs[qi];
    if(st.answered.has(qi))return; // 已答过的不可再点
    q.querySelectorAll(".opt:not(.locked)").forEach(opt=>opt.onclick=()=>{
      if(st.answered.has(qi))return;
      const oi=+opt.dataset.oi; const correct=oi===ex.a;
      q.querySelectorAll(".opt").forEach(o=>{o.classList.add("locked");if(+o.dataset.oi===ex.a)o.classList.add("correct");});
      if(!correct)opt.classList.add("wrong");
      const box=document.getElementById("ex-"+qi);
      box.className="explain show "+(correct?"ok":"no");
      box.innerHTML=(correct?"✅ 回答正确！ ":"❌ 正确答案："+String.fromCharCode(65+ex.a)+"。 ")+ex.e;
      st.answered.add(qi); if(correct)st.correct++; else st.wrong.add(qi);
      learned.add(m.id); updateExScore(m); renderSidebar(); updateStats(); saveProgress();
    });
  });
  const reset=document.getElementById("exReset");
  if(reset)reset.onclick=()=>{
    exState[m.id]={answered:new Set(),correct:0,wrong:new Set()}; saveProgress(); renderContent();
  };
}
function updateExScore(m){
  const st=exState[m.id]; const qs=m._q||[]; if(!st)return; const total=qs.length;
  const done=document.getElementById("exDone"),acc=document.getElementById("exAcc"),bar=document.getElementById("exBar");
  if(done)done.textContent=st.answered.size;
  if(acc)acc.textContent=(st.answered.size?Math.round(st.correct/st.answered.size*100):0)+"%";
  if(bar)bar.style.width=(st.answered.size/total*100)+"%";
}
function updateStats(){
  const total=Object.values(MODELS).reduce((a,b)=>a+b.length,0);
  document.getElementById("stTotal").textContent=total;
  document.getElementById("stLearned").textContent=learned.size;
  let done=0,correct=0;Object.values(exState).forEach(s=>{done+=s.answered.size;correct+=s.correct;});
  document.getElementById("stAcc").textContent=done?Math.round(correct/done*100)+"%":"—";
}
function welcomeHTML(){
  let h=`<div class="welcome"><div class="big">👋 欢迎来到学习管理工作台</div>
    <p>请选择下方任务栏的模型分类，开始你的模型化学习之旅。共 ${Object.values(MODELS).reduce((a,b)=>a+b.length,0)} 个模型，每模型 30 道案例分析练习题。</p>
    <div class="cat-cards">`;
  h+=CATS.filter(c=>MODELS[c.key]).map(c=>`<div class="cat-card" data-cat="${c.key}"><div class="ci">${c.icon}</div><h3>${c.name}</h3>
      <p>点击进入，浏览模型、图表案例并做练习。</p><div class="cnt">共 ${MODELS[c.key].length} 个模型</div></div>`).join("");
  h+=`</div></div>`; return h;
}
